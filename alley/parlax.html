<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RICHIE.DIGITAL</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #060608; overflow-x: hidden; }
  body { font-family: "Courier New", Courier, monospace; }
  canvas { position: fixed; inset: 0; display: block; z-index: 0; }

  #track { height: 420vh; }

  /* ---------- CRT / broadcast overlay ---------- */
  #crt {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.65) 100%);
    mix-blend-mode: multiply;
  }
  #glitch {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(to bottom, transparent 49%, rgba(255,0,110,0.08) 50%, rgba(0,230,255,0.08) 51%, transparent 52%);
    opacity: 0;
    animation: glitch 7s steps(1) infinite;
  }
  @keyframes glitch {
    0%, 92%, 100% { opacity: 0; transform: translateX(0); }
    92.5% { opacity: 1; transform: translateX(-6px); }
    93% { opacity: 0.6; transform: translateX(4px); }
    93.5% { opacity: 0; transform: translateX(0); }
    96% { opacity: 0.8; transform: translateY(2px); }
    96.3% { opacity: 0; }
  }

</style>
</head>
<body>
  <div id="track"></div>
  <div id="crt"></div>
  <div id="glitch"></div>

  <script src="../vendor/three.min.js"></script>
  <script>
  /* ═══════════════ placeholder-texture helpers ═══════════════
     Tiny canvases + NearestFilter so everything stretches into
     chunky, low-res pixels on purpose — a stand-in for real art,
     in the spirit of a mid-90s FPS parallax background. */
  function chunky(size, draw, repeatX = 1, repeatY = 1) {
    const c = document.createElement("canvas");
    c.width = size.w; c.height = size.h;
    draw(c.getContext("2d"), c.width, c.height);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeatX, repeatY);
    return tex;
  }

  const towerTex = chunky({ w: 8, h: 8 }, (g, w, h) => {
    g.fillStyle = "#171014"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#241a1c"; g.fillRect(0, 0, w, 1);
    g.fillStyle = "#0c0708"; g.fillRect(0, h - 1, w, 1); g.fillRect(3, 2, 1, 3);
    g.fillStyle = "#2c2018"; g.fillRect(5, 5, 1, 1); g.fillRect(1, 4, 1, 1);
  }, 1, 1);

  const moonTex = chunky({ w: 16, h: 16 }, (g, w, h) => {
    g.fillStyle = "#ffe7b0"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#e8bf78";
    [[3,3,2],[9,5,2],[5,10,2],[11,11,1]].forEach(([x,y,r]) => { g.beginPath(); g.arc(x,y,r,0,7); g.fill(); });
  });

  const tileTex = chunky({ w: 12, h: 12 }, (g, w, h) => {
    g.fillStyle = "#1c2420"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#283530"; g.fillRect(0, 0, w, 1); g.fillRect(0, 0, 1, h);
    g.fillStyle = "#0e3028"; g.fillRect(2, 3, 2, 2); g.fillRect(8, 8, 2, 2);
  }, 10, 40);

  const glowTex = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), r = g.createRadialGradient(32,32,0,32,32,32);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.4, "rgba(255,255,255,.35)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  /* ═══════════════ scene ═══════════════ */
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x05060c, 2, 60);

  const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 400);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  scene.add(new THREE.AmbientLight(0x2a2f44, 0.5));

  /* a low flicker so the scene never sits dead-still, even before any scrolling */
  const flickerLight = new THREE.PointLight(0x7a3dff, 1, 40);
  flickerLight.position.set(0, 2, 6);
  scene.add(flickerLight);

  /* retro broadcast-studio grid, always faintly present, scrolling toward camera */
  const grid = new THREE.GridHelper(500, 50, 0x2fe0ff, 0x1a2a40);
  grid.position.y = -2.2;
  grid.material.transparent = true;
  scene.add(grid);

  /* starfield (night / home) */
  const STAR_N = 900;
  const starGeo = new THREE.BufferGeometry();
  const starPos = new Float32Array(STAR_N * 3);
  for (let i = 0; i < STAR_N; i++) {
    const r = 60 + Math.random() * 180, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 2 - 1);
    starPos[i*3] = r * Math.sin(ph) * Math.cos(th);
    starPos[i*3+1] = Math.abs(r * Math.cos(ph)) * 0.6 + 4;
    starPos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xcfe0ff, size: 1.4, transparent: true, sizeAttenuation: true });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* ---------- up: real 3D towers + clouds + moon ---------- */
  const towerBase = new THREE.Color(0x1a1014), towerLit = new THREE.Color(0xe8bf78);
  const towers = [];
  for (let i = 0; i < 12; i++) {
    const w = 5 + Math.random() * 9, d = 5 + Math.random() * 9, h = 16 + Math.random() * 60;
    const z = -45 - Math.random() * 130, x = (Math.random() - 0.5) * (150 + (-z) * 0.5);
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshLambertMaterial({ map: towerTex, color: towerBase.clone(), transparent: true, opacity: 0 });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, h / 2, z);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x030204, transparent: true, opacity: 0 });
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    m.add(edges);
    scene.add(m);
    towers.push({ m, mat, edgeMat, z, local: 0.12 + Math.random() * 0.4 });
  }

  const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 20, 20), new THREE.MeshBasicMaterial({ map: moonTex, fog: false, transparent: true }));
  moon.position.set(22, 95, -150);
  scene.add(moon);
  const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd9a0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  moonHalo.position.copy(moon.position); moonHalo.scale.set(70, 70, 1);
  scene.add(moonHalo);
  const moonLight = new THREE.PointLight(0xffd9a0, 0, 220);
  moonLight.position.copy(moon.position);
  scene.add(moonLight);

  const cloudBase = new THREE.Color(0x44506a), cloudLit = new THREE.Color(0xffe3b0);
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const mat = new THREE.SpriteMaterial({ map: glowTex, color: cloudBase.clone(), transparent: true, opacity: 0, depthWrite: false });
    const s = new THREE.Sprite(mat);
    const x = (Math.random() - 0.5) * 140, y = 55 + Math.random() * 45, z = -40 - Math.random() * 110;
    s.position.set(x, y, z);
    s.scale.set(40 + Math.random() * 50, 18 + Math.random() * 16, 1);
    scene.add(s);
    clouds.push({ s, mat, x, bob: Math.random() * 10, speed: 0.1 + Math.random() * 0.15 });
  }

  /* ash drifting through the wasteland air */
  const ASH_N = 120;
  const ashGeo = new THREE.BufferGeometry();
  const ashPos = new Float32Array(ASH_N * 3);
  for (let i = 0; i < ASH_N; i++) {
    ashPos[i*3] = (Math.random()-0.5)*160; ashPos[i*3+1] = Math.random()*90; ashPos[i*3+2] = -20-Math.random()*160;
  }
  ashGeo.setAttribute("position", new THREE.BufferAttribute(ashPos, 3));
  const ashMat = new THREE.PointsMaterial({ color: 0xffcf8a, size: 0.6, transparent: true, opacity: 0 });
  const ash = new THREE.Points(ashGeo, ashMat);
  scene.add(ash);

  /* ---------- down: duke-nukem-grade sewer ---------- */
  const sewerGroup = new THREE.Group();
  const tunnelLen = 220;
  const wallMat = new THREE.MeshPhongMaterial({ map: tileTex, shininess: 4, specular: 0x113322 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, tunnelLen), wallMat);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, -2, -tunnelLen / 2);
  const ceil = floor.clone(); ceil.position.y = 6.5; ceil.rotation.x = Math.PI / 2;
  const wallL = new THREE.Mesh(new THREE.PlaneGeometry(tunnelLen, 8.5), wallMat);
  wallL.rotation.y = Math.PI / 2; wallL.position.set(-5, 2.2, -tunnelLen / 2);
  const wallR = wallL.clone(); wallR.rotation.y = -Math.PI / 2; wallR.position.x = 5;
  [floor, ceil, wallL, wallR].forEach(m => sewerGroup.add(m));

  const pipeMat = new THREE.MeshPhongMaterial({ color: 0x33413a, shininess: 30 });
  for (let i = 0; i < 2; i++) {
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, tunnelLen, 10), pipeMat);
    pipe.rotation.x = Math.PI / 2;
    pipe.position.set(i ? 4.3 : -4.3, 4.6, -tunnelLen / 2);
    sewerGroup.add(pipe);
  }

  const sewerLights = [];
  for (let z = -4; z > -tunnelLen; z -= 24) {
    const l = new THREE.PointLight(0x3dffb0, 0, 14);
    l.position.set(0, 3, z);
    sewerGroup.add(l);
    sewerLights.push({ l, base: 1.1 + Math.random() * 0.6, phase: Math.random() * 10 });
  }
  scene.add(sewerGroup);

  const SPORE_N = 100;
  const sporeGeo = new THREE.BufferGeometry();
  const sporePos = new Float32Array(SPORE_N * 3);
  for (let i = 0; i < SPORE_N; i++) {
    sporePos[i*3] = (Math.random()-0.5)*8; sporePos[i*3+1] = Math.random()*6-2; sporePos[i*3+2] = -Math.random()*tunnelLen;
  }
  sporeGeo.setAttribute("position", new THREE.BufferAttribute(sporePos, 3));
  const sporeMat = new THREE.PointsMaterial({ color: 0x5dffb8, size: 0.35, transparent: true, opacity: 0 });
  const spores = new THREE.Points(sporeGeo, sporeMat);
  scene.add(spores);

  /* ═══════════════ scroll-driven state ═══════════════ */
  const track = document.getElementById("track");

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function mix(a, b, t) { return a + (b - a) * t; }

  let last = performance.now(), elapsed = 0;
  const skyNight = new THREE.Color(0x05060c), skyUp = new THREE.Color(0x3a1f22), skyDown = new THREE.Color(0x030805);
  const tmpCol = new THREE.Color();

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; elapsed += dt;

    const max = track.offsetHeight - innerHeight;
    const mid = max * 0.48;
    const y = scrollY;
    const up = clamp((mid - y) / (mid * 0.92), 0, 1);
    const down = clamp((y - mid) / ((max - mid) * 0.92), 0, 1);

    camera.position.y = mix(0, 34, smooth(up)) - mix(0, 6, smooth(down));
    camera.position.z = -smooth(down) * (tunnelLen - 20);
    camera.rotation.x = mix(0, 0.14, smooth(up)) - mix(0, 0.05, smooth(down));
    camera.rotation.y = Math.sin(elapsed * 0.09) * 0.045;
    camera.position.x += Math.sin(elapsed * 0.22) * 0.015;

    flickerLight.intensity = 0.85 + Math.sin(elapsed * 9) * 0.25 + Math.sin(elapsed * 2.1) * 0.2 + (Math.random() < 0.015 ? -0.6 : 0);
    starMat.size = 1.3 + Math.sin(elapsed * 2.4) * 0.25;
    grid.position.z = (elapsed * 6) % 10;

    stars.material.opacity = 1 - smooth(up) * 0.7 - smooth(down) * 0.95;
    grid.material.opacity = 0.35 - smooth(up) * 0.25 - smooth(down) * 0.35;

    const moonGlow = smooth(clamp((up - 0.35) / 0.55, 0, 1));
    moon.material.opacity = moonGlow; moon.visible = up > 0.2;
    moonHalo.material.opacity = moonGlow * 0.85;
    moonLight.intensity = moonGlow * 3.4;
    ash.material.opacity = smooth(clamp((up - 0.15) / 0.5, 0, 1)) * 0.8;
    towers.forEach(t => {
      const nearer = clamp((t.z + 175) / 130, 0, 1);
      const local = smooth(clamp((up - t.local) / 0.55, 0, 1));
      const o = local * (0.75 + nearer * 0.25);
      t.mat.opacity = o; t.edgeMat.opacity = o * 0.9;
      tmpCol.copy(towerBase).lerp(towerLit, moonGlow * (0.3 + nearer * 0.7));
      t.mat.color.copy(tmpCol);
    });
    clouds.forEach((c, i) => {
      const local = smooth(clamp((up - 0.1 - i * 0.03) / 0.55, 0, 1));
      c.mat.opacity = local * 0.9;
      tmpCol.copy(cloudBase).lerp(cloudLit, moonGlow);
      c.mat.color.copy(tmpCol);
      c.s.position.x = c.x + Math.sin(elapsed * c.speed + i) * 6;
      c.s.position.y += Math.sin(elapsed * 0.3 + c.bob) * 0.003;
    });

    const dirt = smooth(clamp(down / 0.4, 0, 1));
    sewerGroup.visible = down > 0.01;
    wallMat.color.setScalar(0.4 + dirt * 0.6);
    sewerLights.forEach(sl => {
      sl.l.intensity = dirt * (sl.base + Math.sin(elapsed * 6 + sl.phase) * 0.25 + (Math.random() < 0.02 ? -0.8 : 0));
    });
    spores.material.opacity = dirt * 0.8;
    const sp = spores.geometry.attributes.position;
    for (let i = 0; i < SPORE_N; i++) {
      let yy = sp.getY(i) + dt * 0.4;
      if (yy > 4) yy = -2;
      sp.setY(i, yy);
    }
    sp.needsUpdate = true;

    scene.fog.color.copy(up > down ? skyNight.clone().lerp(skyUp, smooth(up)) : skyNight.clone().lerp(skyDown, smooth(down)));
    scene.fog.far = mix(60, 320, smooth(up)) - smooth(down) * 45;
    renderer.setClearColor(scene.fog.color);

    renderer.render(scene, camera);
  }

  addEventListener("resize", () => {
    const max = track.offsetHeight - innerHeight;
    scrollTo(0, max * 0.48);
  });
  requestAnimationFrame(() => {
    const max = track.offsetHeight - innerHeight;
    scrollTo(0, max * 0.48);
    last = performance.now();
    requestAnimationFrame(frame);
  });
  </script>
</body>
</html>

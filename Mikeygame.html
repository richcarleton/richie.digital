<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Laurentian Echoes: Mikey's Ride - Demo</title>
    <style>
      /* Basic styling for the canvas container */
      body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
      #unity-container { 
        position: absolute; 
        width: 100%; 
        height: 100%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
      }
      #unity-canvas { width: 100%; height: 100%; background: #000; }
      #unity-loading-bar { 
        position: absolute; 
        left: 50%; 
        top: 50%; 
        transform: translate(-50%, -50%); 
        width: 300px; 
        height: 30px; 
        background: #333; 
        border-radius: 5px; 
        overflow: hidden; 
        display: none; /* Hidden until loading starts */
      }
      #unity-progress-bar-full { 
        width: 0%; 
        height: 100%; 
        background: #4CAF50; 
        border-radius: 5px; 
        transition: width 0.1s ease-out; 
      }
      #unity-warning { 
        position: absolute; 
        bottom: 10px; 
        left: 50%; 
        transform: translateX(-50%); 
        color: #FFC107; 
        font-family: sans-serif; 
        font-size: 0.9em; 
        text-align: center; 
        display: none; 
      }
      /* Fullscreen button (optional, but good for immersion) */
      #unity-fullscreen-button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.5);
        color: white;
        border: 1px solid #4CAF50;
        padding: 5px 10px;
        cursor: pointer;
        font-family: sans-serif;
        border-radius: 3px;
        display: none; /* Hidden until game loaded */
      }
      #home-back {
        position: absolute;
        top: 12px;
        right: 14px;
        color: rgba(255,255,255,.85);
        font-family: sans-serif;
        font-size: 12px;
        letter-spacing: .3px;
        text-decoration: none;
        z-index: 10;
      }
      #home-back:hover { color: #fff; }
    </style>
  </head>
  <body>
    <a id="home-back" href="/">&#8592; richie.digital</a>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-warning">Your browser does not support WebGL.</div>
      <button id="unity-fullscreen-button">Fullscreen</button>
    </div>
    <script>
      // Standard Unity WebGL boilerplate script
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') {
          warningBanner.style.background = 'red';
          warningBanner.style.color = 'white';
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build"; // This folder would contain your WebGL build files
      var loaderUrl = buildUrl + "/MikeysRide.loader.js";
      var config = {
        dataUrl: buildUrl + "/MikeysRide.data.unityweb",
        frameworkUrl: buildUrl + "/MikeysRide.framework.js.unityweb",
        codeUrl: buildUrl + "/MikeysRide.wasm.unityweb",
        streamingAssetsUrl: buildUrl + "/MikeysRide.streamingassets.unityweb",
        companyName: "Codespace",
        productName: "Laurentian Echoes: Mikey's Ride",
        productVersion: "0.1 Demo",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill screen
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          fullscreenButton.style.display = "block"; // Show fullscreen button after load
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

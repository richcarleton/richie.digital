<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>xlang panel</title>
<style>
/* Fixed high-contrast palette on purpose: cameras want true black/white, not theme tints.
   Theme tokens are declared identically in every mode so the viewer can't wash them out. */
:root{--k:#000;--w:#f3ede2;--bg:#666;--fid:min(13vmin,96px);--gap:max(4px,.9vmin)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k:#000;--w:#f3ede2}}
:root[data-theme="dark"]{--k:#000;--w:#f3ede2}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--w);display:grid;grid-template-rows:var(--fid) 1fr var(--fid);gap:var(--gap);
  padding:var(--gap) calc(var(--gap) + env(safe-area-inset-right,0px)) var(--gap) calc(var(--gap) + env(safe-area-inset-left,0px));
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif}
.bar{display:grid;grid-template-columns:var(--fid) 1fr var(--fid);gap:var(--gap);min-height:0}
/* fiducials: 6x6 binary grid inside a white quiet zone */
.fid{background:var(--w);padding:14%}
.fid .g{display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);width:100%;height:100%}
.fid .g i,.beacon i{background:var(--k)}
.fid .g i.on,.beacon i.on{background:var(--w)}
/* beacon: 16-bit state frame, white frame = quiet zone */
.beacon{background:var(--w);padding:max(4px,1.2vmin);display:grid;grid-template-columns:repeat(16,1fr);min-width:0}
.beacon i{border:max(1px,.25vmin) solid var(--w)}
.log{display:flex;align-items:center;gap:1.5ch;overflow:hidden;white-space:nowrap;padding:0 1ch;border:max(2px,.4vmin) solid var(--w);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(11px,2.6vmin,24px)}
.log b{flex:none}
.log span{opacity:.55;flex:none}
.log{cursor:pointer}
.log.mute{border-style:dashed}
html.inv{filter:invert(1)}
@media (prefers-reduced-motion:no-preference){html{transition:filter .5s}}
/* command pad */
.pad{display:grid;gap:var(--gap);background:#000;padding:var(--gap);grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);min-height:0}
@media (orientation:portrait){.pad{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}}
.t{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;
  background:var(--c);color:var(--f);cursor:pointer;min-height:0;overflow:hidden}
.t:focus-visible{outline:max(3px,.6vmin) dashed var(--w);outline-offset:calc(var(--gap) * -.5)}
.t svg{width:42%;height:42%;flex:none}
.t .lb{font-size:clamp(12px,3.4vmin,30px);letter-spacing:.04em}
.t .hx{position:absolute;top:6%;left:6%;font:700 clamp(10px,2vmin,18px) ui-monospace,Menlo,monospace}
.t .bits{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:max(2px,.5vmin)}
.t .bits u{width:max(8px,2.2vmin);height:max(8px,2.2vmin);border:max(2px,.35vmin) solid currentColor}
.t .bits u.on{background:currentColor}
.t.hit,.t.held{background:var(--f);color:var(--c)}
@media (prefers-reduced-motion:no-preference){.t{transition:background .08s,color .08s}}
</style>
</head>
<body>
<div class="bar">
  <div class="fid" data-id="0"></div>
  <div class="beacon" id="beacon" aria-label="state beacon"></div>
  <div class="fid" data-id="1"></div>
</div>
<div class="pad" id="pad"></div>
<div class="bar">
  <div class="fid" data-id="2"></div>
  <div class="log" id="log"><b>idle · tap a tile or press 0–9 a b · tap here to mute</b></div>
  <div class="fid" data-id="3"></div>
</div>
<script>
// Shape + 4-bit bar are redundant channels for mono cameras and bad white balance.
const S={
 oct:'<polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30"/>',
 dot:'<circle cx="50" cy="50" r="42"/>',
 scan:'<g fill="none" stroke="currentColor" stroke-width="10"><circle cx="50" cy="50" r="32"/><path d="M50 0v100M0 50h100"/></g>',
 play:'<polygon points="18,8 92,50 18,92"/>',
 up:'<polygon points="50,4 96,50 70,50 70,96 30,96 30,50 4,50"/>',
 ok:'<polyline points="8,52 38,82 94,18" fill="none" stroke="currentColor" stroke-width="14"/>',
 lt:'<polygon points="4,50 50,4 50,30 96,30 96,70 50,70 50,96"/>',
 rt:'<polygon points="96,50 50,4 50,30 4,30 4,70 50,70 50,96"/>',
 dn:'<polygon points="50,96 96,50 70,50 70,4 30,4 30,50 4,50"/>',
 ring:'<circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="12"/>',
 home:'<polygon points="50,4 96,46 80,46 80,96 20,96 20,46 4,46"/>',
 no:'<path d="M12 12L88 88M88 12L12 88" stroke="currentColor" stroke-width="14"/>'
};
const CMD=[ // [label, shape] — portrait rows 2–3 form a d-pad: FWD over BACK, LEFT/RIGHT flanking
 ['STOP','oct'],['HOME','home'],['SCAN','scan'],['GO','play'],
 ['FWD','up'],['ACK','ok'],['LEFT','lt'],['BACK','dn'],
 ['RIGHT','rt'],['OPEN','ring'],['GRIP','dot'],['DENY','no']
];
// Warm, softened palette: same 30° spacing (robot still bins by hue), rotated +8° warm, 66% sat.
const HUE=id=>id*30+8,SAT=.66,LIT=.5;
function ink(h){ // pick black or warm-white text by luminance
  const a=SAT*Math.min(LIT,1-LIT),f=n=>{const k=(n+h/30)%12;return LIT-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return .2126*f(0)+.7152*f(8)+.0722*f(4)>.42?'#000':'var(--w)';
}
const FID=[0xB26D,0x5A3C,0xC9A6,0x3E51]; // 4x4 payloads, black border added below

document.querySelectorAll('.fid').forEach(el=>{
  const p=FID[+el.dataset.id],g=document.createElement('div');g.className='g';
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){
    const i=document.createElement('i'),edge=r==0||c==0||r==5||c==5;
    if(!edge&&(p>>(15-((r-1)*4+(c-1))))&1)i.className='on';g.appendChild(i);
  }el.appendChild(g);
});

const beacon=document.getElementById('beacon');
for(let i=0;i<16;i++)beacon.appendChild(document.createElement('i'));
let seq=0,clk=0;
// frame: [start=1][clock][cmd:4][seq:8][parity][stop=0]
function frame(id){
  const b=[1,clk];for(let k=3;k>=0;k--)b.push(id>>k&1);for(let k=7;k>=0;k--)b.push(seq>>k&1);
  b.push(b.slice(1).reduce((a,x)=>a^x,0));b.push(0);
  [...beacon.children].forEach((c,i)=>c.classList.toggle('on',!!b[i]));
}
frame(15); // 0xF = idle

const pad=document.getElementById('pad'),log=document.getElementById('log'),hist=[];
CMD.forEach(([lb,sh],id)=>{
  const t=document.createElement('button');t.className='t';t.setAttribute('aria-label',lb);
  t.style.setProperty('--c',`hsl(${HUE(id)},${SAT*100}%,${LIT*100}%)`);t.style.setProperty('--f',ink(HUE(id)));
  t.innerHTML=`<span class="hx">${id.toString(16).toUpperCase()}</span><svg viewBox="0 0 100 100" fill="currentColor">${S[sh]}</svg><span class="lb">${lb}</span><span class="bits">${[3,2,1,0].map(k=>`<u class="${id>>k&1?'on':''}"></u>`).join('')}</span>`;
  t.addEventListener('pointerdown',e=>{e.preventDefault();try{t.setPointerCapture(e.pointerId)}catch(_){}t.classList.add('held');press('p'+e.pointerId,id)});
  ['pointerup','pointercancel'].forEach(ev=>t.addEventListener(ev,e=>{t.classList.remove('held');release('p'+e.pointerId)}));
  t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(e.repeat)return;t.classList.add('held');press('t'+id,id);if(phase===2&&id===PORTAL)go()}});
  t.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' '){t.classList.remove('held');release('t'+id)}});
  t.addEventListener('click',()=>{if(phase===2&&id===PORTAL)go()});
  pad.appendChild(t);
});

function send(id){
  seq=(seq+1)&255;clk^=1;frame(id);
  const t=pad.children[id];t.classList.add('hit');setTimeout(()=>t.classList.remove('hit'),220);
  try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
  hist.unshift(`${String(seq).padStart(3,'0')}:${CMD[id][0]}`);hist.length=Math.min(hist.length,8);
  log.innerHTML=`<b>▸ ${hist[0]}</b>`+hist.slice(1).map(h=>`<span>${h}</span>`).join('');
  taps++;evolve();
  dispatchEvent(new CustomEvent('xlang',{detail:{id,cmd:CMD[id][0],seq}})); // hook: wire to WS/serial here
}
addEventListener('keydown',e=>{if(e.key==='m'){setMute(!muted);return}const n=parseInt(e.key,16);if(!isNaN(n)&&n<12&&!e.target.closest('.t')&&!e.repeat){pad.children[n].classList.add('held');press('g'+n,n);if(phase===2&&n===PORTAL)go()}});
addEventListener('keyup',e=>{const n=parseInt(e.key,16);if(!isNaN(n)&&n<12){pad.children[n].classList.remove('held');release('g'+n)}});
addEventListener('blur',()=>{voices.forEach(v=>v.stop());voices.clear();document.querySelectorAll('.held').forEach(t=>t.classList.remove('held'))});

// ── audio: real DTMF pairs (Goertzel-decodable) + chirp + parallel bitcrush grit
const ROW=[697,770,852,941],COL=[1209,1336,1477,1633];
let ac,crush,muted=false;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  crush=ac.createWaveShaper();const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.round(x*6)/6} // ~3-bit staircase
  crush.curve=c;const cg=ac.createGain();cg.gain.value=.22;crush.connect(cg).connect(ac.destination);
}
function voice(id){ // sustains while held; after 150 ms the pair glides down an octave
  if(muted)return{stop(){}};if(!ac)initAudio();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime+.005,env=ac.createGain(),dry=ac.createGain();
  env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(.18,t+.004);
  dry.gain.value=.8;env.connect(dry).connect(ac.destination);env.connect(crush);
  const ch=ac.createOscillator();ch.type='square';
  ch.frequency.setValueAtTime(1800*PITCH,t);ch.frequency.exponentialRampToValueAtTime((phase?900:3400)*PITCH,t+.025);
  const chg=ac.createGain();chg.gain.value=.25;ch.connect(chg).connect(env);ch.start(t);ch.stop(t+.025);
  const oscs=[ROW[id>>2],COL[id&3]].map(f=>{const o=ac.createOscillator(),b=f*PITCH;
    o.frequency.setValueAtTime(b,t+.03);o.frequency.setValueAtTime(b,t+.18);o.frequency.exponentialRampToValueAtTime(b*.5,t+2.2);
    o.connect(env);o.start(t+.03);return o});
  return{stop(){const n=Math.max(ac.currentTime,t+.15); // quick taps still get a full beep
    env.gain.cancelScheduledValues(n);env.gain.setValueAtTime(.18,n);env.gain.linearRampToValueAtTime(0,n+.06);
    oscs.forEach(o=>o.stop(n+.07))}};
}
const voices=new Map();
function press(key,id){if(voices.has(key))return;voices.set(key,voice(id));send(id)}
function release(key){const v=voices.get(key);if(v){v.stop();voices.delete(key)}}
function setMute(m){muted=m;log.classList.toggle('mute',m);if(!hist.length)log.innerHTML=`<b>${m?'muted':'idle'} · tap a tile or press 0–9 a b</b>`}
// ── easter egg: 24 taps → future runes + octave down; 34 taps → invert + portal home
let taps=0,phase=0,PITCH=1;const PORTAL=1;
const RUNE=[ // [stroke path, node x, node y]
 ['M50 6V94M22 24L78 76M78 24L22 76',50,50],['M32 6V94M32 10L72 36L32 62M72 36V76',72,76],
 ['M50 6V94M50 30L20 10M50 30L80 10M50 70L20 90',80,10],['M30 6V94M70 6V94M30 30L70 60',70,60],
 ['M50 6V94M50 20L78 44M50 44L78 68',78,44],['M20 20L50 50L80 20M50 50V94M35 75H65',50,50],
 ['M26 6V94M26 30L74 70V94',74,70],['M50 6L80 50L50 94L20 50ZM50 30V70',50,50],
 ['M28 6V94M72 6V94M28 50L72 20M28 80L72 50',28,80],['M50 6V94M20 50H80M28 22L72 78',72,78],
 ['M20 94L50 6L80 94M35 60H65',50,6],['M30 6V94M30 50L74 20M30 50L74 80M74 20V80',30,50]
];
const rune=i=>{const[d,x,y]=RUNE[i];return `<path d="${d}" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square"/><circle cx="${x}" cy="${y}" r="8"/>`};
const PORTAL_SVG='<g fill="none" stroke="currentColor" stroke-width="7"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="26"/></g><circle cx="50" cy="50" r="10"/>';
function sweep(f0,f1){ // descending "system shift" groan
  if(muted)return;if(!ac)initAudio();const t=ac.currentTime+.16,o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.5);
  g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.55);o.connect(g);g.connect(ac.destination);g.connect(crush);o.start(t);o.stop(t+.56);
}
function evolve(){
  if(taps===24){phase=1;PITCH=.5;[...pad.children].forEach((t,i)=>t.querySelector('svg').innerHTML=rune(i));sweep(900,120)}
  if(taps===34){phase=2;PITCH=.4;document.documentElement.classList.add('inv');
    const t=pad.children[PORTAL];t.querySelector('.lb').textContent='RICHIE';t.querySelector('svg').innerHTML=PORTAL_SVG;
    t.setAttribute('aria-label','Open richie.digital');sweep(600,50)}
}
function go(){const a=document.createElement('a');a.href='https://richie.digital';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
log.addEventListener('pointerdown',()=>setMute(!muted));
window.xlang={send,press,release,CMD,setMute};
</script>
</body>
</html>

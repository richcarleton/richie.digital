<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tai Chi Dancer</title>
<style>
  :root { --ink:#e8e4dc; --dim:#7d7a73; --bg:#15181a; --accent:#8fb3a3; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
  }
  h1 { font-size:15px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:0; }
  svg { background:#191d1f; border-radius:10px; }
  .panel { width:320px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:8px; align-items:center; }
  button, select {
    background:#22282a; color:var(--ink); border:1px solid #2f3639;
    border-radius:6px; padding:7px 11px; font:inherit; cursor:pointer;
  }
  button:hover, select:hover { border-color:var(--accent); }
  select { flex:1; }
  #speed { flex:1; accent-color:var(--accent); }
  .bar { height:3px; background:#262c2e; border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); width:0; }
  .meta { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }
</style>
</head>
<body>

<h1>Tai Chi Dancer</h1>

<svg id="stage" width="320" height="340" viewBox="-100 -150 200 212">
  <ellipse cx="0" cy="70" rx="46" ry="6" fill="#000" opacity=".28"/>
  <g id="root" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" fill="none">
    <g id="legL"><line x1="0" y1="0" x2="0" y2="34"/><g transform="translate(0,34)" id="kneeL"><line x1="0" y1="0" x2="0" y2="34"/></g></g>
    <g id="legR"><line x1="0" y1="0" x2="0" y2="34"/><g transform="translate(0,34)" id="kneeR"><line x1="0" y1="0" x2="0" y2="34"/></g></g>
    <g id="body">
      <line x1="0" y1="0" x2="0" y2="-66"/>
      <circle cx="0" cy="-84" r="12" fill="#191d1f"/>
      <g transform="translate(0,-62)">
        <g id="armL"><line x1="0" y1="0" x2="0" y2="30"/><g transform="translate(0,30)" id="elbowL"><line x1="0" y1="0" x2="0" y2="28"/></g></g>
        <g id="armR"><line x1="0" y1="0" x2="0" y2="30"/><g transform="translate(0,30)" id="elbowR"><line x1="0" y1="0" x2="0" y2="28"/></g></g>
      </g>
    </g>
  </g>
</svg>

<div class="panel">
  <div class="row">
    <select id="form"></select>
    <button id="play">Pause</button>
  </div>
  <div class="row">
    <button id="prev">◀</button>
    <button id="next">▶</button>
    <button id="reset">Reset</button>
    <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1">
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="meta"><span id="pose">—</span><span id="rate">1.00×</span></div>
</div>

<script>
const D = {lean:0,shift:0,lsh:0,lel:0,rsh:0,rel:0,lhip:14,lkn:-6,rhip:-14,rkn:6};
const P = o => Object.assign({}, D, o);

const forms = {
  "Cloud Hands": [
    P({shift:-10,lean:-4,lsh:100,lel:50,rsh:-40,rel:-70}),
    P({lsh:70,lel:30,rsh:-70,rel:-30}),
    P({shift:10,lean:4,lsh:40,lel:70,rsh:-100,rel:-50}),
    P({lsh:70,lel:30,rsh:-70,rel:-30})
  ],
  "White Crane Spreads Wings": [
    P({lsh:20,lel:10,rsh:-20,rel:-10}),
    P({lean:-3,lsh:90,lel:20,rsh:-60,rel:-20}),
    P({lsh:150,lel:10,rsh:-25,rel:-30,lhip:5,lkn:-4,rhip:-26,rkn:10}),
    P({lsh:110,lel:25,rsh:-30,rel:-15})
  ],
  "Single Whip": [
    P({lsh:60,lel:40,rsh:-60,rel:-40}),
    P({lsh:120,lel:25,rsh:-110,rel:-25}),
    P({shift:-12,lsh:135,lel:15,rsh:-120,rel:-60,lhip:22,lkn:-10,rhip:-6,rkn:4}),
    P({shift:-8,lsh:125,lel:20,rsh:-115,rel:-50})
  ],
  "Grasp the Sparrow's Tail": [
    P({lsh:55,lel:75,rsh:-25,rel:-30}),
    P({lean:5,shift:8,lsh:30,lel:40,rsh:-70,rel:-60}),
    P({lean:-3,shift:-6,lsh:70,lel:80,rsh:-75,rel:-75}),
    P({shift:-10,lsh:95,lel:30,rsh:-95,rel:-30})
  ]
};

const el = id => document.getElementById(id);
const keys = Object.keys(D);
const STEP = 3200;

let name = "Cloud Hands", i = 0, t = 0, playing = true, speed = 1, last = 0, blend = null, cur = forms[name][0];

const ease = u => u*u*(3-2*u);
const mix = (a,b,u) => { const o={}; for (const k of keys) o[k] = a[k] + (b[k]-a[k])*u; return o; };

function draw(p){
  cur = p;
  el("root").setAttribute("transform", `translate(${p.shift},0)`);
  el("body").setAttribute("transform", `rotate(${p.lean})`);
  el("armL").setAttribute("transform", `rotate(${p.lsh})`);
  el("elbowL").setAttribute("transform", `translate(0,30) rotate(${p.lel})`);
  el("armR").setAttribute("transform", `rotate(${p.rsh})`);
  el("elbowR").setAttribute("transform", `translate(0,30) rotate(${p.rel})`);
  el("legL").setAttribute("transform", `rotate(${p.lhip})`);
  el("kneeL").setAttribute("transform", `translate(0,34) rotate(${p.lkn})`);
  el("legR").setAttribute("transform", `rotate(${p.rhip})`);
  el("kneeR").setAttribute("transform", `translate(0,34) rotate(${p.rkn})`);
}

function loop(ts){
  const dt = last ? ts - last : 0; last = ts;
  const seq = forms[name];
  if (blend) {
    blend.u += dt * speed / 1400;
    if (blend.u >= 1) { blend = null; draw(seq[0]); }
    else draw(mix(blend.from, seq[0], ease(blend.u)));
  } else {
    if (playing) { t += dt * speed / STEP; while (t >= 1) { t -= 1; i = (i+1) % seq.length; } }
    draw(mix(seq[i], seq[(i+1) % seq.length], ease(t)));
  }
  el("fill").style.width = ((i + t) / seq.length * 100) + "%";
  el("pose").textContent = `${name} · pose ${i+1}/${seq.length}`;
  requestAnimationFrame(loop);
}

const sel = el("form");
for (const k in forms) sel.add(new Option(k, k));
sel.onchange = e => { blend = {from: cur, u: 0}; name = e.target.value; i = 0; t = 0; };

el("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; };
el("reset").onclick = () => { i = 0; t = 0; };
el("next").onclick = () => { i = (i+1) % forms[name].length; t = 0; };
el("prev").onclick = () => { i = (i-1+forms[name].length) % forms[name].length; t = 0; };
el("speed").oninput = e => { speed = +e.target.value; el("rate").textContent = speed.toFixed(2) + "×"; };

requestAnimationFrame(loop);
</script>
</body>
</html>

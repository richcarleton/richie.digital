<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>snapr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,700;1,800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#d9dbdd; --floor-2:#b9bcc0;
  --metal-top:#a9b9cc; --metal-mid:#bcc5cf; --metal-bot:#c9ccd0; --metal-edge:#6f7c8c;
  --ink:#1f2b39; --ink-dim:rgba(31,43,57,.62);
  --rubber:#2c3036; --rubber-hi:#3d434b; --rubber-txt:#e4e8ec;
  --tap:#c4452f; --tap-hi:#dd5b43; --tap-lo:#8e2c1d;
  --lcd:#bfc8ae; --lcd-ink:#1b231c; --lcd-ghost:rgba(27,35,28,.08);
  --led:#ff3b2a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --floor:#26282c; --floor-2:#141517; } }
:root[data-theme="dark"]{ --floor:#26282c; --floor-2:#141517; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--floor-2) radial-gradient(ellipse 80% 70% at 50% 35%, var(--floor), var(--floor-2));
  display:grid; place-items:center; overflow:hidden;
  font-family:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; font-weight:500;
  color:var(--ink); user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}

/* brushed metal body */
.unit{
  position:relative; width:min(92vw,390px); height:min(calc(100% - 20px),720px);
  display:flex; flex-direction:column; gap:clamp(8px,1.5vh,14px);
  padding:clamp(14px,2.2vh,20px) 20px clamp(16px,2.4vh,22px);
  border-radius:26px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,.035) 1px 2px, transparent 2px 4px),
    linear-gradient(172deg, var(--metal-top), var(--metal-mid) 45%, var(--metal-bot));
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(0,0,0,.18),
    inset 0 0 0 1px rgba(255,255,255,.25),
    0 3px 0 var(--metal-edge), 0 20px 32px rgba(0,0,0,.35);
}
header{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{margin:0;font:italic 800 clamp(24px,4vh,30px)/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.02em}
.brand small{font:700 11px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.14em;color:var(--ink-dim);margin-left:8px;font-style:normal}
.led{width:12px;height:12px;border-radius:50%;background:#5a1f18;
  box-shadow:inset 0 -2px 2px rgba(0,0,0,.45),0 0 0 2px rgba(0,0,0,.25),0 1px 0 3px rgba(255,255,255,.35)}
.led.on{background:var(--led);box-shadow:inset 0 -2px 2px rgba(0,0,0,.2),0 0 0 2px rgba(0,0,0,.25),0 0 12px 4px rgba(255,59,42,.6)}

/* LCD */
.bezel{border-radius:12px;padding:7px;background:linear-gradient(#27303b,#3a4552);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6)}
.lcd{position:relative;border-radius:6px;padding:8px 12px 10px;color:var(--lcd-ink);
  background:linear-gradient(170deg,#c9d2b8,var(--lcd) 60%,#b3bca2);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.28);
  font-family:"Share Tech Mono",ui-monospace,monospace}
.lcd-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.lcd-top b{font-weight:400;font-size:17px}
.lcd-mid{position:relative;display:flex;justify-content:center;align-items:baseline;gap:8px;margin:2px 0 4px}
.digits{position:relative;font-size:clamp(46px,8.4vh,66px);line-height:1;letter-spacing:.04em}
.digits .ghost{position:absolute;inset:0;color:var(--lcd-ghost)}
.digits .val{position:relative;white-space:pre}
.lcd-mid .u{font-size:15px}
.beatsegs{display:flex;gap:8px}
.seg{flex:1;height:9px;border-radius:2px;background:var(--lcd-ghost)}
.seg.soft{background:rgba(27,35,28,.55)}
.seg.on{background:var(--lcd-ink);height:9px;box-shadow:0 0 0 1px var(--lcd-ink)}

/* rubber keys */
.key{height:44px;border-radius:12px;background:linear-gradient(var(--rubber-hi),var(--rubber));color:var(--rubber-txt);
  font-weight:700;font-size:17px;box-shadow:0 3px 0 #15171a,0 5px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.key:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 #15171a,0 2px 3px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.key:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center}
.row .key{flex:1}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ink-dim);text-align:center;margin:0 0 -4px}

/* jog dial */
.selector{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,22px)}
.chev{width:44px;flex:none;font-size:24px}
.dial{position:relative;width:clamp(96px,15vh,118px);aspect-ratio:1}
.tick{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--ink-dim)}
.tick.cur{width:8px;height:8px;margin:-4px;background:var(--ink)}
.knob{position:absolute;inset:16%;border-radius:50%;touch-action:none;
  background:
    repeating-conic-gradient(from 0deg,rgba(255,255,255,.18) 0 2deg,rgba(0,0,0,.08) 2deg 6deg),
    radial-gradient(circle at 38% 30%,#f2f4f6,#aab3be 60%,#7c8795);
  box-shadow:0 3px 0 #5d6876,0 8px 12px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.5)}
.knob::after{content:"";position:absolute;inset:26%;border-radius:50%;
  background:radial-gradient(circle at 42% 36%,#e9edf1,#a3adb9);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.pointer{position:absolute;inset:0;z-index:1;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.pointer::before{content:"";position:absolute;left:50%;top:7%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:var(--tap);box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.desc{margin:-2px 0 0;text-align:center;font-size:14px;color:var(--ink-dim);min-height:1.3em}

/* tap */
.tapwrap{flex:1;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tap{width:min(42vw,160px);height:clamp(56px,9vh,70px);border-radius:16px;touch-action:none;
  background:linear-gradient(var(--tap-hi),var(--tap));color:#fff3ef;
  font:italic 800 24px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.06em;
  box-shadow:0 5px 0 var(--tap-lo),0 8px 12px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .04s,box-shadow .04s}
.tap.down{transform:translateY(5px);box-shadow:0 0 0 var(--tap-lo),0 2px 4px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.hint{margin:0;text-align:center;font-size:clamp(14px,2.1vh,16px);line-height:1.3;min-height:2.6em;max-width:30ch}
.stop{flex:none;width:96px}
</style>
</head>
<body>
<main class="unit">
  <header>
    <p class="brand">snapr<small>TAP METRONOME</small></p>
    <div class="led" id="led" aria-hidden="true"></div>
  </header>

  <div class="bezel">
    <div class="lcd" aria-live="polite">
      <div class="lcd-top"><b id="pname"></b><span id="syncv"></span></div>
      <div class="lcd-mid">
        <div class="digits"><span class="ghost" aria-hidden="true">888</span><span class="val bpm" id="bpm">---</span></div>
        <span class="u">BPM</span>
      </div>
      <div class="beatsegs" aria-hidden="true"><span class="seg"></span><span class="seg"></span><span class="seg"></span><span class="seg"></span></div>
    </div>
  </div>

  <div class="row">
    <button class="key" id="slower" aria-label="Slower by one beat per minute">− tempo</button>
    <button class="key" id="faster" aria-label="Faster by one beat per minute">tempo +</button>
  </div>
  <div class="row">
    <button class="key" id="earlier">sync earlier</button>
    <button class="key" id="later">sync later</button>
  </div>

  <div class="selector">
    <button class="key chev" id="prev" aria-label="Previous rhythm">‹</button>
    <div class="dial" id="dial">
      <button class="knob" id="knob"><span class="pointer" id="pointer"></span></button>
    </div>
    <button class="key chev" id="next" aria-label="Next rhythm">›</button>
  </div>
  <p class="desc" id="desc"></p>

  <div class="tapwrap">
    <div class="row">
      <button class="tap" id="foot" aria-label="Tap tempo">tap</button>
      <button class="key stop" id="stop" disabled>stop</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</main>
<script>
(() => {
  // on-screen error trap for phone debugging
  const showErr = e => { const h = document.getElementById('hint'); if (h) h.textContent = 'Error: ' + (e && e.message || e); };
  addEventListener('error', e => showErr(e.error || e.message));
  addEventListener('unhandledrejection', e => showErr(e.reason));

  // ---- tunables ----
  const STEPS = 16;             // sixteenths per bar of 4
  const TAPS_TO_START = 4;
  const TAP_RESET_MS = 2000;
  const MIN_IV = 60 / 260, MAX_IV = 60 / 30;
  const LOOKAHEAD = 0.12, TICK_MS = 25;
  const VEL = { X: 1, x: 0.7, o: 0.4 };

  // Lanes are 16 sixteenths: X loud, x medium, o soft, . rest.  swing = where the "and" lands (0.5 straight, 0.66 shuffle)
  const PATTERNS = [
    { name: 'thumb',       desc: 'snap on two and four',
      lanes: { snap:  '....X.......X...' } },
    { name: 'kick',        desc: 'bass drum on one and three',
      lanes: { kick:  'X.......X.......' } },
    { name: 'stomp slap',  desc: 'foot on one and three, table on two and four',
      lanes: { stomp: 'X.......X.......', slap: '....X.......X...' } },
    { name: 'four',        desc: 'bass drum on every beat',
      lanes: { kick:  'X...X...X...X...' } },
    { name: 'stomp stomp', desc: 'stomp stomp slap, twice a bar',
      lanes: { stomp: 'X.x.....X.x.....', slap: '....X.......X...' } },
    { name: 'shaker',      desc: 'egg shaker sixteenths, pushed on the ands',
      lanes: { shake: 'oxXxoxXxoxXxoxXx' } },
    { name: 'tambourine',  desc: 'eighths, leaning on two and four',
      lanes: { tamb:  'o.o.X.o.o.o.X.o.' } },
    { name: 'clap hat',    desc: 'clap on two and four over a light hat',
      lanes: { hat: 'x.o.x.o.x.o.x.o.', clap: '....X.......X...', kick: 'o.......o.......' } },
    { name: 'shuffle',     desc: 'swung hat, rim click on two and four', swing: 0.66,
      lanes: { hat: 'x.o.x.o.x.o.x.o.', rim: '....X.......X...', kick: 'o.......o.......' } },
    { name: 'brushes',     desc: 'swung brush swishes, easy jazz', swing: 0.66,
      lanes: { swish: 'o.o.x.o.o.o.x.o.', kick: 'o.......o.......' } },
    { name: 'bossa',       desc: 'rim clave with a soft dotted kick',
      lanes: { rim: 'x..x..x...x..x..', kick: 'o..oo..oo..oo..o', shake: 'o.o.o.o.o.o.o.o.' } },
  ];
  const N = PATTERNS.length;
  const angleOf = i => -135 + i * 270 / (N - 1);

  // ---- audio ----
  let ctx, master, bus, noise;
  function initAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    ctx.onstatechange = () => render();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ctx.destination);
    newBus();
    const len = Math.floor(ctx.sampleRate * 0.5);
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  // Phones only count touch *release* (not touch-down) as permission to play sound,
  // and in-app viewers can be stricter still — so unlock on every release-type event.
  function unlock() {
    initAudio();
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    const b = ctx.createBufferSource(); b.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
    b.connect(ctx.destination); b.start(0);
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(t =>
    addEventListener(t, unlock, { capture: true, passive: true }));

  function newBus() {
    if (bus) bus.gain.setTargetAtTime(0, ctx.currentTime, 0.006);
    bus = ctx.createGain(); bus.connect(master);
  }
  const latency = () => (ctx && (ctx.outputLatency || ctx.baseLatency)) || 0;

  // Map a performance.now() moment to the audio-clock time that is *heard* at that moment
  function heardAt(p) {
    const simple = ctx.currentTime - latency() + (p - performance.now()) / 1000;
    const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
      const precise = ts.contextTime + (p - ts.performanceTime) / 1000;
      if (Math.abs(precise - simple) < 0.25) return precise;   // some phones report junk here
    }
    return simple;
  }

  function env(t, peak, decay, att = 0.002) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + att + decay);
    g.connect(bus); return g;
  }
  function nz(t, type, freq, q, peak, decay, att) {
    const s = ctx.createBufferSource(); s.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    s.connect(f); f.connect(env(t, peak, decay, att));
    s.start(t, Math.random() * 0.25); s.stop(t + (att || 0.002) + decay + 0.02);
  }
  function tn(t, type, f0, f1, sweep, peak, decay) {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + sweep);
    o.connect(env(t, peak, decay)); o.start(t); o.stop(t + decay + 0.03);
  }
  const VOICES = {
    snap:  (t, v) => { nz(t,'bandpass',2600,1.8,.9*v,.055); nz(t,'highpass',5000,.7,.35*v,.012); tn(t,'sine',1900,1200,.02,.12*v,.03); },
    kick:  (t, v) => { tn(t,'sine',150,46,.12,1*v,.42); nz(t,'lowpass',1800,.7,.22*v,.012); },
    stomp: (t, v) => { tn(t,'sine',100,40,.07,.85*v,.26); nz(t,'lowpass',420,.8,.7*v,.09); },
    slap:  (t, v) => { nz(t,'bandpass',1150,.9,.85*v,.13); nz(t,'highpass',3200,.7,.4*v,.025); tn(t,'triangle',210,160,.06,.35*v,.09); },
    shake: (t, v) => { nz(t,'highpass',6000,.7,.4*v,.055,.012); },
    hat:   (t, v) => { nz(t,'highpass',7500,.8,.32*v,.035); nz(t,'bandpass',10000,1.5,.15*v,.02); },
    tamb:  (t, v) => { for (let k = 0; k < 3; k++) nz(t + k*.011,'bandpass',6800,3,.28*v,.06);
                       nz(t,'highpass',9000,.7,.16*v,.13); },
    clap:  (t, v) => { for (let k = 0; k < 3; k++) nz(t + k*.009,'bandpass',1500,1,.6*v,.014);
                       nz(t + .027,'bandpass',1400,.8,.5*v,.12); },
    rim:   (t, v) => { tn(t,'triangle',1700,1650,.02,.4*v,.03); tn(t,'sine',820,800,.02,.35*v,.05); nz(t,'highpass',3000,.7,.25*v,.008); },
    swish: (t, v) => { nz(t,'bandpass',3600,.6,.36*v,.14,.035); },
    tick:  (t)    => { tn(t,'sine',1250,1250,0,.12,.03); },
  };

  // ---- state ----
  let pattern = PATTERNS.findIndex(p => p.name === 'shaker'), playing = false, interval = 0, nextTime = 0, step = 0, timer = null;
  let taps = [], tapCount = 0;
  let syncMs = 0;
  try { syncMs = +localStorage.getItem('snapr.sync') || 0; } catch (e) {}
  const visQ = [];

  function scheduler() {
    const pat = PATTERNS[pattern];
    const swingOff = ((pat.swing || 0.5) - 0.5) * interval;
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      const t = nextTime + (step % 4 === 2 ? swingOff : 0);
      let hit = false;
      for (const voice in pat.lanes) {
        const v = VEL[pat.lanes[voice][step]];
        if (v && t > ctx.currentTime) { VOICES[voice](t, v); hit = true; }
      }
      visQ.push({ t, step, hit });
      nextTime += interval / 4;
      step = (step + 1) % STEPS;
    }
  }
  function start() {
    playing = true;
    clearInterval(timer); timer = setInterval(scheduler, TICK_MS);
    scheduler(); render();
  }
  function stop() {
    playing = false; clearInterval(timer); timer = null;
    taps = []; tapCount = 0; visQ.length = 0;
    if (ctx) newBus();
    lightBeat(-1, ''); render();
  }

  // pt = performance.now()-based timestamp of the touch
  function tap(pt) {
    initAudio();
    if (ctx.state !== 'running') ctx.resume();
    const last = taps[taps.length - 1];
    if (last !== undefined && pt - last < 80) return;              // double-fire guard
    if (last !== undefined && pt - last > TAP_RESET_MS) { taps = []; tapCount = 0; }
    taps.push(pt); if (taps.length > 5) taps.shift();
    tapCount++;
    const beat = (tapCount - 1) % 4;

    if (taps.length >= 2) {
      const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1) / 1000;
      if (iv >= MIN_IV && iv <= MAX_IV) interval = iv;
    }
    if (!playing) { VOICES.tick(ctx.currentTime); lightBeat(beat, 'soft'); }

    if (tapCount >= TAPS_TO_START && interval) {
      const go = () => {
        newBus(); visQ.length = 0;
        nextTime = heardAt(pt + interval * 1000) + syncMs / 1000;
        step = ((beat + 1) % 4) * 4;
        if (!(nextTime > ctx.currentTime - 2 && nextTime < ctx.currentTime + 3))  // clock sanity
          nextTime = ctx.currentTime + 0.05;
        while (nextTime < ctx.currentTime + 0.005) { nextTime += interval / 4; step = (step + 1) % STEPS; }
        if (!playing) start(); else scheduler();
      };
      if (ctx.state === 'running') go();
      else ctx.resume().then(go).catch(showErr);   // phone audio can take a moment to wake up
    }
    render();
  }

  function nudge(d) {
    if (!interval) return;
    const bpm = Math.min(260, Math.max(30, Math.round(60 / interval) + d));
    interval = 60 / bpm; render();
  }
  function setSync(d) {
    syncMs = Math.max(-200, Math.min(200, syncMs + d));
    if (playing) nextTime += d / 1000;
    try { localStorage.setItem('snapr.sync', syncMs); } catch (e) {}
    render();
  }

  // ---- ui ----
  const $ = id => document.getElementById(id);
  const beatLeds = [...document.querySelectorAll('.beatsegs .seg')];
  const foot = $('foot'), knob = $('knob'), dial = $('dial');

  const ticks = PATTERNS.map((p, i) => {
    const d = document.createElement('span'); d.className = 'tick';
    const a = angleOf(i) * Math.PI / 180;
    d.style.transform = `translate(${Math.sin(a) * 50 * dial.offsetWidth / 104}px, ${-Math.cos(a) * 50 * dial.offsetWidth / 104}px)`;
    dial.appendChild(d); return d;
  });
  function placeTicks() {
    const r = dial.offsetWidth * 0.48;
    ticks.forEach((d, i) => { const a = angleOf(i) * Math.PI / 180;
      d.style.transform = `translate(${Math.sin(a) * r}px, ${-Math.cos(a) * r}px)`; });
  }
  addEventListener('resize', placeTicks);

  function setPattern(i) { pattern = ((i % N) + N) % N; render(); }

  const topLed = $('led'); let ledTimer;
  function flashLed() { topLed.classList.add('on'); clearTimeout(ledTimer); ledTimer = setTimeout(() => topLed.classList.remove('on'), 60); }
  let beatTimer;
  function lightBeat(b, cls) {
    beatLeds.forEach((l, i) => l.className = 'seg' + (i === b && cls ? ' ' + cls : ''));
    clearTimeout(beatTimer);
    if (b >= 0 && cls === 'on') beatTimer = setTimeout(() => beatLeds[b].className = 'seg soft', 90);
  }

  function render() {
    const bpmEl = $('bpm');
    bpmEl.textContent = interval ? String(Math.round(60 / interval)).padStart(3, ' ') : '---';
    const p = PATTERNS[pattern];
    $('pointer').style.transform = `rotate(${angleOf(pattern)}deg)`;
    ticks.forEach((d, i) => d.classList.toggle('cur', i === pattern));
    $('pname').textContent = p.name; $('desc').textContent = p.desc;
    knob.setAttribute('aria-label', `Rhythm: ${p.name}. Activate for next rhythm.`);
    $('syncv').textContent = 'sync ' + (syncMs > 0 ? '+' : '') + syncMs + 'ms';
    $('stop').disabled = !playing;
    const counting = tapCount > 0 && tapCount < TAPS_TO_START;
    const muted = ctx && ctx.state !== 'running' && tapCount > 0;
    $('hint').textContent =
      muted ? 'Sound is still asleep. Tap once more to wake it.' :
      counting ? `${tapCount} of 4…` :
      playing ? 'Tap four again anytime to retime.' :
      'Tap the switch on one, two, three, four. It comes in on the next one.';
  }

  function frame() {
    if (ctx && playing) {
      const heard = heardAt(performance.now());
      while (visQ.length && visQ[0].t <= heard) {
        const e = visQ.shift();
        if (e.hit) flashLed();
        if (e.step % 4 === 0) lightBeat(e.step / 4, e.hit ? 'on' : 'soft');
        else if (e.hit && e.step % 4 === 2) {           // flicker on the "and"
          const cur = beatLeds.findIndex(l => l.className.includes('soft') || l.className.includes('on'));
          if (cur >= 0) lightBeat(cur, 'on');
        }
      }
    }
    requestAnimationFrame(frame);
  }

  // footswitch
  const now = e => (e && e.timeStamp > 1e3 && e.timeStamp < performance.now() + 1000) ? e.timeStamp : performance.now();
  foot.addEventListener('pointerdown', e => { e.preventDefault(); foot.classList.add('down'); tap(now(e)); });
  const up = () => foot.classList.remove('down');
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => foot.addEventListener(t, up));
  foot.addEventListener('click', e => { if (e.detail === 0) tap(performance.now()); });

  // knob: tap to advance, or drag to turn
  let drag = null, dragged = false;
  knob.addEventListener('pointerdown', e => { drag = e.pointerId; dragged = false; knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', e => {
    if (drag !== e.pointerId) return;
    const r = dial.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (Math.hypot(dx, dy) < 14) return;
    const a = Math.max(-135, Math.min(135, Math.atan2(dx, -dy) * 180 / Math.PI));
    const i = Math.round((a + 135) / (270 / (N - 1)));
    if (i !== pattern) { dragged = true; setPattern(i); }
  });
  knob.addEventListener('pointerup', () => { drag = null; });
  knob.addEventListener('pointercancel', () => { drag = null; });
  knob.addEventListener('click', () => { if (dragged) { dragged = false; return; } setPattern(pattern + 1); });

  $('prev').addEventListener('click', () => setPattern(pattern - 1));
  $('next').addEventListener('click', () => setPattern(pattern + 1));
  $('stop').addEventListener('click', stop);
  $('slower').addEventListener('click', () => nudge(-1));
  $('faster').addEventListener('click', () => nudge(1));
  $('earlier').addEventListener('click', () => setSync(-10));
  $('later').addEventListener('click', () => setSync(10));

  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { foot.classList.add('down'); tap(now(e)); } }
    else if (e.code === 'Escape') stop();
    else if (e.code === 'ArrowRight') setPattern(pattern + 1);
    else if (e.code === 'ArrowLeft') setPattern(pattern - 1);
  });
  addEventListener('keyup', e => { if (e.code === 'Space') up(); });

  placeTicks(); render(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>

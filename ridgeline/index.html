<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ridgeline — richie.digital</title>
<style>
  html, body { margin:0; height:100%; background:#0b0910; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #rdPanel {
    position:fixed; top:12px; right:12px; z-index:10; display:none;
    font:11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color:#ffcf9a; background:rgba(18,10,14,.82); border:1px solid rgba(255,140,60,.35);
    border-radius:4px; padding:10px 12px; width:186px; backdrop-filter:blur(4px);
    max-height:82vh; overflow:auto;
  }
  #rdPanel.open { display:block; }
  #rdPanel h4 { margin:0 0 8px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#ff8a3c; }
  #rdPanel label { display:block; margin:7px 0 0; }
  #rdPanel .row { display:flex; justify-content:space-between; }
  #rdPanel input[type=range] { width:100%; margin:2px 0 0; accent-color:#ff7a26; }
  #rdPanel button {
    margin-top:10px; width:100%; font:inherit; color:#ffcf9a; cursor:pointer;
    background:rgba(255,120,40,.14); border:1px solid rgba(255,140,60,.35); border-radius:3px; padding:4px;
  }
  #rdHint {
    position:fixed; left:10px; bottom:8px; z-index:9; pointer-events:none;
    font:10px ui-monospace, Menlo, monospace; color:rgba(255,190,140,.30);
  }
  #rdRideHint {
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:9;
    font:11px ui-monospace, Menlo, monospace; letter-spacing:.1em;
    color:rgba(255,205,150,.6); pointer-events:none; opacity:0; transition:opacity 1.1s;
  }
  #rdRideHint.show { opacity:1; }
</style>
</head>
<body>
<canvas id="ridge"></canvas>
<div id="rdHint">ctrl+` — panel</div>
<div id="rdRideHint">tap · space — hop</div>
<div id="rdPanel"><h4>ridgeline</h4></div>

<script>
(function () {
  'use strict';

  /* ---------- tunables ---------- */
  var SPEC = [
    ['glow',    'sunset glow',   0, 2,   0.01],
    ['rim',     'rim blowout',   0, 2,   0.01],
    ['trees',   'tree fringe',   0, 1.5, 0.01],
    ['sunSize', 'sun size',      0.3, 3, 0.01],
    ['sunDrop', 'sun height',   -1.2, 2, 0.01],
    ['white',   'white point',   0, 1,   0.01],
    ['horizon', 'horizon',       0.58, 0.92, 0.005],
    ['relief',  'mountain size', 0.2, 2, 0.01],
    ['spread',  'peak width',    0.4, 2, 0.01],
    ['lift',    'band lift',     0,   1, 0.01],
    ['speed',   'fly-by speed',  0, 3,   0.01],
    ['density', 'peak density',  0.2, 2, 0.01],
    ['drift',   'sky drift',     0, 4,   0.01],
    ['clouds',  'clouds',        0, 1.5, 0.01],
    ['water',   'water',         0, 1,   0.01],
    ['birds',   'birds',         0, 2,   0.01],
    ['bob',     'bob',           0, 3,   0.01],
    ['vign',    'vignette',      0, 1,   0.01],
    ['grain',   'grain',         0, 1,   0.01]
  ];
  var DEFAULTS = {
    glow:0.85, rim:0.7, trees:0.85, sunSize:2.35, sunDrop:-0.3, white:0.42,
    horizon:0.78, relief:1, spread:1,
    lift:0.55, speed:0.34, density:1, drift:0.6, clouds:0.4, water:1,
    birds:0.5, bob:0.5, vign:0.12, grain:0.28, paused:false
  };

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('EFFECT_RIDGE') || '{}') || {}; } catch (e) { saved = {}; }
  var C = window.EFFECT_RIDGE = Object.assign({}, DEFAULTS, saved);
  function persist() { try { localStorage.setItem('EFFECT_RIDGE', JSON.stringify(C)); } catch (e) {} }

  /* ---------- canvas ---------- */
  var cv = document.getElementById('ridge');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1, UNIT = 1, G_ACCEL = 900;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    UNIT = Math.sqrt(W * H);            // scale peaks off area, not width — portrait was making pancakes
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G_ACCEL = UNIT * 1.1;
    buildGrain();
  }
  window.addEventListener('resize', resize);

  /* ---------- noise ---------- */
  function hash(i, seed) {
    var x = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function vnoise(x, seed) {
    var i = Math.floor(x), f = x - i;
    var a = hash(i, seed), b = hash(i + 1, seed);
    var u = f * f * (3 - 2 * f);
    return a + (b - a) * u;
  }
  function ridged(x, seed) { return 1 - Math.abs(2 * vnoise(x, seed) - 1); }

  // 0..1 silhouette profile. Multi-summit massifs with real gaps between them.
  function profile(x, seed, s) {
    var h = ridged(x * 0.32 * s, seed)      * 0.60
          + ridged(x * 0.85 * s, seed + 7)  * 0.27
          + vnoise(x * 2.30 * s, seed + 13) * 0.13;
    var env = 0.30 + 0.70 * vnoise(x * 0.11 * s, seed + 31);   // massif clustering
    h = Math.pow(h, 1.30) * env;
    return h < 0 ? 0 : (h > 1 ? 1 : h);                        // hard clamp — v4 tombstone insurance
  }

  /* ---------- palettes ---------- */
  // 5 stops, zenith -> horizon. A = deep dusk (photo 2), B = high orange (photo 1).
  var SKY_A = [[22,25,34],[44,38,48],[96,44,26],[214,86,14],[255,132,26]];
  var SKY_B = [[86,88,108],[168,104,66],[224,120,46],[248,152,52],[255,196,104]];
  function mixStop(i, u) {
    var a = SKY_A[i], b = SKY_B[i];
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * u) + ','
                  + Math.round(a[1] + (b[1] - a[1]) * u) + ','
                  + Math.round(a[2] + (b[2] - a[2]) * u) + ')';
  }

  /* ---------- grain tile ---------- */
  var grainTile = null;
  function buildGrain() {
    var n = 128, g = document.createElement('canvas');
    g.width = g.height = n;
    var gc = g.getContext('2d'), img = gc.createImageData(n, n), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 26;
    }
    gc.putImageData(img, 0, 0);
    grainTile = g;
  }

  /* ---------- state ---------- */
  var t = 0, last = performance.now();
  var BANDS = [
    { seed: 3.1,  scroll: 0.38, baseSpeed: 110, relief: 0.30, treeAmt: 0.45, dark: '#2a1420', x: 0 },
    { seed: 11.7, scroll: 1.00, baseSpeed: 290, relief: 0.46, treeAmt: 1.00, dark: '#150a12', x: 0 }
  ];
  var birds = [];
  for (var bi = 0; bi < 6; bi++) {
    birds.push({ x: Math.random(), y: 0.15 + Math.random() * 0.35, sp: 0.02 + Math.random() * 0.03, ph: Math.random() * 6.28 });
  }

  /* ---------- silhouette BMX rider: autopilot, then hands off ---------- */
  var ROAD_COLOR = BANDS[1].dark;   // same tone as the ridge it rides — no separate outline
  var rideHint = document.getElementById('rdRideHint');
  var RIDER = {
    xf: 0.30, y: 0, vy: 0, air: false, airT: 0, rotDur: 0.4, rot: 0, flips: 1,
    cooldown: 1.4, auto: true, autoHops: 0, autoMax: 5, handoff: false
  };
  function hop(big) {
    var apex = UNIT * (big ? 0.095 : 0.05);
    var v0 = Math.sqrt(2 * G_ACCEL * apex);
    RIDER.vy = -v0;
    RIDER.air = true;
    RIDER.airT = 0;
    RIDER.flips = big ? 2 : 1;
    RIDER.rotDur = (2 * v0 / G_ACCEL) * 0.62;   // rotation finishes well before real ground contact
    if (RIDER.handoff) rideHint.classList.remove('show');
  }
  cv.addEventListener('pointerdown', function () {
    if (RIDER.handoff && !RIDER.air) hop(Math.random() < 0.25);
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && RIDER.handoff && !RIDER.air) { hop(Math.random() < 0.25); e.preventDefault(); }
  });
  function drawRider(px, y, rot) {
    ctx.save();
    ctx.translate(px, y);
    ctx.rotate(rot);
    var sz = UNIT * 0.06;
    var wr = sz * 0.16, wx = sz * 0.42, wy = -sz * 0.16;   // pivot sits at the wheels' contact line, not the seat
    var ink = ROAD_COLOR;
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // wheels — flush with the ground line, same tone as the ridge so it's one silhouette
    [-wx, wx].forEach(function (cx) {
      ctx.beginPath(); ctx.arc(cx, wy, wr, 0, 6.2832); ctx.fill();
    });
    // frame + limbs
    ctx.lineWidth = sz * 0.06;
    ctx.beginPath();
    ctx.moveTo(-wx, wy); ctx.lineTo(-sz * 0.06, -sz * 0.50);
    ctx.lineTo(wx * 0.5, -sz * 0.58); ctx.lineTo(wx, wy);
    ctx.moveTo(-sz * 0.06, -sz * 0.50); ctx.lineTo(sz * 0.10, wy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-sz * 0.06, -sz * 0.50); ctx.lineTo(sz * 0.02, -sz * 0.32);
    ctx.moveTo(-sz * 0.06, -sz * 0.50); ctx.lineTo(-sz * 0.10, -sz * 1.06);
    ctx.lineTo(wx * 0.55, -sz * 0.82);
    ctx.stroke();
    // head
    ctx.beginPath(); ctx.arc(-sz * 0.10, -sz * 1.18, sz * 0.13, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- draw ---------- */
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!C.paused) t += dt;
    requestAnimationFrame(frame);
    if (!W || !H) return;

    // sky cycle, eased to dwell in the dark end
    var raw = 0.5 - 0.5 * Math.cos(t * 0.035 * C.drift);
    var u = Math.pow(raw, 1.8);

    var bob = C.bob * Math.sin(t * 0.45) * 2.6;
    var horizonY = H * C.horizon + bob;
    var sunR = UNIT * 0.055 * C.sunSize;
    var sunX = W * 0.56;
    var sunY = horizonY - sunR * (C.sunDrop + 1.75 * u);

    ctx.clearRect(0, 0, W, H);

    // --- sky ---
    var sky = ctx.createLinearGradient(0, 0, 0, horizonY + 2);
    sky.addColorStop(0.00, mixStop(0, u));
    sky.addColorStop(0.34, mixStop(1, u));
    sky.addColorStop(0.64, mixStop(2, u));
    sky.addColorStop(0.87, mixStop(3, u));
    sky.addColorStop(1.00, mixStop(4, u));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizonY + 2);

    // --- horizon glow ---
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 11);
    halo.addColorStop(0.00, 'rgba(255,190,110,' + (0.42 * C.glow) + ')');
    halo.addColorStop(0.28, 'rgba(255,120,40,'  + (0.17 * C.glow) + ')');
    halo.addColorStop(1.00, 'rgba(255,70,10,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, horizonY + 2);
    ctx.globalCompositeOperation = 'source-over';

    // --- clouds (wispy, drifting) ---
    if (C.clouds > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (var ci = 0; ci < 7; ci++) {
        var cy = horizonY * (0.10 + ci * 0.11);
        var cx = ((t * (6 + ci * 3) + ci * 640) % (W + 900)) - 450;
        var cw = UNIT * (0.16 + hash(ci, 5) * 0.34);
        var ch = UNIT * (0.006 + hash(ci, 9) * 0.012);
        var near = 1 - Math.min(Math.abs(cy - sunY) / (H * 0.5), 1);
        var g2 = ctx.createLinearGradient(cx - cw, 0, cx + cw, 0);
        g2.addColorStop(0, 'rgba(255,150,60,0)');
        g2.addColorStop(0.5, 'rgba(255,' + (140 + 90 * near | 0) + ',70,' + (0.16 * C.clouds * (0.35 + near)) + ')');
        g2.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, cw, ch, 0, 0, 6.2832);
        ctx.fill();
      }
      ctx.restore();
    }

    // --- sun disc ---
    ctx.globalCompositeOperation = 'lighter';
    var disc = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    var wp = C.white;   // 1 = the old blinding white, 0 = pure molten amber
    disc.addColorStop(0.00, 'rgba(255,' + (208 + 44 * wp | 0) + ',' + (128 + 110 * wp | 0) + ',' + (0.90 + 0.10 * wp) + ')');
    disc.addColorStop(0.70, 'rgba(255,' + (192 + 44 * wp | 0) + ',' + (100 + 90 * wp | 0) + ',0.96)');
    disc.addColorStop(0.94, 'rgba(255,' + (150 + 18 * wp | 0) + ',' + (44 + 16 * wp | 0) + ',0.85)');
    disc.addColorStop(1.00, 'rgba(255,120,20,0)');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    // --- bands ---
    var STEP = 3;
    var occl = [0, 0];
    var frontBase = 0, frontAmp = 0, frontS = 0;

    for (var b = 0; b < BANDS.length; b++) {
      var B = BANDS[b];
      if (!C.paused) B.x += B.baseSpeed * C.speed * dt;

      // baseline lifted off the bottom so ranges sit mid-frame, not in a floor strip
      var base = horizonY + UNIT * (b === 0 ? 0.005 : 0.075) * (1 - C.lift * 0.55) + UNIT * 0.02;
      var amp  = UNIT * B.relief * C.relief;
      var s    = C.density / C.spread;
      if (b === 1) { frontBase = base; frontAmp = amp; frontS = s; }

      // build silhouette
      var pts = [], minY = 1e9, minX = 0;
      for (var px = -STEP; px <= W + STEP; px += STEP) {
        var wx = (B.x + px) * B.scroll * 0.006;
        var y = base - profile(wx, B.seed, s) * amp;
        if (!isFinite(y)) y = base;
        if (y < -H) y = -H;                       // no runaway geometry
        pts.push(px, y);
        if (y < minY) { minY = y; minX = px; }
      }

      // occlusion: how much of the sun's disc does this silhouette actually cover?
      var cov = 0, samples = 15, edgeX = sunX, edgeY = base;
      for (var k = 0; k < samples; k++) {
        var fx = sunX + sunR * (-1 + 2 * (k + 0.5) / samples);
        var idx = Math.round((fx + STEP) / STEP) * 2 + 1;
        var ry = pts[idx];
        if (ry === undefined) continue;
        var dxn = (fx - sunX) / sunR;
        var half = sunR * Math.sqrt(Math.max(0, 1 - dxn * dxn));
        var top = sunY - half, bot = sunY + half;
        if (half <= 0) continue;
        var hidden = Math.min(Math.max(bot - Math.max(ry, top), 0), 2 * half);
        cov += hidden / (2 * half);
        if (ry < bot && ry > top && Math.abs(fx - sunX) < Math.abs(edgeX - sunX) + sunR) {
          if (ry < edgeY) { edgeY = ry; edgeX = fx; }
        }
      }
      cov /= samples;
      occl[b] = cov;

      // water goes between the two bands
      if (b === 1) drawWater(horizonY, sunX, sunY, sunR, u, occl[0]);

      // backlight bloom hugging the blocking edge — only when it's genuinely blocking
      if (cov > 0.02 && C.rim > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var br = sunR * (1.6 + 2.6 * cov);
        var bl = ctx.createRadialGradient(edgeX, edgeY, 0, edgeX, edgeY, br);
        var a0 = 0.55 * cov * C.rim * (b === 1 ? 1 : 0.7);
        bl.addColorStop(0.00, 'rgba(255,244,214,' + a0 + ')');
        bl.addColorStop(0.30, 'rgba(255,168,58,' + (a0 * 0.45) + ')');
        bl.addColorStop(1.00, 'rgba(255,90,10,0)');
        ctx.fillStyle = bl;
        ctx.beginPath(); ctx.arc(edgeX, edgeY, br, 0, 6.2832); ctx.fill();
        ctx.restore();
      }

      // molten crest — brightness tracks occlusion AND nearness to the sun
      if (C.rim > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineJoin = 'round';
        for (var i2 = 0; i2 + 3 < pts.length; i2 += 2) {
          var x0 = pts[i2], y0 = pts[i2 + 1], x1 = pts[i2 + 2], y1 = pts[i2 + 3];
          var near2 = 1 - Math.min(Math.abs((x0 + x1) / 2 - sunX) / (sunR * 7), 1);
          var hot = Math.pow(near2, 2.2) * (0.20 + 1.35 * cov) * C.rim * (b === 1 ? 1 : 0.55);
          if (hot < 0.012) continue;
          ctx.strokeStyle = 'rgba(255,' + (150 + 95 * Math.min(hot, 1) | 0) + ',' + (60 + 110 * Math.min(hot, 1) | 0) + ',' + Math.min(hot, 0.95) + ')';
          ctx.lineWidth = 1 + 2.6 * Math.min(hot, 1);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
        ctx.restore();
      }

      // tree fringe — glowing filaments first, dark trunks over top
      var treeH = UNIT * 0.011 * C.trees * B.treeAmt;
      if (treeH > 0.4) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        for (var i3 = 0; i3 + 1 < pts.length; i3 += 2) {
          var tx = pts[i3], ty = pts[i3 + 1];
          var wxi = Math.round((B.x + tx) * B.scroll * 0.34);
          var th = treeH * (0.35 + hash(wxi, B.seed) * 1.5);
          var nr = 1 - Math.min(Math.abs(tx - sunX) / (sunR * 6), 1);
          var ga = Math.pow(nr, 2.0) * (0.15 + 1.1 * cov) * C.rim;
          if (ga > 0.02) {
            ctx.strokeStyle = 'rgba(255,206,132,' + Math.min(ga, 0.9) + ')';
            ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.moveTo(tx, ty + 1); ctx.lineTo(tx, ty - th); ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = B.dark;
        ctx.lineWidth = 1.0;
        for (var i4 = 0; i4 + 1 < pts.length; i4 += 2) {
          var tx2 = pts[i4], ty2 = pts[i4 + 1];
          var wxi2 = Math.round((B.x + tx2) * B.scroll * 0.34);
          var th2 = treeH * (0.35 + hash(wxi2, B.seed) * 1.5);
          ctx.beginPath(); ctx.moveTo(tx2, ty2 + 1); ctx.lineTo(tx2, ty2 - th2 * 0.86); ctx.stroke();
        }
        ctx.restore();
      }

      // the silhouette body
      ctx.beginPath();
      ctx.moveTo(-STEP, H + 2);
      for (var i5 = 0; i5 + 1 < pts.length; i5 += 2) ctx.lineTo(pts[i5], pts[i5 + 1]);
      ctx.lineTo(W + STEP, H + 2);
      ctx.closePath();
      var bg = ctx.createLinearGradient(0, minY, 0, H);
      bg.addColorStop(0, b === 0 ? 'rgba(58,26,32,0.97)' : 'rgba(28,13,20,0.99)');
      bg.addColorStop(1, b === 0 ? 'rgba(24,11,18,1)'    : 'rgba(8,4,8,1)');
      ctx.fillStyle = bg;
      ctx.fill();
    }

    // --- silhouette BMX rider ---
    var riderPx = W * RIDER.xf;
    var wxr = (BANDS[1].x + riderPx) * BANDS[1].scroll * 0.006;
    var groundYr = frontBase - profile(wxr, BANDS[1].seed, frontS) * frontAmp;
    if (!isFinite(groundYr)) groundYr = frontBase;

    if (!C.paused) {
      if (!RIDER.air) {
        RIDER.y = groundYr;
        if (RIDER.auto) {
          RIDER.cooldown -= dt;
          if (RIDER.cooldown <= 0) hop(RIDER.autoHops === RIDER.autoMax - 1);
        }
      } else {
        RIDER.airT += dt;
        RIDER.vy += G_ACCEL * dt;
        RIDER.y += RIDER.vy * dt;
        var ease = Math.min(1, RIDER.airT / RIDER.rotDur);
        ease = ease * ease * (3 - 2 * ease);
        RIDER.rot = RIDER.flips * 6.2832 * ease;
        if (RIDER.y >= groundYr) {
          RIDER.y = groundYr; RIDER.air = false; RIDER.vy = 0; RIDER.rot = 0;
          if (RIDER.auto) {
            RIDER.autoHops++;
            RIDER.cooldown = 1.0 + Math.random() * 0.8;
            if (RIDER.autoHops >= RIDER.autoMax) { RIDER.auto = false; RIDER.handoff = true; rideHint.classList.add('show'); }
          }
        }
      }
    }
    drawRider(riderPx, RIDER.y, RIDER.air ? RIDER.rot : 0);

    // --- birds ---
    if (C.birds > 0.01) {
      ctx.strokeStyle = 'rgba(20,8,10,' + (0.55 * Math.min(C.birds, 1)) + ')';
      ctx.lineWidth = 1.4;
      var count = Math.round(6 * Math.min(C.birds, 2) / 2 * 2);
      for (var q = 0; q < Math.min(count, birds.length); q++) {
        var bd = birds[q];
        if (!C.paused) { bd.x -= bd.sp * dt; if (bd.x < -0.08) { bd.x = 1.08; bd.y = 0.12 + Math.random() * 0.4; } }
        var bx = bd.x * W, by = bd.y * horizonY;
        var flap = Math.sin(t * 6 + bd.ph) * 3.2;
        var sz = UNIT * 0.006;
        ctx.beginPath();
        ctx.moveTo(bx - sz, by + flap); ctx.lineTo(bx, by); ctx.lineTo(bx + sz, by + flap);
        ctx.stroke();
      }
    }

    // --- vignette ---
    if (C.vign > 0.005) {
      var vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.78);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,' + Math.min(C.vign * 2.2, 0.85) + ')');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // --- grain ---
    if (C.grain > 0.01 && grainTile) {
      ctx.save();
      ctx.globalAlpha = C.grain * 0.5;
      var ox = -((Math.random() * 128) | 0), oy = -((Math.random() * 128) | 0);
      var pat = ctx.createPattern(grainTile, 'repeat');
      ctx.translate(ox, oy);
      ctx.fillStyle = pat;
      ctx.fillRect(0, 0, W + 128, H + 128);
      ctx.restore();
    }
  }

  function drawWater(horizonY, sunX, sunY, sunR, u, midCov) {
    if (C.water < 0.01 || horizonY > H - 4) return;
    var wg = ctx.createLinearGradient(0, horizonY, 0, H);
    wg.addColorStop(0, 'rgba(96,84,86,' + (0.85 * C.water) + ')');
    wg.addColorStop(1, 'rgba(30,26,34,' + (0.95 * C.water) + ')');
    ctx.fillStyle = wg;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // glitter column — dies when the sun is behind the far ridge
    var vis = 1 - Math.min(midCov * 1.4, 1);
    if (vis <= 0.02) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rows = Math.ceil((H - horizonY) / 5);
    for (var r = 0; r < rows; r++) {
      var y = horizonY + r * 5;
      var f = r / rows;
      var wdt = sunR * (0.6 + f * 2.6);
      var jit = (hash(r + Math.floor(t * 6), 21) - 0.5) * wdt * 0.7;
      var a = (0.34 * vis * C.water * C.glow) * (1 - f) * (0.4 + hash(r + Math.floor(t * 8), 44) * 0.8);
      if (a < 0.01) continue;
      var gr = ctx.createLinearGradient(sunX - wdt, 0, sunX + wdt, 0);
      gr.addColorStop(0, 'rgba(255,140,40,0)');
      gr.addColorStop(0.5, 'rgba(255,' + (180 + 60 * (1 - f) | 0) + ',90,' + a + ')');
      gr.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(sunX - wdt + jit, y, wdt * 2, 3.2);
    }
    ctx.restore();
  }

  /* ---------- devpanel ---------- */
  var panel = document.getElementById('rdPanel');
  SPEC.forEach(function (sp) {
    var key = sp[0], lab = document.createElement('label');
    lab.innerHTML = '<span class="row"><span>' + sp[1] + '</span><span id="v_' + key + '">' + C[key] + '</span></span>';
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = sp[2]; inp.max = sp[3]; inp.step = sp[4]; inp.value = C[key];
    inp.addEventListener('input', function () {
      C[key] = parseFloat(inp.value);
      document.getElementById('v_' + key).textContent = inp.value;
      persist();
    });
    lab.appendChild(inp);
    panel.appendChild(lab);
  });
  var pause = document.createElement('button');
  pause.textContent = 'pause / resume';
  pause.onclick = function () { C.paused = !C.paused; persist(); };
  panel.appendChild(pause);
  var reset = document.createElement('button');
  reset.textContent = 'reset defaults';
  reset.onclick = function () { try { localStorage.removeItem('EFFECT_RIDGE'); } catch (e) {} location.reload(); };
  panel.appendChild(reset);

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === '`' || e.key === '~')) { panel.classList.toggle('open'); e.preventDefault(); }
  });
  // 4-tap corner for phones
  var taps = 0, tapT = 0;
  window.addEventListener('touchstart', function (e) {
    var tch = e.touches[0]; if (!tch) return;
    if (tch.clientX > W - 70 && tch.clientY < 70) {
      var n = performance.now();
      taps = (n - tapT < 600) ? taps + 1 : 1;
      tapT = n;
      if (taps >= 4) { panel.classList.toggle('open'); taps = 0; }
    }
  }, { passive: true });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-LBK460 Surface</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font: 16px/1.3 system-ui, sans-serif; }
  #app { height: 100%; display: flex; flex-direction: column; user-select: none;
    touch-action: none; }
  #mode {
    flex: 0 0 12%; min-height: 56px; display: flex; align-items: center;
    justify-content: center; font-weight: 700; letter-spacing: .04em;
    border-bottom: 1px solid #0008;
  }
  #row { flex: 1; display: flex; min-height: 0; }
  #main { flex: 1; position: relative; overflow: hidden; }
  #vol {
    width: 14%; min-width: 48px; background: #1a1a1a;
    border-left: 1px solid #000; position: relative;
  }
  #fill { position: absolute; left: 0; right: 0; bottom: 0; background: #3d8bfd; }
  #readout {
    position: absolute; left: 12px; bottom: 12px; right: 12px;
    background: #000a; padding: 10px 12px; border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }
  #target {
    position: absolute; inset: 18% 10%; border: 2px dashed #fff6;
    border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700;
  }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="mode">Playback — long-press to change mode</div>
  <div id="row">
    <div id="main">
      <div id="target">Play / Pause</div>
      <div id="readout"></div>
    </div>
    <div id="vol"><div id="fill"></div></div>
  </div>
</div>
<script>
const modes = ["Playback", "Color & Brightness", "Gesture"];
let mode = 0, playing = false, vol = 40, bright = 50, hue = 30;
let down = null, lastTap = 0, pressTimer = null;

const modeEl = document.getElementById("mode");
const main = document.getElementById("main");
const volEl = document.getElementById("vol");
const fill = document.getElementById("fill");
const target = document.getElementById("target");
const readout = document.getElementById("readout");

function snap(v, steps) { return Math.round(Math.max(0, Math.min(1, v)) * steps) / steps; }
function paint() {
  modeEl.textContent = modes[mode] + " — long-press to change mode";
  if (mode === 1) {
    const h = 30 + (1 - hue) * 210;
    main.style.background = `hsl(${h} 70% ${8 + bright * 42}%)`;
    modeEl.style.background = main.style.background;
    target.classList.add("hide");
  } else if (mode === 0) {
    main.style.background = "#222";
    modeEl.style.background = "#333";
    target.classList.remove("hide");
    target.textContent = playing ? "Pause" : "Play";
  } else {
    main.style.background = "#1b2430";
    modeEl.style.background = "#243044";
    target.classList.add("hide");
  }
  fill.style.height = vol + "%";
  readout.textContent =
    `mode ${modes[mode]}  play ${playing ? "on" : "off"}  vol ${Math.round(vol)}  ` +
    `color ${Math.round(hue * 100)}  bright ${Math.round(bright * 100)}`;
}
function setVolFromY(clientY) {
  const r = volEl.getBoundingClientRect();
  vol = snap(1 - (clientY - r.top) / r.height, 32) * 100;
  paint();
}
function xy(e, el) {
  const r = el.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, t: performance.now() };
}
function cycle() { mode = (mode + 1) % 3; paint(); }
function gesture(dx, dy, dt, dist) {
  if (dist < 0.04 && dt < 280) { playing = !playing; return "tap → play/pause"; }
  if (Math.hypot(dx, dy) < 0.12) return "ignored";
  if (Math.abs(dy) > Math.abs(dx)) {
    bright = Math.max(0, Math.min(1, bright + (dy < 0 ? 0.08 : -0.08)));
    return dy < 0 ? "swipe up → brighter" : "swipe down → dimmer";
  }
  hue = Math.max(0, Math.min(1, hue + (dx > 0 ? 0.08 : -0.08)));
  return dx > 0 ? "swipe right → cooler" : "swipe left → warmer";
}
modeEl.addEventListener("pointerdown", () => {
  pressTimer = setTimeout(cycle, 600);
});
modeEl.addEventListener("pointerup", () => clearTimeout(pressTimer));
modeEl.addEventListener("pointerleave", () => clearTimeout(pressTimer));

volEl.addEventListener("pointerdown", e => { volEl.setPointerCapture(e.pointerId); setVolFromY(e.clientY); });
volEl.addEventListener("pointermove", e => { if (e.buttons) setVolFromY(e.clientY); });

main.addEventListener("pointerdown", e => {
  main.setPointerCapture(e.pointerId);
  down = xy(e, main);
  if (mode === 1) {
    hue = snap(down.x, 32);
    bright = snap(1 - down.y, 32);
    paint();
  }
});
main.addEventListener("pointermove", e => {
  if (!down || mode !== 1 || !e.buttons) return;
  const p = xy(e, main);
  hue = snap(p.x, 32);
  bright = snap(1 - p.y, 32);
  paint();
});
main.addEventListener("pointerup", e => {
  if (!down) return;
  const p = xy(e, main);
  const dx = p.x - down.x, dy = p.y - down.y;
  const dist = Math.hypot(dx, dy);
  const dt = p.t - down.t;
  if (mode === 0 && dist < 0.08) {
    if (p.t - lastTap < 320) readout.textContent += "  | next";
    else playing = !playing;
    lastTap = p.t;
    paint();
  } else if (mode === 2) {
    const msg = gesture(dx, dy, dt, dist);
    paint();
    readout.textContent += "  | " + msg;
  }
  down = null;
});
paint();
</script>
</body>
</html>

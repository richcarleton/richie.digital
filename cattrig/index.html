<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cattrig — richie.digital</title>
<meta name="description" content="A climbing game. Fixed launch power, you pick the angle. The cat solves the first one to show you how.">
<meta name="theme-color" content="#12302b">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#12302b;overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #home{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;z-index:5;
    width:42px;height:42px;display:flex;align-items:center;justify-content:center;
    color:#eaf1e0;opacity:.45;font-size:24px;text-decoration:none;line-height:1}
  #home:hover,#home:focus-visible{opacity:1;outline:none}
  #hint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
    color:#e9f0e2;opacity:.30;font-size:12.5px;letter-spacing:.02em;pointer-events:none;
    text-align:center;white-space:nowrap}
  #pad{position:fixed;right:max(14px,env(safe-area-inset-right));
    bottom:max(46px,calc(env(safe-area-inset-bottom) + 40px));z-index:6;
    display:flex;flex-direction:column;gap:9px;align-items:center}
  .btn{width:62px;height:52px;display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(234,241,224,.42);border-radius:9px;background:rgba(234,241,224,.05);
    color:#eaf1e0;font-size:20px;line-height:1;cursor:pointer;
    font-family:inherit;letter-spacing:.04em;padding:0;-webkit-appearance:none}
  .btn:active{background:rgba(242,169,59,.28);border-color:#f2a93b}
  #jump{width:62px;height:46px;font-size:13px;border-color:rgba(242,169,59,.62);color:#f2a93b}
  @media (min-width:900px){ #pad{opacity:.42} #pad:hover{opacity:1} }
</style>
</head>
<body>
<a id="home" href="../catalog.html" title="catalogue" aria-label="back to the catalogue">&#8592;</a>
<canvas id="c"></canvas>
<div id="pad">
  <button class="btn" id="up"   aria-label="aim higher">&#9650;</button>
  <button class="btn" id="down" aria-label="aim lower">&#9660;</button>
  <button class="btn" id="jump" aria-label="jump">JUMP</button>
</div>
<div id="hint">&#8593;&#8595; aim &middot; space to jump</div>
<script>
(() => {
  'use strict';
  const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
  const CHALK = '#eaf1e0', DIM = 'rgba(234,241,224,0.34)', AMBER = '#f2a93b';
  const ROSE  = 'rgba(232,140,150,0.85)';
  const G = 9.81;                     // m/s^2, real gravity, real metres
  const V0 = 6.0;                     // m/s, fixed launch power — you only choose the angle
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- view -------------------------------------------------------------
  let W=0, H=0, PPM=100;
  let camX=0, camY=0;                 // camera position in metres (world origin bottom-left)
  function resize(){
    const dpr = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = Math.round(W*dpr); cvs.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    PPM = Math.max(58, Math.min(W/4.6, H/3.8));
  }
  addEventListener('resize', resize); resize();

  const sx = mx => (mx - camX)*PPM + W*0.5;
  const sy = my => H*0.62 - (my - camY)*PPM;

  // ---- chalk drawing helpers -------------------------------------------
  function chalk(path, {color=CHALK, w=2.2, alpha=1, dash=null}={}){
    ctx.save();
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(dash) ctx.setLineDash(dash);
    ctx.strokeStyle=color; ctx.globalAlpha=alpha*0.55; ctx.lineWidth=w*1.9;
    path(); ctx.stroke();
    ctx.globalAlpha=alpha; ctx.lineWidth=w;
    path(); ctx.stroke();
    ctx.restore();
  }
  function text(str, x, y, {size=15, color=CHALK, alpha=1, italic=false, align='left'}={}){
    ctx.save();
    ctx.globalAlpha=alpha; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='alphabetic';
    ctx.font=`${italic?'italic ':''}${size}px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif`;
    ctx.fillText(str,x,y);
    ctx.restore();
  }
  const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

  // ---- units: metric by default, because Canada ------------------------
  let UNITS = localStorage.getItem('cattrig.units') || 'metric';
  const M2FT = 3.28084;
  const dist = m => UNITS==='metric' ? m.toFixed(2)+' m'
                                     : (m*M2FT).toFixed(1)+' ft';

  // ---- the ballistics ---------------------------------------------------
  // Fixed speed V0. Given a target offset (dx, dy) there are two launch
  // angles that hit it — a flat one and a lofted one — or none at all.
  function solve(dx, dy){
    if(dx <= 0.01) return null;
    const disc = V0**4 - G*(G*dx*dx + 2*dy*V0*V0);
    if(disc < 0) return null;                      // out of reach at this power
    const r = Math.sqrt(disc);
    return { low:  Math.atan((V0*V0 - r)/(G*dx)),
             high: Math.atan((V0*V0 + r)/(G*dx)) };
  }
  // An arc is only a landing if it arrives AFTER apex — otherwise the cat
  // meets the ledge face on the way up, which is a bonk, not a jump.
  function arrivesFalling(th, dx){
    const vx = Math.cos(th)*V0, vy = Math.sin(th)*V0;
    return dx/vx > vy/G;
  }
  // farthest horizontal reach for a given rise
  function maxReach(dy){
    const r = V0*V0 - 2*G*dy;
    return r <= 0 ? 0 : V0*Math.sqrt(r)/G;
  }

  // ---- the tower --------------------------------------------------------
  const PW = 0.78;                                  // platform width, metres
  let platforms = [], idx = 0, best = 0, tries = 0;

  function makePlatform(prev, n){
    const side = (n % 2) ? -1 : 1;                  // zig-zag up the chalkboard
    for(let attempt=0; attempt<24; attempt++){
      const dy = 0.48 + Math.random()*(n < 3 ? 0.55 : 1.05);
      const reach = maxReach(dy);
      if(reach < 0.6) continue;
      const dx = reach*(0.46 + Math.random()*0.40); // always reachable, never trivially
      const x = prev.x + side*dx;
      if(Math.abs(x) > 3.2) continue;               // keep the tower on the board
      return { x, y: prev.y + dy, dx, dy, side, n };
    }
    return { x: prev.x + side*1.1, y: prev.y + 0.7, dx:1.1, dy:0.7, side, n };
  }

  function buildTower(){
    platforms = [{ x:0, y:0, dx:0, dy:0, side:1, n:0 }];
    for(let i=1; i<=40; i++) platforms.push(makePlatform(platforms[i-1], i));
  }

  // ---- state ------------------------------------------------------------
  const AIM_MIN = 12*Math.PI/180, AIM_MAX = 86*Math.PI/180;
  let aim = 55*Math.PI/180;
  let cat = { x:0, y:0, vx:0, vy:0, flying:false, facing:1, squash:1, t:0 };
  let mode = 'demo';        // demo -> aiming -> flight -> landed / missed
  let demoT = 0, shake = 0, flash = 0, msg = '', msgT = 0;

  // ---- combo: consecutive clean landings build a multiplier -------------
  let score = 0, streak = 0;
  let bestStreak = parseInt(localStorage.getItem('cattrig.bestStreak')||'0', 10) || 0;

  function reset(){
    buildTower(); idx = 0; tries = 0; best = 0; score = 0; streak = 0;
    cat.x = platforms[0].x; cat.y = platforms[0].y; cat.vx = cat.vy = 0;
    cat.flying = false; cat.facing = 1;
    camX = cat.x; camY = cat.y;
    mode = 'demo'; demoT = 0;
    aim = solvedAngle() || 55*Math.PI/180;
  }
  const target = () => platforms[idx+1];
  function solvedAngle(){
    const t = target(); if(!t) return null;
    const s = solve(Math.abs(t.x - cat.x), t.y - cat.y);
    return s ? s.high : null;   // the lofted arc always arrives falling
  }

  function launch(){
    if(cat.flying) return;
    const t = target(); if(!t) return;
    cat.facing = (t.x >= cat.x) ? 1 : -1;
    cat.vx = Math.cos(aim)*V0*cat.facing;
    cat.vy = Math.sin(aim)*V0;
    cat.flying = true; cat.t = 0; mode = 'flight'; tries++;
    catSay('effort');
  }

  // ---- physics ----------------------------------------------------------
  function step(dt){
    if(!cat.flying) return;
    const px = cat.x, py = cat.y;
    cat.vy -= G*dt;                                 // no drag, no easing — that was the float
    cat.x  += cat.vx*dt;
    cat.y  += cat.vy*dt;
    cat.t  += dt;

    const t = target();
    if(t && cat.vy < 0){                            // only catch it on the way down
      const top = t.y;
      if(py >= top && cat.y <= top){                // crossed the deck this frame
        const k = (py - top)/Math.max(1e-6, py - cat.y);
        const lx = px + (cat.x - px)*k;
        if(Math.abs(lx - t.x) <= PW/2){
          cat.x = lx; cat.y = top; cat.vx = cat.vy = 0;
          cat.flying = false; cat.squash = 0.72;
          idx++; best = Math.max(best, platforms[idx].y);
          mode = 'landed';
          streak++;
          const mult = Math.min(streak, 8);
          const gain = 25*mult;
          score += gain;
          const newRecord = streak > bestStreak && streak > 2;
          if(streak > bestStreak){ bestStreak = streak; localStorage.setItem('cattrig.bestStreak', bestStreak); }
          flash = Math.min(1, 0.65 + streak*0.05); catSay('win');
          if(streak > 1 && streak % 5 === 0) catSay('win');   // extra flourish on milestones
          msg = newRecord ? `new best ×${streak}!`
              : streak > 1 ? `×${mult} combo · +${gain}`
              : ['clean','nailed it','of course','effortless'][(Math.random()*4)|0];
          msgT = 1;
          return;
        }
      }
    }
    // met the ledge face on the way up
    if(t && cat.vy >= 0 && cat.y < t.y && Math.abs(cat.x - t.x) <= PW/2 + 0.02){
      cat.vx *= -0.30; cat.vy = Math.min(cat.vy, 0);
      shake = 0.7; catSay('fail');
      msg = 'face, meet ledge'; msgT = 1;
    }

    // fell past the deck we came from
    const floor = platforms[idx].y;
    if(cat.y <= floor && cat.vy < 0){
      cat.x = platforms[idx].x; cat.y = floor; cat.vx = cat.vy = 0;
      cat.flying = false; cat.squash = 0.66;
      mode = 'missed'; shake = 1; catSay('fail');
      const brokeStreak = streak >= 3; streak = 0;
      msg = brokeStreak
        ? ['streak’s gone','so much for that','back to zero'][(Math.random()*3)|0]
        : ['hmph','again','recalculating','it meant to do that'][(Math.random()*4)|0];
      msgT = 1;
    }
  }

  // ---- voice: a cat, randomised every time -----------------------------
  let AC=null, master=null, noiseBuf=null;
  function initAudio(){
    if(AC){ if(AC.state==='suspended') AC.resume(); return; }
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = 0.5;
    master.connect(comp).connect(AC.destination);
    const n = AC.sampleRate*0.4; noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*0.6;
  }
  // one vocal gesture: a pitch contour through two moving formants
  function vocal(t0, dur, pitch, formants, vol, {vib=0, am=0, bright=1}={}){
    const o = AC.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(pitch[0], t0);
    pitch.slice(1).forEach((p,i) => {
      const tt = t0 + dur*((i+1)/(pitch.length-1));
      o.frequency.exponentialRampToValueAtTime(Math.max(70,p), tt);
    });
    if(vib){
      const lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = vib; lg.gain.value = pitch[0]*0.05;
      lfo.connect(lg).connect(o.frequency); lfo.start(t0); lfo.stop(t0+dur+0.05);
    }
    const env = AC.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(vol, t0 + dur*0.14);
    env.gain.setValueAtTime(vol, t0 + dur*0.62);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    formants.forEach(([f, q, g], i) => {
      const b = AC.createBiquadFilter(); b.type='bandpass';
      b.frequency.setValueAtTime(f[0]*bright, t0);
      b.frequency.linearRampToValueAtTime(f[1]*bright, t0+dur);
      b.Q.value = q;
      const gg = AC.createGain(); gg.gain.value = g;
      o.connect(b).connect(gg).connect(env);
    });
    if(am){                                          // trill / purr rattle
      const tr = AC.createOscillator(), tg = AC.createGain();
      tr.type='sine'; tr.frequency.value = am; tg.gain.value = 0.55;
      tr.connect(tg).connect(env.gain); tr.start(t0); tr.stop(t0+dur+0.05);
    }
    env.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.04);
  }
  function hiss(t0, dur, vol){
    const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const b = AC.createBiquadFilter(); b.type='bandpass';
    b.frequency.value = 3600 + Math.random()*1400; b.Q.value = 1.1;
    const env = AC.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(vol, t0+0.03);
    env.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    s.connect(b).connect(env).connect(master);
    s.start(t0); s.stop(t0+dur+0.05);
  }

  // vocabulary — every call jitters pitch, length and formant travel
  const rnd = (a,b) => a + Math.random()*(b-a);
  const CALLS = {
    meow(t0){ const p = rnd(330,430);
      vocal(t0, rnd(0.42,0.62), [p, p*1.28, p*0.82, p*0.68],
        [[[720,560],7,1],[[1180,940],9,0.6]], 0.18, {vib:rnd(5,8)}); },
    mrrp(t0){ const p = rnd(300,380);
      vocal(t0, rnd(0.16,0.24), [p*0.86, p*1.22, p],
        [[[520,660],8,1],[[1400,1150],10,0.5]], 0.15, {am:rnd(24,34)}); },
    chirp(t0){ const p = rnd(560,760);
      vocal(t0, rnd(0.09,0.15), [p*0.8, p*1.45],
        [[[900,1500],10,1],[[2100,2600],12,0.55]], 0.16, {}); },
    trill(t0){ const p = rnd(360,460);
      vocal(t0, rnd(0.30,0.46), [p, p*1.12, p*0.95],
        [[[640,760],8,1],[[1500,1700],11,0.5]], 0.15, {am:rnd(30,42), vib:rnd(6,9)}); },
    yowl(t0){ const p = rnd(230,300);
      vocal(t0, rnd(0.55,0.85), [p*0.9, p*1.35, p*1.1, p*0.7],
        [[[560,760],6,1],[[900,1250],8,0.7]], 0.19, {vib:rnd(4,6)}); },
    purr(t0){ const p = rnd(95,120);
      vocal(t0, rnd(0.5,0.8), [p, p*1.05, p],
        [[[300,340],4,1]], 0.16, {am:rnd(22,28)}); },
    chirrup(t0){ const p = rnd(500,650);      // rising "prrp?" — pleased
      vocal(t0, rnd(0.16,0.24), [p*0.72, p*1.05, p*1.5],
        [[[780,1250],9,1],[[1700,2400],11,0.6]], 0.17, {am:rnd(26,36)}); },
    squeak(t0){ const p = rnd(700,900);       // tiny triumphant blip
      vocal(t0, rnd(0.07,0.11), [p*0.85, p*1.6],
        [[[1100,1900],11,1],[[2400,3000],13,0.5]], 0.14, {}); },
    hiss(t0){ hiss(t0, rnd(0.22,0.34), 0.13); },
    grumble(t0){ const p = rnd(160,210);
      vocal(t0, rnd(0.30,0.44), [p, p*0.84, p*0.92],
        [[[420,360],5,1],[[820,700],7,0.6]], 0.15, {am:rnd(16,22)}); }
  };
  const POOL = {
    idle:   ['mrrp','chirp','trill','mrrp'],
    effort: ['mrrp','chirp','meow','trill'],
    win:    ['chirp','chirrup','trill','squeak','chirp','chirrup'],
    fail:   ['yowl','grumble','hiss','grumble','yowl'],
    think:  ['mrrp','grumble','trill']
  };
  function catSay(kind){
    if(!AC) return;
    const pool = POOL[kind] || POOL.idle;
    const pick = pool[(Math.random()*pool.length)|0];
    CALLS[pick](AC.currentTime + 0.01 + Math.random()*0.03);
    const chatty = (kind === 'win') ? 0.45 : 0.18;
    if(Math.random() < chatty){                      // sometimes it has more to say
      const second = pool[(Math.random()*pool.length)|0];
      CALLS[second](AC.currentTime + (kind === 'win' ? rnd(0.14,0.28) : rnd(0.28,0.5)));
    }
  }

  // ---- the cat (unchanged silhouette, now with facing) -------------------
  function drawCat(x, y, s, {angle=0, crouch=0, stretch=0, tail=0, squash=1, facing=1}){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(facing, 1);
    ctx.scale(1, squash);
    ctx.rotate(angle*facing);
    const L = s, ex = stretch;

    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(-0.62*L, -0.42*L);
      ctx.quadraticCurveTo(-1.15*L - ex*0.35*L, -0.55*L + Math.sin(tail)*0.28*L,
                           -1.05*L - ex*0.55*L, -1.02*L + Math.sin(tail+1.1)*0.3*L);
    }, {w:2.4});
    chalk(()=>{ ctx.beginPath(); ctx.arc(-0.42*L, -0.36*L, 0.33*L, 0, 7); }, {w:2});
    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(-0.70*L, -0.30*L);
      ctx.quadraticCurveTo(-0.30*L, -0.86*L + crouch*0.14*L, 0.34*L, -0.78*L + crouch*0.16*L);
      ctx.quadraticCurveTo(0.62*L, -0.72*L, 0.60*L, -0.40*L);
      ctx.quadraticCurveTo(0.20*L, -0.10*L, -0.34*L, -0.06*L);
      ctx.quadraticCurveTo(-0.72*L, -0.04*L, -0.70*L, -0.30*L);
    }, {w:2.4});
    const legDrop = (0.06 + crouch*-0.03)*L;
    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(0.42*L, -0.44*L);
      ctx.quadraticCurveTo(0.52*L + ex*0.30*L, -0.22*L - ex*0.10*L, 0.46*L + ex*0.52*L, legDrop - ex*0.16*L);
    }, {w:2});
    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(-0.40*L, -0.14*L);
      ctx.quadraticCurveTo(-0.52*L - ex*0.26*L, 0*L, -0.44*L - ex*0.46*L, legDrop - ex*0.10*L);
    }, {w:2});
    const hx = 0.60*L, hy = -0.92*L + crouch*0.10*L;
    chalk(()=>{ ctx.beginPath(); ctx.arc(hx, hy, 0.30*L, 0, 7); }, {w:2.3});
    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(hx-0.26*L, hy-0.16*L); ctx.lineTo(hx-0.30*L, hy-0.46*L); ctx.lineTo(hx-0.02*L, hy-0.28*L);
      ctx.moveTo(hx+0.14*L, hy-0.26*L); ctx.lineTo(hx+0.26*L, hy-0.50*L); ctx.lineTo(hx+0.30*L, hy-0.18*L);
    }, {w:2});
    ctx.save(); ctx.fillStyle=CHALK;
    ctx.beginPath(); ctx.arc(hx-0.09*L, hy-0.02*L, 0.035*L, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+0.15*L, hy-0.02*L, 0.035*L, 0, 7); ctx.fill();
    ctx.restore();
    chalk(()=>{ ctx.beginPath();
      ctx.moveTo(hx+0.02*L, hy+0.10*L); ctx.lineTo(hx+0.07*L, hy+0.13*L); ctx.lineTo(hx+0.12*L, hy+0.10*L);
    }, {w:1.6});
    ctx.restore();
  }

  // ---- platform + its readout ------------------------------------------
  // The numbers live ON the thing you're jumping to. Each ledge is a route
  // card: how far, how high, and (once solved) the angle that gets you there.
  function drawPlatform(p, {active=false, solved=null, showAngle=false}={}){
    const x = sx(p.x), y = sy(p.y), half = PW/2*PPM;
    const a = active ? 1 : (p.n < idx ? 0.30 : 0.55);
    chalk(()=>{ ctx.beginPath(); ctx.moveTo(x-half, y); ctx.lineTo(x+half, y); },
      {w: active?3:2.2, alpha:a, color: active?AMBER:CHALK});
    for(let i=0;i<4;i++){                             // hatching under the deck
      const hx0 = x-half + (i+0.5)*(half*2/4);
      chalk(()=>{ ctx.beginPath(); ctx.moveTo(hx0, y+1); ctx.lineTo(hx0-7, y+13); },
        {w:1.4, alpha:a*0.55});
    }
    if(!active) return;

    // route card, pinned above the deck
    const cardY = y - 16;
    text(`\u0394x ${dist(Math.abs(p.x - cat.x))}`, x, cardY-34, {size:13, align:'center', alpha:.85, color:AMBER});
    text(`\u0394y ${dist(p.y - cat.y)}`,           x, cardY-18, {size:13, align:'center', alpha:.85, color:AMBER});
    if(showAngle && solved){
      const dxm = Math.abs(p.x - cat.x);
      const flat = arrivesFalling(solved.low, dxm);
      text(`\u03b8 = ${(solved.high*180/Math.PI).toFixed(1)}\u00b0`
           + (flat ? `  or  ${(solved.low*180/Math.PI).toFixed(1)}\u00b0` : ''),
        x, cardY-1, {size:13, align:'center', alpha:.95, color:AMBER, italic:true});
      if(!flat) text('flat route blocked', x, cardY+14,
        {size:11, align:'center', alpha:.45, color:ROSE, italic:true});
    } else {
      text('\u03b8 = ?', x, cardY-1, {size:13, align:'center', alpha:.5, color:DIM, italic:true});
    }
  }

  // ---- aim guide: a stub of the arc, not the whole answer ----------------
  function drawAim(){
    const t = target(); if(!t) return;
    const face = (t.x >= cat.x) ? 1 : -1;
    const vx = Math.cos(aim)*V0*face, vy = Math.sin(aim)*V0;
    const span = (mode==='demo') ? 2.2 : 0.46;        // demo shows the full commit
    const N = 26;
    ctx.save();
    for(let i=0;i<N;i++){
      const tt = span*(i/N);
      const px = cat.x + vx*tt, py = cat.y + vy*tt - 0.5*G*tt*tt;
      const r = 2.4*(1 - i/N) + 0.8;
      ctx.globalAlpha = 0.55*(1 - i/N) + 0.12;
      ctx.fillStyle = AMBER;
      ctx.beginPath(); ctx.arc(sx(px), sy(py), r, 0, 7); ctx.fill();
    }
    ctx.restore();
    // the angle itself, read off the cat
    const ax = sx(cat.x), ay = sy(cat.y);
    chalk(()=>{ ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + face*34, ay); },
      {w:1.4, alpha:.4, dash:[3,4]});
    chalk(()=>{ ctx.beginPath(); ctx.arc(ax, ay, 26, face>0 ? -aim : Math.PI, face>0 ? 0 : Math.PI+aim); },
      {w:1.5, alpha:.55, color:AMBER});
    text(`${(aim*180/Math.PI).toFixed(1)}\u00b0`, ax + face*40, ay - 12,
      {size:15, color:AMBER, align: face>0?'left':'right'});
  }

  // ---- board ------------------------------------------------------------
  function drawBoard(){
    ctx.fillStyle = '#12302b'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha = 0.05;               // faint chalk dust
    for(let i=0;i<40;i++){
      const gx = (i*137.5 + camY*11) % W, gy = (i*89.3 - camY*23) % H;
      ctx.fillStyle = CHALK; ctx.beginPath();
      ctx.arc(gx, (gy+H)%H, 1.4, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // ---- loop -------------------------------------------------------------
  let last = performance.now(), tailT = 0;
  function frame(now){
    let dt = Math.min(0.032, (now - last)/1000); last = now;
    tailT += dt*2.2;

    // demo round: the cat works it out, then commits, so you see the shape
    if(mode === 'demo'){
      demoT += dt;
      const s = solvedAngle();
      if(s != null) aim = s;
      if(demoT > (reduced ? 1.2 : 2.6)) launch();
    }

    if(cat.flying) step(dt);
    if(mode === 'landed' || mode === 'missed'){
      if(!cat.flying){
        cat.squash += (1 - cat.squash)*Math.min(1, dt*9);
        if(Math.abs(1-cat.squash) < 0.02){
          cat.squash = 1;
          mode = 'aiming';
          const s = solvedAngle();
          if(s != null && Math.random() < 0.35) aim = s + (Math.random()-0.5)*0.5;
        }
      }
    }
    shake = Math.max(0, shake - dt*3);
    flash = Math.max(0, flash - dt*1.6);
    msgT  = Math.max(0, msgT  - dt*0.55);

    // camera eases to the cat
    const k = Math.min(1, dt*4.5);
    camX += (cat.x - camX)*k;
    camY += ((cat.flying ? cat.y*0.55 + platforms[idx].y*0.45 : cat.y) - camY)*k;

    drawBoard();
    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*shake*7, (Math.random()-0.5)*shake*7);
    }

    // platforms in view
    const t = target();
    for(const p of platforms){
      const py = sy(p.y);
      if(py < -60 || py > H+60) continue;
      drawPlatform(p, {
        active: t && p === t,
        solved: t && p === t ? solve(Math.abs(p.x - cat.x), p.y - cat.y) : null,
        showAngle: idx === 0     // the cat shows its working on the first one only
      });
    }

    if(!cat.flying && mode !== 'flight') drawAim();

    // the cat
    const s = PPM*0.30;
    const flying = cat.flying;
    const ang = flying ? Math.atan2(-cat.vy, Math.abs(cat.vx))*0.35*cat.facing : 0;
    drawCat(sx(cat.x), sy(cat.y), s, {
      angle: ang,
      crouch: mode==='demo' ? 0.4 : 0,
      stretch: flying ? Math.min(1, Math.hypot(cat.vx,cat.vy)/V0) : 0,
      tail: tailT,
      squash: cat.squash,
      facing: cat.facing
    });

    ctx.restore();

    // hud
    text(score > 0 ? `height ${dist(best)}  · ${score}` : `height ${dist(best)}`,
      14, H-16, {size:13, alpha:.45});
    text(streak > 1 ? `jumps ${tries}  ×${Math.min(streak,8)}` : `jumps ${tries}`,
      W-14, H-16, {size:13, alpha: streak>1 ? .8 : .45, align:'right', color: streak>1 ? AMBER : CHALK});
    text(UNITS==='metric' ? 'metric' : 'imperial', W-14, H-34,
      {size:11, alpha:.28, align:'right', italic:true});
    if(idx === 0 && mode === 'demo'){
      text('watch once. then it\u2019s your problem.', W*0.5, 42,
        {size:14, align:'center', alpha:.5, italic:true});
    }
    if(msgT > 0){
      text(msg, sx(cat.x), sy(cat.y) - PPM*0.62, {size:15, align:'center', alpha:msgT*0.8, italic:true, color:ROSE});
    }
    if(flash > 0){
      ctx.save(); ctx.globalAlpha = flash*0.10; ctx.fillStyle = AMBER;
      ctx.fillRect(0,0,W,H); ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);

  // ---- controls ---------------------------------------------------------
  const STEP = 0.6*Math.PI/180;
  let held = 0, heldT = 0;
  function nudge(dir){
    aim = Math.max(AIM_MIN, Math.min(AIM_MAX, aim + dir*STEP));
  }
  setInterval(() => {
    if(held && mode !== 'flight' && mode !== 'demo'){
      heldT++;
      nudge(held * (heldT > 14 ? 3 : 1));
    }
  }, 28);

  function bindHold(el, dir){
    const on = e => { e.preventDefault(); initAudio(); held = dir; heldT = 0; nudge(dir); };
    const off = () => { held = 0; heldT = 0; };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', off);
  }
  bindHold(document.getElementById('up'), 1);
  bindHold(document.getElementById('down'), -1);
  document.getElementById('jump').addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    if(mode === 'aiming') launch();
  });

  addEventListener('keydown', e => {
    if(e.repeat && (e.key==='ArrowUp'||e.key==='ArrowDown')){ initAudio(); nudge(e.key==='ArrowUp'?3:-3); return; }
    initAudio();
    if(e.key === 'ArrowUp'){ nudge(1); e.preventDefault(); }
    else if(e.key === 'ArrowDown'){ nudge(-1); e.preventDefault(); }
    else if(e.key === ' ' || e.key === 'Enter'){ if(mode==='aiming') launch(); e.preventDefault(); }
    else if(e.key.toLowerCase() === 'r'){ reset(); }
    else if(e.key.toLowerCase() === 'u'){
      UNITS = UNITS === 'metric' ? 'imperial' : 'metric';
      localStorage.setItem('cattrig.units', UNITS);
    }
  });

  // drag anywhere on the board to aim; tap the units readout to toggle
  let dragging = false, dragY = 0, dragAim = 0;
  cvs.addEventListener('pointerdown', e => {
    initAudio();
    if(e.clientX > W-110 && e.clientY > H-48){        // units corner
      UNITS = UNITS === 'metric' ? 'imperial' : 'metric';
      localStorage.setItem('cattrig.units', UNITS);
      return;
    }
    if(mode !== 'aiming') return;
    dragging = true; dragY = e.clientY; dragAim = aim;
    cvs.setPointerCapture(e.pointerId);
  });
  cvs.addEventListener('pointermove', e => {
    if(!dragging) return;
    aim = Math.max(AIM_MIN, Math.min(AIM_MAX, dragAim + (dragY - e.clientY)*0.0035));
  });
  cvs.addEventListener('pointerup', () => { dragging = false; });
  cvs.addEventListener('pointercancel', () => { dragging = false; });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REM TRANSIT DESK</title>
<style>
  :root {
    /* REM brand: deep forest green + chartreuse/lime accent (rem.info) */
    --red: #c6d92e;
    --red-dark: #94a520;
    --black: #0b2b22;
    --near-black: #123f32;
    --white: #f5f7f2;
    --grey: #93a29a;
    --ink: #06140f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    block-size: 100%;
    background: var(--ink);
    color: var(--white);
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Oswald", Impact, sans-serif;
    overflow: hidden;
  }

  /* -------------------------------------------------- page body -- */

  .stage {
    position: relative;
    inline-size: 100%;
    block-size: 100%;
    background:
      radial-gradient(ellipse at center, var(--near-black) 0%, var(--ink) 80%);
  }

  .stage-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    color: var(--grey);
  }

  .stage-content h1 {
    color: var(--white);
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 0.05em;
    margin: 0 0 0.5rem;
  }

  .stage-content p {
    font-size: 1rem;
    letter-spacing: 0.08em;
  }

  /* -------------------------------------------------- mode toggle -- */

  .mode-toggle {
    position: absolute;
    inset-block-start: 1.2rem;
    inset-inline-end: 1.2rem;
    z-index: 20;
    background: var(--near-black);
    color: var(--white);
    border: 1px solid var(--red);
    border-radius: 999px;
    padding: 0.5rem 1rem;
    font: inherit;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  .mode-toggle:hover { background: var(--black); }

  /* -------------------------------------------------- highway gag -- */

  .highway-scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .hwy-sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, #1a2a28 0%, #223a35 55%, #2e2e2e 62%, #232323 100%);
  }

  .hwy-road {
    position: absolute;
    inset-inline-start: 50%;
    inset-block-end: 0;
    inline-size: 150%;
    block-size: 72%;
    background: linear-gradient(to top, #2a2a2a, #1c1c1c 70%);
    clip-path: polygon(41% 0%, 59% 0%, 100% 100%, 0% 100%);
    transform: translateX(-50%);
    animation: hwy-creep 42s ease-in-out infinite;
  }

  .hwy-lane {
    position: absolute;
    inset-inline-start: 50%;
    inset-block-end: 0;
    inline-size: 5%;
    block-size: 100%;
    transform: translateX(-50%);
    clip-path: polygon(44% 0%, 56% 0%, 100% 100%, 0% 100%);
    background: repeating-linear-gradient(to bottom, #e0c93a 0 22px, transparent 22px 55px);
    opacity: 0.8;
  }

  .hwy-car {
    position: absolute;
    inset-inline-start: 50%;
    background: #303030;
    border: 1px solid #565656;
    border-radius: 5px 5px 1px 1px;
  }

  .hwy-car.c1 { inset-block-end: 14%; inline-size: 68px; block-size: 32px; transform: translateX(-130%); }
  .hwy-car.c2 { inset-block-end: 15%; inline-size: 54px; block-size: 26px; transform: translateX(60%); }
  .hwy-car.c3 { inset-block-end: 26%; inline-size: 38px; block-size: 18px; transform: translateX(-190%); }
  .hwy-car.c4 { inset-block-end: 34%; inline-size: 26px; block-size: 12px; transform: translateX(80%); }

  .hwy-car .brake {
    position: absolute;
    inset-block-end: 15%;
    inline-size: 22%;
    block-size: 34%;
    background: #ff2b2b;
    border-radius: 2px;
    box-shadow: 0 0 6px 2px rgba(255, 40, 40, 0.75);
    animation: hwy-brake 2.6s ease-in-out infinite;
  }

  .hwy-car .brake:first-child { inset-inline-start: 8%; }
  .hwy-car .brake:last-child { inset-inline-end: 8%; }
  .hwy-car.c2 .brake, .hwy-car.c4 .brake { animation-delay: 0.9s; }

  .hwy-dash {
    position: absolute;
    inset-inline: 0;
    inset-block-end: 0;
    block-size: 16%;
    background: linear-gradient(to top, #050505 40%, rgba(5, 5, 5, 0));
  }

  .hwy-caption {
    position: absolute;
    inset-inline: 0;
    inset-block-start: 1.5rem;
    text-align: center;
  }

  .hwy-headline {
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--red);
  }

  .hwy-sub {
    margin-block-start: 0.35rem;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    color: var(--grey);
  }

  @keyframes hwy-brake {
    0%, 40% { opacity: 1; }
    50%, 90% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Barely, barely inching forward. */
  @keyframes hwy-creep {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-2px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hwy-road, .hwy-car .brake { animation: none; }
  }

  /* -------------------------------------------------- scanlines -- */

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: 0.6;
  }

  .scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 130%);
  }

  /* -------------------------------------------------- top strip -- */

  .breaking-bar {
    position: fixed;
    inset-block-start: 0;
    inset-inline-start: 0;
    inset-inline-end: 0;
    block-size: 34px;
    z-index: 200;
    display: flex;
    align-items: stretch;
    background: var(--black);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  .rem-badge {
    background: var(--red);
    color: var(--near-black);
    display: flex;
    align-items: center;
    padding: 0 1.1rem;
    font-weight: 900;
    letter-spacing: 0.15em;
  }

  .breaking-bar .network {
    display: flex;
    align-items: center;
    padding: 0 1rem;
    color: var(--white);
    letter-spacing: 0.2em;
    border-inline-start: 2px solid var(--red);
  }

  .breaking-bar .network b {
    color: var(--red);
    margin-inline-end: 0.4em;
  }

  .breaking-bar .filler {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 1rem;
    color: var(--grey);
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
  }

  /* -------------------------------------------------- bottom bar -- */

  .chyron {
    position: fixed;
    inset-inline-start: 0;
    inset-inline-end: 0;
    inset-block-end: 0;
    z-index: 200;
    block-size: 92px;
    display: flex;
    align-items: stretch;
    background: linear-gradient(to bottom, var(--near-black), var(--black));
    border-block-start: 3px solid var(--red);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
    font-weight: 700;
  }

  /* leading: live bug + station ident */

  .ident {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0 1rem;
    background: var(--red);
    position: relative;
  }

  .ident::after {
    content: "";
    position: absolute;
    inset-inline-end: -18px;
    inset-block-start: 0;
    inset-block-end: 0;
    inline-size: 18px;
    background: var(--red);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .live-bug {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--black);
    color: var(--white);
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .live-dot {
    inline-size: 10px;
    block-size: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px 2px rgba(198, 217, 46, 0.7);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .station-select-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .station-select {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: none;
    color: var(--near-black);
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    padding-inline-end: 1.3em;
  }

  .station-select:focus-visible {
    outline: 2px solid var(--near-black);
    outline-offset: 2px;
  }

  .station-select option {
    color: #000;
    background: #fff;
    text-transform: none;
    font-weight: 600;
  }

  .select-arrow {
    position: absolute;
    inset-inline-end: 0;
    inset-block-start: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    border-inline-start: 5px solid transparent;
    border-inline-end: 5px solid transparent;
    border-block-start: 6px solid var(--near-black);
  }

  /* center: the wheel — last 2 (departed) | NEXT (in focus) | next 5 */

  .ticker-viewport {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    margin-inline-start: 1.4rem;
    display: flex;
    align-items: stretch;
    background:
      linear-gradient(90deg, var(--black) 0%, transparent 10%, transparent 90%, var(--black) 100%),
      repeating-linear-gradient(to bottom, transparent 0, transparent 44px, rgba(255,255,255,0.02) 44px, rgba(255,255,255,0.02) 88px);
  }

  .wheel-viewport {
    flex: 1 1 auto;
    min-inline-size: 0;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    /* NOT centered here — there are more items after NEXT than before it
       (2 departed vs. 5 upcoming), so naive centering would skew the whole
       row and NEXT would drift off-center. JS measures NEXT's actual
       position and translates the strip so NEXT lands in the middle. */
    justify-content: flex-start;
    perspective: 900px;
  }

  .wheel-strip {
    display: flex;
    align-items: center;
    gap: 1.1rem;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }

  .wheel-slot {
    flex: 0 0 auto;
    text-align: center;
    white-space: nowrap;
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
    transform-origin: center center;
  }

  .wheel-slot .ws-badge {
    display: inline-block;
    background: var(--red);
    color: var(--near-black);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    padding: 0.15rem 0.4rem;
    border-radius: 2px;
    margin-block-end: 0.2rem;
  }

  .wheel-slot .ws-line {
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--white);
    font-size: 1.15rem;
  }

  .wheel-slot.is-next .ws-line {
    font-size: 1.5rem;
  }

  .wheel-slot .ws-sub {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--grey);
    margin-block-start: 0.1rem;
  }

  .wheel-slot .ws-sub.soon {
    color: var(--red);
    animation: eta-flash 0.7s steps(1, end) infinite;
  }

  .wheel-slot.is-departed .ws-line {
    color: var(--grey);
    text-decoration: line-through;
    text-decoration-color: rgba(147, 162, 154, 0.5);
  }

  @keyframes eta-flash {
    0%, 49% { color: var(--red); }
    50%, 100% { color: var(--white); }
  }

  .signal-lost {
    color: var(--grey);
    font-size: 1.3rem;
    letter-spacing: 0.1em;
    padding-inline-start: 1rem;
  }

  /* trailing: clock */

  .clock-block {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    border-inline-start: 3px solid var(--red);
    min-inline-size: 150px;
  }

  .clock-label {
    font-size: 0.65rem;
    color: var(--grey);
    letter-spacing: 0.25em;
    margin-block-end: 0.2rem;
  }

  .clock-time {
    font-size: 1.7rem;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .daytype-label {
    font-size: 0.65rem;
    color: var(--red);
    letter-spacing: 0.2em;
    margin-block-start: 0.2rem;
  }

  @media (max-width: 760px) {
    .station-select { font-size: 0.85rem; }
    .clock-time { font-size: 1.2rem; }
    .chyron { block-size: 78px; }
    .clock-block { min-inline-size: 100px; padding: 0 0.8rem; }
    .train-stage { inset-block-end: 78px; }
    .wheel-strip { gap: 0.6rem; }
    .wheel-slot .ws-line { font-size: 0.9rem; }
    .wheel-slot.is-next .ws-line { font-size: 1.15rem; }
    .wheel-slot .ws-sub { font-size: 0.65rem; }
  }

  /* -------------------------------------------------- train crossing -- */
  /* Runs right along the top edge of the chyron footer, like a track. */

  .train-stage {
    position: fixed;
    inset-block-end: 92px;
    inset-inline-start: 0;
    inset-inline-end: 0;
    block-size: 112px;
    overflow: hidden;
    pointer-events: none;
    z-index: 150;
  }

  .train-instance {
    position: absolute;
    inset-block-end: 0;
    inset-inline-start: 0;
    inline-size: min(410px, 55vw);
    will-change: transform;
  }

  .train-instance.dir-ltr { animation: train-cross-ltr 9s linear forwards; }
  .train-instance.dir-rtl { animation: train-cross-rtl 9s linear forwards; }

  @keyframes train-cross-ltr {
    from { transform: translateX(-40vw); }
    to   { transform: translateX(135vw); }
  }

  @keyframes train-cross-rtl {
    from { transform: translateX(135vw); }
    to   { transform: translateX(-40vw); }
  }

  .train-art { display: block; }

  .train-art svg {
    display: block;
    inline-size: 100%;
    block-size: auto;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
  }

  .train-led {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 13px;
    fill: #ffb400;
  }

  @media (prefers-reduced-motion: reduce) {
    .train-stage { display: none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="stage-content" id="stageContent">
      <h1>REM TRANSIT DESK</h1>
      <p>Live departures feed &mdash; pick a station below</p>
    </div>

    <!-- Gag: toggle to a driver's-eye view of a highway going nowhere,
         as a joke comparison to the train that's actually moving. -->
    <div class="highway-scene" id="highwayScene" hidden>
      <div class="hwy-sky"></div>
      <div class="hwy-road">
        <div class="hwy-lane"></div>
        <div class="hwy-car c1"><span class="brake"></span><span class="brake"></span></div>
        <div class="hwy-car c2"><span class="brake"></span><span class="brake"></span></div>
        <div class="hwy-car c3"><span class="brake"></span><span class="brake"></span></div>
        <div class="hwy-car c4"><span class="brake"></span><span class="brake"></span></div>
      </div>
      <div class="hwy-dash"></div>
      <div class="hwy-caption">
        <div class="hwy-headline">STUCK ON HWY-15 SOUTH</div>
        <div class="hwy-sub">2.1 KM IN 47 MIN &mdash; AVG SPEED 2.7 KM/H &mdash; SHOULD'VE TAKEN THE REM</div>
      </div>
    </div>

    <button class="mode-toggle" id="modeToggle" type="button" aria-pressed="false">
      &#128663; STUCK IN TRAFFIC?
    </button>
  </div>

  <div class="breaking-bar">
    <div class="rem-badge">REM</div>
    <div class="network"><b>&#9679;</b>RCN &mdash; RÉSEAU CHYRON NEWS</div>
    <div class="filler">LOCAL TRANSIT DESK &mdash; ALL LINES</div>
  </div>

  <div class="scanlines"></div>

  <div class="train-stage" id="trainStage"></div>

  <template id="trainTemplate">
    <div class="train-instance">
      <!-- Symmetric 4-car REM-style unit: an upright, curved cab face at
           BOTH ends (real REM trains are bidirectional — no "front" or
           "back"), so no mirroring is needed for direction of travel. -->
      <div class="train-art">
        <svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg">
          <!-- under-frame, full length -->
          <rect x="0" y="110" width="640" height="18" fill="#111" />
          <!-- wheels -->
          <circle cx="48" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="140" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="260" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="380" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="500" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="592" cy="124" r="13" fill="#161616" stroke="#3a3a3a" stroke-width="2" />

          <!-- pantograph -->
          <path d="M300,19 L300,4 L340,4 L340,19" fill="none" stroke="#111" stroke-width="2.5" />

          <!-- roof + body shell (4-car section, between the two cabs) -->
          <rect x="76" y="19" width="488" height="7" rx="3" fill="#1c1c1c" />
          <rect x="76" y="22" width="488" height="100" rx="6" fill="#eef0ee" stroke="#c9cdc9" stroke-width="1.5" />

          <!-- window band + mullions -->
          <rect x="92" y="32" width="456" height="24" rx="5" fill="#1b2226" opacity="0.92" />
          <rect x="130" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="175" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="220" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="265" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="355" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="400" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="445" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />
          <rect x="490" y="32" width="3" height="24" fill="#eef0ee" opacity="0.4" />

          <!-- doors, one per car -->
          <rect x="126" y="58" width="28" height="36" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <rect x="246" y="58" width="28" height="36" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <rect x="366" y="58" width="28" height="36" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <rect x="486" y="58" width="28" height="36" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />

          <!-- lime stripe -->
          <rect x="76" y="86" width="488" height="12" fill="#c6d92e" />

          <!-- articulation joints between the 4 cars -->
          <rect x="197" y="22" width="6" height="100" fill="#050505" />
          <rect x="317" y="22" width="6" height="100" fill="#050505" />
          <rect x="437" y="22" width="6" height="100" fill="#050505" />

          <!-- ===== left cab: upright, gently curved face ===== -->
          <path d="M80,20 L38,20 Q14,20 14,46 L14,94 Q14,120 38,120 L80,120 Z" fill="#eef0ee" stroke="#c9cdc9" stroke-width="1.5" />
          <path d="M74,28 L42,28 Q24,28 24,48 L24,92 Q24,112 42,112 L74,112 Z" fill="#111214" />
          <path d="M68,36 L46,36 Q32,36 32,50 L32,90 Q32,104 46,104 L68,104 Z" fill="#2b3640" opacity="0.9" />
          <rect x="30" y="62" width="34" height="16" rx="2" fill="#050505" stroke="#333" stroke-width="1" />
          <text class="train-led led-text-left" x="47" y="74" text-anchor="middle">REM</text>
          <circle cx="48" cy="42" r="3.5" fill="#ffe066" />
          <circle cx="48" cy="98" r="3" fill="#e6001a" />
          <rect x="4" y="64" width="10" height="12" rx="2" fill="#111" />

          <!-- ===== right cab: mirror of left ===== -->
          <path d="M560,20 L602,20 Q626,20 626,46 L626,94 Q626,120 602,120 L560,120 Z" fill="#eef0ee" stroke="#c9cdc9" stroke-width="1.5" />
          <path d="M566,28 L598,28 Q616,28 616,48 L616,92 Q616,112 598,112 L566,112 Z" fill="#111214" />
          <path d="M572,36 L594,36 Q608,36 608,50 L608,90 Q608,104 594,104 L572,104 Z" fill="#2b3640" opacity="0.9" />
          <rect x="576" y="62" width="34" height="16" rx="2" fill="#050505" stroke="#333" stroke-width="1" />
          <text class="train-led led-text-right" x="593" y="74" text-anchor="middle">REM</text>
          <circle cx="592" cy="42" r="3.5" fill="#ffe066" />
          <circle cx="592" cy="98" r="3" fill="#e6001a" />
          <rect x="626" y="64" width="10" height="12" rx="2" fill="#111" />
        </svg>
      </div>
    </div>
  </template>

  <div class="chyron">
    <div class="ident">
      <div class="live-bug"><span class="live-dot"></span>LIVE</div>
      <div class="station-select-wrap">
        <select class="station-select" id="stationSelect" aria-label="Station">
          <option>LOADING&hellip;</option>
        </select>
        <span class="select-arrow"></span>
      </div>
    </div>
    <div class="ticker-viewport">
      <div class="wheel-viewport">
        <div class="wheel-strip" id="wheelStrip">
          <div class="wheel-slot"><span class="signal-lost">LOADING FEED&hellip;</span></div>
        </div>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock-label">LOCAL TIME</div>
      <div class="clock-time" id="clock">00:00:00</div>
      <div class="daytype-label" id="dayType">&mdash;</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SCHEDULE_URL = "schedule.json";
  var UPCOMING_COUNT = 5; // shown after the highlighted "next" passing
  var CROSSING_DURATION_MS = 9000; // must match the CSS animation duration

  var stationSelectEl = document.getElementById("stationSelect");
  var wheelStripEl = document.getElementById("wheelStrip");
  var clockEl = document.getElementById("clock");
  var dayTypeEl = document.getElementById("dayType");
  var trainStageEl = document.getElementById("trainStage");
  var trainTemplate = document.getElementById("trainTemplate");
  var modeToggleEl = document.getElementById("modeToggle");
  var stageContentEl = document.getElementById("stageContent");
  var highwaySceneEl = document.getElementById("highwayScene");

  var schedule = null;
  var signalLost = false;
  var selectedStation = null;

  // ---- station picker ----------------------------------------------------

  function populateStationSelect(data) {
    var previousValue = selectedStation;
    stationSelectEl.innerHTML = "";
    (data.stations || []).forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name.toUpperCase();
      stationSelectEl.appendChild(opt);
    });
    stationSelectEl.disabled = false;

    var stations = data.stations || [];
    selectedStation =
      previousValue && stations.indexOf(previousValue) !== -1
        ? previousValue
        : data.defaultStation || stations[0] || null;
    if (selectedStation) stationSelectEl.value = selectedStation;
  }

  stationSelectEl.addEventListener("change", function () {
    selectedStation = stationSelectEl.value;
    lastRenderedKey = ""; // force the ticker to rebuild for the new station
    cancelScheduledTrain();
  });

  // ---- day-type resolution ------------------------------------------

  function currentDayType(date) {
    var d = date.getDay(); // 0 = Sunday, 6 = Saturday
    if (d === 0) return "sunday";
    if (d === 6) return "saturday";
    return "weekday";
  }

  var DAY_TYPE_LABEL = {
    weekday: "WEEKDAY SCHEDULE",
    saturday: "SATURDAY SCHEDULE",
    sunday: "SUNDAY SCHEDULE"
  };

  // ---- clock -----------------------------------------------------------

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function updateClock() {
    var now = new Date();
    clockEl.textContent =
      pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
  }

  // ---- schedule loading --------------------------------------------------

  function loadSchedule() {
    fetch(SCHEDULE_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        schedule = data;
        signalLost = false;
        populateStationSelect(data);
        lastRenderedKey = "";
        cancelScheduledTrain();
      })
      .catch(function () {
        schedule = null;
        signalLost = true;
        selectedStation = null;
        stationSelectEl.innerHTML = "";
        var opt = document.createElement("option");
        opt.textContent = "NO SIGNAL";
        stationSelectEl.appendChild(opt);
        stationSelectEl.disabled = true;
        cancelScheduledTrain();
      });
  }

  // ---- departed / next / upcoming ----------------------------------------
  //
  // Both `diffMinutes` (time until, wrapped forward across midnight) and
  // `elapsedMinutes` (time since, wrapped the other way) are computed for
  // every entry in the day's schedule. Sorting by the first gives the
  // upcoming order; sorting by the second gives "most recently departed"
  // first — the two never collide for a real schedule, since a train that's
  // actually about to arrive has a tiny diff but a huge elapsed, and vice
  // versa for one that just left.

  function getScheduleView(now) {
    var empty = { departed: [], next: null, upcoming: [] };
    if (!schedule || !schedule.data || !selectedStation) return empty;
    var stationData = schedule.data[selectedStation];
    if (!stationData) return empty;

    var dayType = currentDayType(now);
    dayTypeEl.textContent = DAY_TYPE_LABEL[dayType] || dayType;

    var list = stationData.byDayType[dayType] || [];
    if (!list.length) return empty;

    var rawNowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

    var withTiming = list.map(function (entry) {
      var diff = entry.minutes - rawNowMinutes;
      if (diff < 0) diff += 1440;
      var elapsed = rawNowMinutes - entry.minutes;
      if (elapsed < 0) elapsed += 1440;
      return {
        time: entry.time,
        direction: entry.direction,
        headsign: entry.headsign,
        lineDirection: entry.lineDirection,
        diffMinutes: diff,
        elapsedMinutes: elapsed
      };
    });

    var upcomingAll = withTiming.slice().sort(function (a, b) { return a.diffMinutes - b.diffMinutes; });
    var departedAll = withTiming.slice().sort(function (a, b) { return a.elapsedMinutes - b.elapsedMinutes; });

    return {
      departed: departedAll.slice(0, 2),
      next: upcomingAll[0] || null,
      upcoming: upcomingAll.slice(1, 1 + UPCOMING_COUNT)
    };
  }

  function formatEta(diffMinutes) {
    var mins = Math.round(diffMinutes);
    if (mins <= 0) return "NOW";
    if (mins === 1) return "in 1 min";
    return "in " + mins + " min";
  }

  function formatAgo(elapsedMinutes) {
    var mins = Math.round(elapsedMinutes);
    if (mins <= 0) return "just now";
    if (mins === 1) return "1 min ago";
    return mins + " min ago";
  }

  // A couple of REM headsigns (e.g. a projected station name in
  // parentheses) run long enough to blow past the fixed-width "last 2" and
  // "next" segments — truncate rather than let them overflow into the clock.
  function truncateLabel(text, maxLen) {
    var t = (text || "").toUpperCase();
    return t.length > maxLen ? t.slice(0, maxLen - 1) + "…" : t;
  }

  // ---- wheel rendering ----------------------------------------------------
  //
  // "Last 2" (departed, oldest-to-recent) — NEXT (in focus, center) — the
  // next 5, all in one row. Each slot is scaled/faded/tilted by its distance
  // from NEXT, so a passing visibly grows as it approaches and shrinks away
  // once it's departed — no auto-scroll, it only moves when the lineup
  // actually changes.

  var lastRenderedKey = "";

  function wheelSlotHTML(item) {
    if (item.isNext) {
      var soon = item.diffMinutes <= 2 ? " soon" : "";
      return (
        '<div class="ws-badge">NEXT</div>' +
        '<div class="ws-line">&#9658; ' + truncateLabel(item.headsign, 14) + " " + item.time + "</div>" +
        '<div class="ws-sub' + soon + '">(' + formatEta(item.diffMinutes) + ")</div>"
      );
    }
    if (item.isDeparted) {
      return (
        '<div class="ws-line">' + truncateLabel(item.headsign, 12) + " " + item.time + "</div>" +
        '<div class="ws-sub">' + formatAgo(item.elapsedMinutes) + "</div>"
      );
    }
    var upcomingSoon = item.diffMinutes <= 2 ? " soon" : "";
    return (
      '<div class="ws-line">&#9658; ' + truncateLabel(item.headsign, 14) + " " + item.time + "</div>" +
      '<div class="ws-sub' + upcomingSoon + '">(' + formatEta(item.diffMinutes) + ")</div>"
    );
  }

  function renderWheel(view) {
    if (!view.next && !view.departed.length && !view.upcoming.length) {
      wheelStripEl.innerHTML = '<div class="wheel-slot"><span class="signal-lost">NO DEPARTURES TODAY</span></div>';
      return;
    }

    // Oldest-departed farthest out, most-recently-departed closest to NEXT.
    var items = view.departed.slice().reverse().map(function (d) {
      d.isDeparted = true;
      return d;
    });
    var centerIndex = items.length;
    if (view.next) {
      view.next.isNext = true;
      items.push(view.next);
    }
    view.upcoming.forEach(function (u) { items.push(u); });

    var html = items.map(function (item, i) {
      var offset = i - centerIndex;
      var abs = Math.abs(offset);
      var scale = Math.max(0.55, 1 - abs * 0.16);
      var opacity = Math.max(0.35, 1 - abs * 0.15);
      var tiltY = offset * 9;
      var dropY = Math.min(abs * 3, 10);
      var cls = "wheel-slot" + (item.isNext ? " is-next" : item.isDeparted ? " is-departed" : "");
      var style =
        "transform: scale(" + scale.toFixed(2) + ") rotateY(" + tiltY + "deg) translateY(" + dropY + "px);" +
        "opacity: " + opacity.toFixed(2) + ";";
      return '<div class="' + cls + '" style="' + style + '">' + wheelSlotHTML(item) + "</div>";
    }).join("");

    // Reset any prior centering offset before measuring natural (flex-start)
    // positions, otherwise the old offset would throw off the new one.
    wheelStripEl.style.transition = "none";
    wheelStripEl.style.transform = "translateX(0)";
    wheelStripEl.innerHTML = html;

    requestAnimationFrame(function () {
      centerOnNext();
      // Re-enable the transition on the next frame so this reset itself
      // doesn't animate, only the recenter that follows it.
      requestAnimationFrame(function () {
        wheelStripEl.style.transition = "";
      });
    });
  }

  function centerOnNext() {
    var viewport = wheelStripEl.parentElement;
    var focusEl = wheelStripEl.querySelector(".is-next") || wheelStripEl.firstElementChild;
    if (!focusEl) return;
    var targetCenter = viewport.clientWidth / 2;
    var focusCenter = focusEl.offsetLeft + focusEl.offsetWidth / 2;
    wheelStripEl.style.transform = "translateX(" + (targetCenter - focusCenter) + "px)";
  }

  function renderTicker() {
    var now = new Date();
    var view = signalLost
      ? { departed: [], next: null, upcoming: [] }
      : getScheduleView(now);

    maybeScheduleTrainFor(view.next);

    // Only touch the DOM when the actual lineup changes, not every second.
    var key =
      signalLost +
      "|" + (view.next ? view.next.time + view.next.direction : "-") +
      "|" + view.departed.map(function (d) { return d.time + d.direction; }).join(",") +
      "|" + view.upcoming.map(function (p) { return p.time + p.direction; }).join(",");

    if (key === lastRenderedKey) return;
    lastRenderedKey = key;

    if (signalLost) {
      wheelStripEl.innerHTML = '<div class="wheel-slot"><span class="signal-lost">SIGNAL LOST &mdash; awaiting feed</span></div>';
      return;
    }

    renderWheel(view);
  }

  // ---- train crossing animation (real REM-liveried train, synced to the
  // actual next departure so the crossing finishes right as its countdown
  // hits zero, instead of an arbitrary/ambient loop) ------------------------

  var scheduledTrainKey = null;
  var scheduledTrainTimeout = null;

  function trainKeyFor(entry) {
    return entry.time + "|" + entry.direction + "|" + entry.headsign;
  }

  function cancelScheduledTrain() {
    scheduledTrainKey = null;
    if (scheduledTrainTimeout) {
      clearTimeout(scheduledTrainTimeout);
      scheduledTrainTimeout = null;
    }
  }

  function maybeScheduleTrainFor(next) {
    if (!next) return;
    var key = trainKeyFor(next);
    if (key === scheduledTrainKey) return; // already handled this passing

    scheduledTrainKey = key;
    if (scheduledTrainTimeout) clearTimeout(scheduledTrainTimeout);

    var msUntilDeparture = next.diffMinutes * 60 * 1000;
    var delay = msUntilDeparture - CROSSING_DURATION_MS;

    if (delay <= 0) {
      spawnTrainCrossing(next);
    } else {
      scheduledTrainTimeout = setTimeout(function () {
        spawnTrainCrossing(next);
      }, delay);
    }
  }

  function spawnTrainCrossing(entry) {
    if (!entry || !trainTemplate.content) return;

    var frag = trainTemplate.content.cloneNode(true);
    var instance = frag.querySelector(".train-instance");
    var ledLeft = frag.querySelector(".led-text-left");
    var ledRight = frag.querySelector(".led-text-right");

    var headsignText = (entry.headsign || "").toUpperCase().slice(0, 10);
    ledLeft.textContent = headsignText;
    ledRight.textContent = headsignText;

    // `lineDirection` (from the real REM station order) tells us which way
    // the train is actually headed; direction_id is only a fallback for
    // trips whose headsign couldn't be resolved against the line.
    var travelRight;
    if (entry.lineDirection === "downstream") travelRight = true; // toward Brossard
    else if (entry.lineDirection === "upstream") travelRight = false; // toward Deux-Montagnes
    else travelRight = entry.direction !== "1";

    instance.classList.add(travelRight ? "dir-ltr" : "dir-rtl");

    instance.addEventListener("animationend", function () {
      instance.remove();
    });

    trainStageEl.appendChild(instance);
  }

  // ---- highway gag toggle -------------------------------------------------

  var highwayMode = false;

  modeToggleEl.addEventListener("click", function () {
    highwayMode = !highwayMode;
    stageContentEl.hidden = highwayMode;
    highwaySceneEl.hidden = !highwayMode;
    modeToggleEl.setAttribute("aria-pressed", String(highwayMode));
    modeToggleEl.innerHTML = highwayMode
      ? "&#128646; BACK TO THE REM"
      : "&#128663; STUCK IN TRAFFIC?";
  });

  // ---- boot --------------------------------------------------------------

  loadSchedule();
  updateClock();
  renderTicker();

  setInterval(updateClock, 1000);
  setInterval(renderTicker, 1000);
  // Re-check the feed periodically in case it recovers or is republished.
  setInterval(loadSchedule, 5 * 60 * 1000);
})();
</script>

</body>
</html>

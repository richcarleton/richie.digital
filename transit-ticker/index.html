<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRAND-MOULIN TRANSIT DESK</title>
<style>
  :root {
    --red: #e6001a;
    --red-dark: #a3000f;
    --black: #0a0a0a;
    --near-black: #131313;
    --white: #f5f5f5;
    --grey: #8a8a8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: var(--white);
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Oswald", Impact, sans-serif;
    overflow: hidden;
  }

  /* -------------------------------------------------- page body -- */

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at center, #1a1a1a 0%, #000 80%);
  }

  .stage-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    color: var(--grey);
  }

  .stage-content h1 {
    color: var(--white);
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 0.05em;
    margin: 0 0 0.5rem;
  }

  .stage-content p {
    font-size: 1rem;
    letter-spacing: 0.08em;
  }

  /* -------------------------------------------------- scanlines -- */

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: 0.6;
  }

  .scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 130%);
  }

  /* -------------------------------------------------- top strip -- */

  .breaking-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 34px;
    z-index: 200;
    display: flex;
    align-items: stretch;
    background: var(--black);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  .breaking-bar .tag {
    background: var(--red);
    color: var(--white);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    animation: breaking-flash 1.1s steps(1, end) infinite;
  }

  @keyframes breaking-flash {
    0%, 49% { background: var(--red); }
    50%, 100% { background: var(--red-dark); }
  }

  .breaking-bar .network {
    display: flex;
    align-items: center;
    padding: 0 1rem;
    color: var(--white);
    letter-spacing: 0.2em;
    border-left: 2px solid var(--red);
  }

  .breaking-bar .network b {
    color: var(--red);
    margin-right: 0.4em;
  }

  .breaking-bar .filler {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 1rem;
    color: var(--grey);
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
  }

  /* -------------------------------------------------- bottom bar -- */

  .chyron {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 200;
    height: 92px;
    display: flex;
    align-items: stretch;
    background: linear-gradient(to bottom, var(--near-black), var(--black));
    border-top: 3px solid var(--red);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
    font-weight: 700;
  }

  /* left: live bug + station ident */

  .ident {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0 1.2rem;
    background: var(--red);
    position: relative;
  }

  .ident::after {
    content: "";
    position: absolute;
    right: -18px;
    top: 0;
    bottom: 0;
    width: 18px;
    background: var(--red);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .live-bug {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--black);
    color: var(--white);
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .live-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px 2px rgba(230, 0, 26, 0.8);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .station-name {
    color: var(--white);
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* center: scroller */

  .ticker-viewport {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    margin-left: 1.4rem;
    display: flex;
    align-items: center;
    background:
      linear-gradient(90deg, var(--black) 0%, transparent 4%, transparent 96%, var(--black) 100%),
      repeating-linear-gradient(to bottom, transparent 0, transparent 44px, rgba(255,255,255,0.02) 44px, rgba(255,255,255,0.02) 88px);
  }

  .ticker-track {
    position: absolute;
    white-space: nowrap;
    will-change: transform;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    color: var(--white);
    text-transform: uppercase;
  }

  .ticker-track .passing {
    display: inline-block;
    padding: 0 1.6rem;
  }

  .ticker-track .arrow {
    color: var(--red);
    font-weight: 900;
    margin-right: 0.4rem;
  }

  .ticker-track .eta {
    color: var(--grey);
    font-weight: 600;
    font-size: 1.1rem;
    margin-left: 0.35rem;
  }

  .ticker-track .eta.soon {
    color: var(--red);
    animation: eta-flash 0.7s steps(1, end) infinite;
  }

  @keyframes eta-flash {
    0%, 49% { color: var(--red); }
    50%, 100% { color: var(--white); }
  }

  .ticker-track .sep {
    color: var(--red);
    margin: 0 0.2rem;
  }

  .signal-lost {
    color: var(--grey);
    font-size: 1.3rem;
    letter-spacing: 0.1em;
    padding-left: 1rem;
  }

  /* right: clock */

  .clock-block {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    border-left: 3px solid var(--red);
    min-width: 150px;
  }

  .clock-label {
    font-size: 0.65rem;
    color: var(--grey);
    letter-spacing: 0.25em;
    margin-bottom: 0.2rem;
  }

  .clock-time {
    font-size: 1.7rem;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .daytype-label {
    font-size: 0.65rem;
    color: var(--red);
    letter-spacing: 0.2em;
    margin-top: 0.2rem;
  }

  @media (max-width: 760px) {
    .station-name { font-size: 0.85rem; }
    .ticker-track { font-size: 1.05rem; }
    .clock-time { font-size: 1.2rem; }
    .chyron { height: 78px; }
    .clock-block { min-width: 100px; padding: 0 0.8rem; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="stage-content">
      <h1>GRAND-MOULIN TRANSIT DESK</h1>
      <p>Live departures feed &mdash; see ticker below</p>
    </div>
  </div>

  <div class="breaking-bar">
    <div class="tag">&#9632; BREAKING</div>
    <div class="network"><b>&#9679;</b>RCN &mdash; RÉSEAU CHYRON NEWS</div>
    <div class="filler">LOCAL TRANSIT DESK &mdash; ALL LINES</div>
  </div>

  <div class="scanlines"></div>

  <div class="chyron">
    <div class="ident">
      <div class="live-bug"><span class="live-dot"></span>LIVE</div>
      <div class="station-name" id="stationName">&mdash;</div>
    </div>
    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack">
        <span class="passing"><span class="signal-lost">LOADING FEED&hellip;</span></span>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock-label">LOCAL TIME</div>
      <div class="clock-time" id="clock">00:00:00</div>
      <div class="daytype-label" id="dayType">&mdash;</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SCHEDULE_URL = "schedule.json";
  var UPCOMING_COUNT = 6;
  var SCROLL_SPEED_PX_PER_SEC = 90;

  var stationNameEl = document.getElementById("stationName");
  var trackEl = document.getElementById("tickerTrack");
  var viewportEl = trackEl.parentElement;
  var clockEl = document.getElementById("clock");
  var dayTypeEl = document.getElementById("dayType");

  var schedule = null;
  var signalLost = false;

  // ---- day-type resolution ------------------------------------------

  function currentDayType(date) {
    var d = date.getDay(); // 0 = Sunday, 6 = Saturday
    if (d === 0) return "sunday";
    if (d === 6) return "saturday";
    return "weekday";
  }

  var DAY_TYPE_LABEL = {
    weekday: "WEEKDAY SCHEDULE",
    saturday: "SATURDAY SCHEDULE",
    sunday: "SUNDAY SCHEDULE"
  };

  // ---- clock -----------------------------------------------------------

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function updateClock() {
    var now = new Date();
    clockEl.textContent =
      pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
  }

  // ---- schedule loading --------------------------------------------------

  function loadSchedule() {
    fetch(SCHEDULE_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        schedule = data;
        signalLost = false;
        stationNameEl.textContent = (data.station || "UNKNOWN STATION").toUpperCase();
      })
      .catch(function () {
        schedule = null;
        signalLost = true;
        stationNameEl.textContent = "NO SIGNAL";
      });
  }

  // ---- upcoming passings -------------------------------------------------

  function getUpcomingPassings(now) {
    if (!schedule || !schedule.byDayType) return [];

    var dayType = currentDayType(now);
    dayTypeEl.textContent = DAY_TYPE_LABEL[dayType] || dayType;

    var list = schedule.byDayType[dayType] || [];
    var rawNowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

    var withEta = list.map(function (entry) {
      var effective = entry.minutes;
      var diff = effective - rawNowMinutes;
      if (diff < 0) diff += 1440;
      return {
        time: entry.time,
        direction: entry.direction,
        headsign: entry.headsign,
        diffMinutes: diff
      };
    });

    withEta.sort(function (a, b) { return a.diffMinutes - b.diffMinutes; });

    return withEta.slice(0, UPCOMING_COUNT);
  }

  function formatEta(diffMinutes) {
    var mins = Math.round(diffMinutes);
    if (mins <= 0) return "NOW";
    if (mins === 1) return "in 1 min";
    return "in " + mins + " min";
  }

  // ---- ticker rendering (marquee via rAF, seamless loop) -----------------

  var scrollX = 0;
  var singleWidth = 0;
  var lastFrameTime = null;
  var lastRenderedKey = "";

  function buildTickerHTML(passings) {
    if (signalLost) {
      return '<span class="passing"><span class="signal-lost">SIGNAL LOST &mdash; awaiting feed</span></span>';
    }
    if (!passings.length) {
      return '<span class="passing"><span class="signal-lost">NO UPCOMING DEPARTURES</span></span>';
    }
    var parts = passings.map(function (p) {
      var soon = p.diffMinutes <= 2 ? " soon" : "";
      var dirLabel = (p.headsign || "").toUpperCase();
      return (
        '<span class="passing">' +
          '<span class="arrow">&#9658;</span>' +
          dirLabel + " " + p.time +
          ' <span class="eta' + soon + '">(' + formatEta(p.diffMinutes) + ")</span>" +
        "</span>" +
        '<span class="sep">&#8226;</span>'
      );
    });
    return parts.join("");
  }

  function renderTicker() {
    var now = new Date();
    var passings = signalLost ? [] : getUpcomingPassings(now);

    // Build a cheap key so we only touch the DOM (and remeasure) when the
    // visible content actually changes, not every single second.
    var key = signalLost + "|" + passings.map(function (p) {
      return p.time + p.direction + Math.round(p.diffMinutes / 1) ;
    }).join(",");

    if (key === lastRenderedKey) return;
    lastRenderedKey = key;

    var html = buildTickerHTML(passings);
    // Duplicate content so the marquee can loop seamlessly.
    trackEl.innerHTML = html + html;

    // Measure a single copy's width (half of the duplicated content).
    singleWidth = trackEl.scrollWidth / 2;
    if (!singleWidth || !isFinite(singleWidth)) singleWidth = viewportEl.clientWidth;
  }

  function animateMarquee(timestamp) {
    if (lastFrameTime === null) lastFrameTime = timestamp;
    var dt = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;

    if (singleWidth > 0) {
      scrollX -= SCROLL_SPEED_PX_PER_SEC * dt;
      if (scrollX <= -singleWidth) scrollX += singleWidth;
      trackEl.style.transform = "translateX(" + scrollX + "px)";
    }

    requestAnimationFrame(animateMarquee);
  }

  // ---- boot --------------------------------------------------------------

  loadSchedule();
  updateClock();
  renderTicker();

  setInterval(updateClock, 1000);
  setInterval(renderTicker, 1000);
  // Re-check the feed periodically in case it recovers or is republished.
  setInterval(loadSchedule, 5 * 60 * 1000);

  requestAnimationFrame(animateMarquee);
})();
</script>

</body>
</html>

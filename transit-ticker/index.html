<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GRAND-MOULIN TRANSIT DESK</title>
<style>
  :root {
    --red: #e6001a;
    --red-dark: #a3000f;
    --black: #0a0a0a;
    --near-black: #131313;
    --white: #f5f5f5;
    --grey: #8a8a8a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    block-size: 100%;
    background: #000;
    color: var(--white);
    font-family: "Arial Narrow", "Helvetica Neue Condensed", "Oswald", Impact, sans-serif;
    overflow: hidden;
  }

  /* -------------------------------------------------- page body -- */

  .stage {
    position: relative;
    inline-size: 100%;
    block-size: 100%;
    background:
      radial-gradient(ellipse at center, #1a1a1a 0%, #000 80%);
  }

  .stage-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    color: var(--grey);
  }

  .stage-content h1 {
    color: var(--white);
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 0.05em;
    margin: 0 0 0.5rem;
  }

  .stage-content p {
    font-size: 1rem;
    letter-spacing: 0.08em;
  }

  /* -------------------------------------------------- scanlines -- */

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    opacity: 0.6;
  }

  .scanlines::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 130%);
  }

  /* -------------------------------------------------- top strip -- */

  .breaking-bar {
    position: fixed;
    inset-block-start: 0;
    inset-inline-start: 0;
    inset-inline-end: 0;
    block-size: 34px;
    z-index: 200;
    display: flex;
    align-items: stretch;
    background: var(--black);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
  }

  .breaking-bar .tag {
    background: var(--red);
    color: var(--white);
    display: flex;
    align-items: center;
    padding: 0 1rem;
    animation: breaking-flash 1.1s steps(1, end) infinite;
  }

  @keyframes breaking-flash {
    0%, 49% { background: var(--red); }
    50%, 100% { background: var(--red-dark); }
  }

  .breaking-bar .network {
    display: flex;
    align-items: center;
    padding: 0 1rem;
    color: var(--white);
    letter-spacing: 0.2em;
    border-inline-start: 2px solid var(--red);
  }

  .breaking-bar .network b {
    color: var(--red);
    margin-inline-end: 0.4em;
  }

  .breaking-bar .filler {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 1rem;
    color: var(--grey);
    font-weight: 600;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
  }

  /* -------------------------------------------------- bottom bar -- */

  .chyron {
    position: fixed;
    inset-inline-start: 0;
    inset-inline-end: 0;
    inset-block-end: 0;
    z-index: 200;
    block-size: 92px;
    display: flex;
    align-items: stretch;
    background: linear-gradient(to bottom, var(--near-black), var(--black));
    border-block-start: 3px solid var(--red);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
    font-weight: 700;
  }

  /* left: live bug + station ident */

  .ident {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0 1.2rem;
    background: var(--red);
    position: relative;
  }

  .ident::after {
    content: "";
    position: absolute;
    inset-inline-end: -18px;
    inset-block-start: 0;
    inset-block-end: 0;
    inline-size: 18px;
    background: var(--red);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
  }

  .live-bug {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--black);
    color: var(--white);
    padding: 0.3rem 0.6rem;
    border-radius: 3px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .live-dot {
    inline-size: 10px;
    block-size: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px 2px rgba(230, 0, 26, 0.8);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .station-name {
    color: var(--white);
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* center: scroller */

  .ticker-viewport {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    margin-inline-start: 1.4rem;
    display: flex;
    align-items: center;
    background:
      linear-gradient(90deg, var(--black) 0%, transparent 4%, transparent 96%, var(--black) 100%),
      repeating-linear-gradient(to bottom, transparent 0, transparent 44px, rgba(255,255,255,0.02) 44px, rgba(255,255,255,0.02) 88px);
  }

  .ticker-track {
    position: absolute;
    white-space: nowrap;
    will-change: transform;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    color: var(--white);
    text-transform: uppercase;
  }

  .ticker-track .passing {
    display: inline-block;
    padding: 0 1.6rem;
  }

  .ticker-track .arrow {
    color: var(--red);
    font-weight: 900;
    margin-inline-end: 0.4rem;
  }

  .ticker-track .eta {
    color: var(--grey);
    font-weight: 600;
    font-size: 1.1rem;
    margin-inline-start: 0.35rem;
  }

  .ticker-track .eta.soon {
    color: var(--red);
    animation: eta-flash 0.7s steps(1, end) infinite;
  }

  @keyframes eta-flash {
    0%, 49% { color: var(--red); }
    50%, 100% { color: var(--white); }
  }

  .ticker-track .sep {
    color: var(--red);
    margin: 0 0.2rem;
  }

  .signal-lost {
    color: var(--grey);
    font-size: 1.3rem;
    letter-spacing: 0.1em;
    padding-inline-start: 1rem;
  }

  /* right: clock */

  .clock-block {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 1.5rem;
    border-inline-start: 3px solid var(--red);
    min-inline-size: 150px;
  }

  .clock-label {
    font-size: 0.65rem;
    color: var(--grey);
    letter-spacing: 0.25em;
    margin-block-end: 0.2rem;
  }

  .clock-time {
    font-size: 1.7rem;
    color: var(--white);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .daytype-label {
    font-size: 0.65rem;
    color: var(--red);
    letter-spacing: 0.2em;
    margin-block-start: 0.2rem;
  }

  @media (max-width: 760px) {
    .station-name { font-size: 0.85rem; }
    .ticker-track { font-size: 1.05rem; }
    .clock-time { font-size: 1.2rem; }
    .chyron { block-size: 78px; }
    .clock-block { min-inline-size: 100px; padding: 0 0.8rem; }
  }

  /* -------------------------------------------------- train crossing -- */

  .train-stage {
    position: fixed;
    inset-block-start: 34px;
    inset-block-end: 92px;
    inset-inline-start: 0;
    inset-inline-end: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 150;
  }

  .train-instance {
    position: absolute;
    inset-block-start: 50%;
    inset-inline-start: 0;
    inline-size: min(340px, 46vw);
    margin-block-start: -46px;
    will-change: transform;
  }

  .train-instance.dir-ltr { animation: train-cross-ltr 9s linear forwards; }
  .train-instance.dir-rtl { animation: train-cross-rtl 9s linear forwards; }

  @keyframes train-cross-ltr {
    from { transform: translateX(-40vw); }
    to   { transform: translateX(135vw); }
  }

  @keyframes train-cross-rtl {
    from { transform: translateX(135vw); }
    to   { transform: translateX(-40vw); }
  }

  .train-art { display: block; }
  .train-art.flip { transform: scaleX(-1); }

  .train-art svg {
    display: block;
    inline-size: 100%;
    block-size: auto;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
  }

  .train-led {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 15px;
    fill: #ffb400;
  }

  @media (prefers-reduced-motion: reduce) {
    .train-stage { display: none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="stage-content">
      <h1>GRAND-MOULIN TRANSIT DESK</h1>
      <p>Live departures feed &mdash; see ticker below</p>
    </div>
  </div>

  <div class="breaking-bar">
    <div class="tag">&#9632; BREAKING</div>
    <div class="network"><b>&#9679;</b>RCN &mdash; RÉSEAU CHYRON NEWS</div>
    <div class="filler">LOCAL TRANSIT DESK &mdash; ALL LINES</div>
  </div>

  <div class="scanlines"></div>

  <div class="train-stage" id="trainStage"></div>

  <template id="trainTemplate">
    <div class="train-instance">
      <div class="train-art">
        <svg viewBox="0 0 460 130" xmlns="http://www.w3.org/2000/svg">
          <!-- pantograph -->
          <path d="M225,28 L225,8 L252,8 L252,28" fill="none" stroke="#111" stroke-width="2.5" />
          <!-- roof line -->
          <rect x="14" y="27" width="322" height="7" rx="3" fill="#1c1c1c" />
          <!-- body shell -->
          <rect x="10" y="30" width="330" height="68" rx="14" fill="#eef0ee" stroke="#c9cdc9" stroke-width="1.5" />
          <!-- window band -->
          <rect x="24" y="38" width="300" height="21" rx="6" fill="#1b2226" opacity="0.92" />
          <rect x="60" y="38" width="4" height="21" fill="#eef0ee" opacity="0.5" />
          <rect x="140" y="38" width="4" height="21" fill="#eef0ee" opacity="0.5" />
          <rect x="220" y="38" width="4" height="21" fill="#eef0ee" opacity="0.5" />
          <rect x="300" y="38" width="4" height="21" fill="#eef0ee" opacity="0.5" />
          <!-- doors -->
          <rect x="66" y="62" width="30" height="34" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <rect x="150" y="62" width="30" height="34" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <rect x="234" y="62" width="30" height="34" rx="2" fill="#d7dbd7" stroke="#9aa09a" stroke-width="1" />
          <!-- lime stripe along body -->
          <rect x="10" y="86" width="330" height="11" fill="#8dc63f" />
          <!-- under-frame -->
          <rect x="0" y="97" width="352" height="15" fill="#111" />
          <!-- cab / nose -->
          <path d="M340,30 C398,25 440,45 458,72 C440,99 398,119 340,115 Z" fill="#eef0ee" stroke="#c9cdc9" stroke-width="1.5" />
          <!-- black windshield mask -->
          <path d="M354,36 C396,31 428,48 445,72 C428,93 396,108 354,110 Z" fill="#111214" />
          <!-- windshield glass -->
          <path d="M362,45 C392,42 412,54 424,70 C412,84 392,94 362,96 C356,80 356,60 362,45 Z" fill="#2b3640" opacity="0.9" />
          <!-- headsign LED -->
          <rect x="366" y="49" width="52" height="15" rx="2" fill="#050505" stroke="#333" stroke-width="1" />
          <text class="train-led led-text" x="392" y="60" text-anchor="middle">RIVE</text>
          <!-- lime nose accent -->
          <path d="M340,88 C382,90 414,80 440,66 L440,76 C414,90 382,98 340,98 Z" fill="#8dc63f" />
          <!-- lights -->
          <circle cx="447" cy="86" r="3.5" fill="#ffe066" />
          <circle cx="447" cy="97" r="3" fill="#e6001a" />
          <!-- coupler skirt -->
          <path d="M430,104 L458,80 L458,90 L440,112 Z" fill="#111" />
          <!-- wheels -->
          <circle cx="66" cy="116" r="12" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="150" cy="116" r="12" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="234" cy="116" r="12" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="310" cy="116" r="12" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
          <circle cx="395" cy="116" r="12" fill="#161616" stroke="#3a3a3a" stroke-width="2" />
        </svg>
      </div>
    </div>
  </template>

  <div class="chyron">
    <div class="ident">
      <div class="live-bug"><span class="live-dot"></span>LIVE</div>
      <div class="station-name" id="stationName">&mdash;</div>
    </div>
    <div class="ticker-viewport">
      <div class="ticker-track" id="tickerTrack">
        <span class="passing"><span class="signal-lost">LOADING FEED&hellip;</span></span>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock-label">LOCAL TIME</div>
      <div class="clock-time" id="clock">00:00:00</div>
      <div class="daytype-label" id="dayType">&mdash;</div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SCHEDULE_URL = "schedule.json";
  var UPCOMING_COUNT = 6;
  var SCROLL_SPEED_PX_PER_SEC = 90;

  var stationNameEl = document.getElementById("stationName");
  var trackEl = document.getElementById("tickerTrack");
  var viewportEl = trackEl.parentElement;
  var clockEl = document.getElementById("clock");
  var dayTypeEl = document.getElementById("dayType");
  var trainStageEl = document.getElementById("trainStage");
  var trainTemplate = document.getElementById("trainTemplate");

  var schedule = null;
  var signalLost = false;

  // ---- day-type resolution ------------------------------------------

  function currentDayType(date) {
    var d = date.getDay(); // 0 = Sunday, 6 = Saturday
    if (d === 0) return "sunday";
    if (d === 6) return "saturday";
    return "weekday";
  }

  var DAY_TYPE_LABEL = {
    weekday: "WEEKDAY SCHEDULE",
    saturday: "SATURDAY SCHEDULE",
    sunday: "SUNDAY SCHEDULE"
  };

  // ---- clock -----------------------------------------------------------

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function updateClock() {
    var now = new Date();
    clockEl.textContent =
      pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());
  }

  // ---- schedule loading --------------------------------------------------

  function loadSchedule() {
    fetch(SCHEDULE_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        schedule = data;
        signalLost = false;
        stationNameEl.textContent = (data.station || "UNKNOWN STATION").toUpperCase();
        spawnTrainCrossing();
      })
      .catch(function () {
        schedule = null;
        signalLost = true;
        stationNameEl.textContent = "NO SIGNAL";
      });
  }

  // ---- upcoming passings -------------------------------------------------

  function getUpcomingPassings(now) {
    if (!schedule || !schedule.byDayType) return [];

    var dayType = currentDayType(now);
    dayTypeEl.textContent = DAY_TYPE_LABEL[dayType] || dayType;

    var list = schedule.byDayType[dayType] || [];
    var rawNowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

    var withEta = list.map(function (entry) {
      var effective = entry.minutes;
      var diff = effective - rawNowMinutes;
      if (diff < 0) diff += 1440;
      return {
        time: entry.time,
        direction: entry.direction,
        headsign: entry.headsign,
        diffMinutes: diff
      };
    });

    withEta.sort(function (a, b) { return a.diffMinutes - b.diffMinutes; });

    return withEta.slice(0, UPCOMING_COUNT);
  }

  function formatEta(diffMinutes) {
    var mins = Math.round(diffMinutes);
    if (mins <= 0) return "NOW";
    if (mins === 1) return "in 1 min";
    return "in " + mins + " min";
  }

  // ---- ticker rendering (marquee via rAF, seamless loop) -----------------

  var scrollX = 0;
  var singleWidth = 0;
  var lastFrameTime = null;
  var lastRenderedKey = "";

  function buildTickerHTML(passings) {
    if (signalLost) {
      return '<span class="passing"><span class="signal-lost">SIGNAL LOST &mdash; awaiting feed</span></span>';
    }
    if (!passings.length) {
      return '<span class="passing"><span class="signal-lost">NO UPCOMING DEPARTURES</span></span>';
    }
    var parts = passings.map(function (p) {
      var soon = p.diffMinutes <= 2 ? " soon" : "";
      var dirLabel = (p.headsign || "").toUpperCase();
      return (
        '<span class="passing">' +
          '<span class="arrow">&#9658;</span>' +
          dirLabel + " " + p.time +
          ' <span class="eta' + soon + '">(' + formatEta(p.diffMinutes) + ")</span>" +
        "</span>" +
        '<span class="sep">&#8226;</span>'
      );
    });
    return parts.join("");
  }

  function renderTicker() {
    var now = new Date();
    var passings = signalLost ? [] : getUpcomingPassings(now);

    // Build a cheap key so we only touch the DOM (and remeasure) when the
    // visible content actually changes, not every single second.
    var key = signalLost + "|" + passings.map(function (p) {
      return p.time + p.direction + Math.round(p.diffMinutes / 1) ;
    }).join(",");

    if (key === lastRenderedKey) return;
    lastRenderedKey = key;

    var html = buildTickerHTML(passings);
    // Duplicate content so the marquee can loop seamlessly.
    trackEl.innerHTML = html + html;

    // Measure a single copy's width (half of the duplicated content).
    singleWidth = trackEl.scrollWidth / 2;
    if (!singleWidth || !isFinite(singleWidth)) singleWidth = viewportEl.clientWidth;
  }

  function animateMarquee(timestamp) {
    if (lastFrameTime === null) lastFrameTime = timestamp;
    var dt = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;

    if (singleWidth > 0) {
      scrollX -= SCROLL_SPEED_PX_PER_SEC * dt;
      if (scrollX <= -singleWidth) scrollX += singleWidth;
      trackEl.style.transform = "translateX(" + scrollX + "px)";
    }

    requestAnimationFrame(animateMarquee);
  }

  // ---- train crossing animation (real REM-liveried train, real data) ----

  var trainCycleIndex = 0;

  function spawnTrainCrossing() {
    if (!schedule || !schedule.byDayType || !trainTemplate.content) return;

    var dayType = currentDayType(new Date());
    var list = schedule.byDayType[dayType];
    if (!list || !list.length) return;

    var entry = list[trainCycleIndex % list.length];
    trainCycleIndex++;

    var frag = trainTemplate.content.cloneNode(true);
    var instance = frag.querySelector(".train-instance");
    var art = frag.querySelector(".train-art");
    var led = frag.querySelector(".led-text");

    led.textContent = (entry.headsign || "").toUpperCase().slice(0, 10);

    var goingRight = entry.direction !== "1";
    instance.classList.add(goingRight ? "dir-ltr" : "dir-rtl");
    if (!goingRight) art.classList.add("flip");

    instance.addEventListener("animationend", function () {
      instance.remove();
    });

    trainStageEl.appendChild(instance);
  }

  function scheduleNextCrossing() {
    var delay = 8000 + Math.random() * 5000; // 8-13s apart
    setTimeout(function () {
      spawnTrainCrossing();
      scheduleNextCrossing();
    }, delay);
  }

  // ---- boot --------------------------------------------------------------

  loadSchedule();
  updateClock();
  renderTicker();
  scheduleNextCrossing();

  setInterval(updateClock, 1000);
  setInterval(renderTicker, 1000);
  // Re-check the feed periodically in case it recovers or is republished.
  setInterval(loadSchedule, 5 * 60 * 1000);

  requestAnimationFrame(animateMarquee);
})();
</script>

</body>
</html>

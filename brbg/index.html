<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>brbg · hi friend</title>
<style>
  :root{
    --ink:#e8e6f0; --dim:#8a86a0; --accent:#9fd8d0; --bg:#05040a;
    --panel:rgba(14,12,24,.72); --edge:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:manipulation;}
  #gl{display:block;width:100vw;height:100vh}
  #bar{position:fixed;top:0;left:0;right:0;height:26px;display:flex;align-items:center;
    gap:14px;padding:0 12px;font-size:12px;color:var(--dim);
    background:linear-gradient(180deg,rgba(10,8,18,.85),rgba(10,8,18,0));
    backdrop-filter:blur(6px);z-index:5;transition:opacity .4s}
  #bar b{color:var(--ink);font-weight:600}
  #bar .right{margin-left:auto;color:var(--dim)}
  #hud{position:fixed;left:14px;bottom:74px;z-index:5;transition:opacity .4s;pointer-events:none}
  #hud .tag{font-size:11px;letter-spacing:.28em;color:var(--dim)}
  #hud .name{font-size:26px;font-weight:700;letter-spacing:.02em;
    text-shadow:0 0 24px rgba(159,216,208,.30)}
  #hud .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:8px;
    vertical-align:middle;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    max-width:min(96vw,880px);padding:8px;border:1px solid var(--edge);border-radius:14px;
    background:var(--panel);backdrop-filter:blur(12px);transition:opacity .4s}
  button,label.btn,input[type=text]{font:inherit;font-size:12px;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:9px;
    padding:7px 11px;transition:.15s}
  button,label.btn{cursor:pointer}
  button:hover,label.btn:hover{background:rgba(159,216,208,.14);border-color:var(--accent)}
  button.on{background:rgba(159,216,208,.20);border-color:var(--accent);color:#fff}
  .chip.on{box-shadow:0 0 0 1px var(--accent),0 0 14px rgba(159,216,208,.30)}
  input[type=text]{width:130px}
  input[type=text]:focus{outline:none;border-color:var(--accent)}
  .sep{width:1px;height:22px;background:var(--edge);margin:0 2px}
  .rng{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11px}
  input[type=range]{width:88px;accent-color:var(--accent)}
  .hide{opacity:0!important;pointer-events:none}
  #nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:24px;color:var(--dim);font-size:15px;line-height:1.6}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="bar">
  <b>hi friend</b>
  <span>After Dark — but it's 2026</span>
  <span class="right">type below to change the word</span>
</div>

<div id="hud">
  <div class="tag"><span class="dot"></span>SCREENSAVER · MODULE</div>
  <div class="name" id="fxName">Liquid Warp</div>
</div>

<div id="dock">
  <button id="play" class="on" title="freeze / resume">⏸</button>
  <div class="sep"></div>
  <button class="chip on" data-fx="0">Liquid</button>
  <button class="chip" data-fx="1">Neon</button>
  <button class="chip" data-fx="2">Kaleido</button>
  <button class="chip" data-fx="3">Dissolve</button>
  <div class="sep"></div>
  <input id="txt" type="text" value="Hi Friend" maxlength="24" spellcheck="false" title="the word">
  <div class="rng"><span>size</span><input id="size" type="range" min="0.4" max="2.6" step="0.01" value="1.5"></div>
  <div class="sep"></div>
  <button id="full" title="fullscreen">⤢</button>
</div>

<div id="nogl">WebGL isn't available on this browser/GPU.<br>Try a different browser or device.</div>

<script>
const FX = ["Liquid Warp","Neon Bloom","Kaleidoscope","Particle Dissolve"];
const HOLD = 8000, CROSS = 1700; // ms per module + crossfade

const cvs = document.getElementById('gl');
const gl = cvs.getContext('webgl',{alpha:false,antialias:true,premultipliedAlpha:false});
if(!gl){ document.getElementById('nogl').style.display='flex'; }

const VERT = `attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }`;

const FRAG = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform int   uFrom;
uniform int   uTo;
uniform float uBlend;
uniform float uScale;
uniform sampler2D uTex;

vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod(i,289.0);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m; m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5); vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*snoise(p); p*=2.02; a*=0.5;} return s; }
float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }

vec4 tex(vec2 uv){
  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) return vec4(0.0);
  return texture2D(uTex,uv);
}
float mask(vec2 uv){ return tex(uv).a; }   // white text on transparent

// subtle 3-stop gradient — the whole palette lives between a, b, c
vec3 grad3(vec3 a,vec3 b,vec3 c,float t){
  t=fract(t); float x=t*2.0;
  return x<1.0 ? mix(a,b,smoothstep(0.0,1.0,x)) : mix(b,c,smoothstep(0.0,1.0,x-1.0));
}
vec2 logoUV(vec2 c){ return c/uScale + 0.5; }

// ---------- 0: liquid warp · indigo → teal → peach ----------
vec3 fxLiquid(vec2 c,float t){
  t*=0.28;
  vec2 q=vec2(fbm(c*3.0+t), fbm(c*3.0+vec2(5.2,1.3)-t));
  vec2 r=vec2(fbm(c*3.0+q*1.6+vec2(1.7,9.2)+t*1.2),
              fbm(c*3.0+q*1.6+vec2(8.3,2.8)-t*1.1));
  float m=mask(logoUV(c+r*0.10));
  float g=fbm(c*2.4+r*1.8+t)*0.5+0.5;
  vec3 A=vec3(0.16,0.20,0.34), B=vec3(0.22,0.52,0.52), C=vec3(0.93,0.75,0.57);
  vec3 hot=grad3(A,B,C, g+t*0.05)*1.05;
  vec3 bg=A*0.22;
  vec3 col=mix(bg,hot,m);
  col+=m*0.08*vec3(r.x,q.y,r.y);
  return col;
}
// ---------- 1: neon bloom · icy cyan / dusty rose ----------
vec3 fxNeon(vec2 c,float t){
  vec2 uv=logoUV(c);
  float ca=0.0028+0.0022*sin(t*1.1);
  float mr=mask(uv+vec2(ca,0.0));
  float mg=mask(uv);
  float mb=mask(uv-vec2(ca,0.0));
  float glow=0.0;
  for(int i=0;i<14;i++){
    float a=float(i)/14.0*6.28318;
    vec2 o=vec2(cos(a),sin(a));
    glow+=mask(uv+o*0.016)*0.5 + mask(uv+o*0.038)*0.30 + mask(uv+o*0.068)*0.16;
  }
  glow/=14.0;
  vec3 tint=grad3(vec3(0.46,0.76,0.80), vec3(0.82,0.62,0.68), vec3(0.60,0.58,0.82), t*0.05);
  vec3 col=vec3(mr,mg,mb)*tint*1.08;
  col+=glow*tint*0.85*(0.78+0.22*sin(t*2.0));
  col+=vec3(0.015,0.013,0.028);
  return col;
}
// ---------- 2: kaleidoscope · plum → mauve → dim gold ----------
vec3 fxKaleido(vec2 c,float t){
  t*=0.2;
  float ang=atan(c.y,c.x);
  float rad=length(c);
  float seg=6.28318/8.0;
  ang=mod(ang+t,seg);
  ang=abs(ang-seg*0.5);
  vec2 kc=vec2(cos(ang),sin(ang))*rad;
  float zoom=0.85+0.35*sin(t*1.4);
  vec2 uv=logoUV(kc*zoom + 0.12*vec2(sin(t*0.7),cos(t*0.5)));
  float m=mask(uv);
  vec3 A=vec3(0.20,0.14,0.26), B=vec3(0.52,0.30,0.40), C=vec3(0.86,0.72,0.48);
  vec3 kcol=grad3(A,B,C, fract(rad*1.2+t))*1.05;
  vec3 bg=A*0.30;
  return mix(bg,kcol,m);
}
// ---------- 3: particle dissolve · slate → sage → pale sand ----------
vec3 fxDissolve(vec2 c,float t){
  float phase=0.5+0.5*sin(t*0.5);
  vec2 uv=logoUV(c);
  float n2=snoise(uv*32.0);
  vec2 drift=vec2(n2,fbm(uv*11.0-t))*phase*0.16;
  float m=mask(uv-drift);
  float n=fbm(uv*16.0+t*0.5)*0.5+0.5;
  float th=smoothstep(phase-0.16,phase+0.16,n);
  m*=th;
  vec3 A=vec3(0.12,0.16,0.18), B=vec3(0.42,0.60,0.54), C=vec3(0.84,0.81,0.65);
  vec3 pcol=grad3(A,B,C, fract(uv.x*0.6+uv.y*0.4+t*0.05))*1.05;
  vec3 col=A*0.28;
  col=mix(col,pcol,m);
  vec2 cell=floor(uv*44.0);
  vec2 f=fract(uv*44.0+vec2(0.0,t*0.6))-0.5;
  float spark=smoothstep(0.42,0.0,length(f))*step(0.88,hash(cell))*phase*mask(uv);
  col+=spark*pcol*1.1;
  return col;
}
vec3 effect(int id,vec2 c,float t){
  if(id==0) return fxLiquid(c,t);
  if(id==1) return fxNeon(c,t);
  if(id==2) return fxKaleido(c,t);
  return fxDissolve(c,t);
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float a=uRes.x/uRes.y;
  vec2 c=uv-0.5;
  if(a>1.0) c.x*=a; else c.y/=a;
  vec3 col;
  if(uBlend<=0.0) col=effect(uFrom,c,uTime);
  else col=mix(effect(uFrom,c,uTime), effect(uTo,c,uTime), uBlend);
  col*=1.0-0.5*dot(c,c);
  col=col/(col+vec3(0.85));   // soft tonemap, keeps it subtle
  col=pow(col,vec3(0.90));
  gl_FragColor=vec4(col,1.0);
}
`;

function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ console.warn(gl.getShaderInfoLog(s)); }
  return s; }
let prog,U={};
if(gl){
  prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uRes","uTime","uFrom","uTo","uBlend","uScale","uTex"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  const tx=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.uniform1i(U.uTex,0);
}

// ---------- render the word to the texture (white on transparent) ----------
const TEXSZ=1024;
function renderText(txt){
  if(!gl) return;
  txt=(txt||"").trim()||"Hi Friend";
  const cn=document.createElement('canvas'); cn.width=cn.height=TEXSZ;
  const cx=cn.getContext('2d');
  cx.clearRect(0,0,TEXSZ,TEXSZ);
  cx.fillStyle='#fff';
  cx.textAlign='center'; cx.textBaseline='middle';
  try{ cx.letterSpacing='6px'; }catch(e){}
  let fs=360;
  cx.font=`800 ${fs}px "Helvetica Neue",Arial,sans-serif`;
  const w=cx.measureText(txt).width || 1;
  fs=Math.min(fs, fs*(TEXSZ*0.9)/w, TEXSZ*0.55);
  cx.font=`800 ${fs}px "Helvetica Neue",Arial,sans-serif`;
  cx.fillText(txt, TEXSZ/2, TEXSZ/2 + fs*0.03);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cn);
}

let cur=0,next=0,blending=false,blendStart=0,holdStart=0;
let clock=0,last=performance.now(),paused=false;
let scale=1.5;

function setFxName(i){ document.getElementById('fxName').textContent=FX[i];
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.fx===i)); }
function jump(i){ if(i===cur&&!blending){setFxName(i);return;}
  if(blending){cur=next;blending=false;}
  next=i; blending=true; blendStart=clock; setFxName(i); }

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.floor(innerWidth*dpr), h=Math.floor(innerHeight*dpr);
  if(cvs.width!==w||cvs.height!==h){ cvs.width=w; cvs.height=h; gl&&gl.viewport(0,0,w,h); }
}
addEventListener('resize',resize);

function frame(now){
  const dt=now-last; last=now;
  if(!paused) clock+=dt;
  resize();
  if(gl){
    let blend=0,from=cur,to=cur;
    if(!blending && !paused && clock-holdStart>HOLD){ next=(cur+1)%4; blending=true; blendStart=clock; setFxName(next); }
    if(blending){
      let b=(clock-blendStart)/CROSS;
      if(b>=1){ cur=next; blending=false; holdStart=clock; blend=0; from=cur; to=cur; }
      else { b=b*b*(3.0-2.0*b); blend=b; from=cur; to=next; }
    }
    gl.uniform2f(U.uRes,cvs.width,cvs.height);
    gl.uniform1f(U.uTime,clock/1000);
    gl.uniform1i(U.uFrom,from);
    gl.uniform1i(U.uTo,to);
    gl.uniform1f(U.uBlend,blend);
    gl.uniform1f(U.uScale,scale);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
}

document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>jump(+b.dataset.fx));
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{ paused=!paused; playBtn.textContent=paused?'▶':'⏸'; playBtn.classList.toggle('on',!paused); last=performance.now(); };
document.getElementById('size').oninput=e=>scale=+e.target.value;
document.getElementById('full').onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };
const txt=document.getElementById('txt');
txt.addEventListener('input',()=>renderText(txt.value));
txt.addEventListener('keydown',e=>e.stopPropagation()); // let spaces type without pausing

let idle; const chrome=[document.getElementById('bar'),document.getElementById('hud'),document.getElementById('dock')];
function wake(){ chrome.forEach(el=>el.classList.remove('hide')); clearTimeout(idle);
  idle=setTimeout(()=>chrome.forEach(el=>el.classList.add('hide')),2800); }
['mousemove','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,wake));
wake();

addEventListener('keydown',e=>{
  if(document.activeElement===txt) return;
  if(e.key>='1'&&e.key<='4') jump(+e.key-1);
  else if(e.key===' '){ e.preventDefault(); playBtn.click(); }
});

resize(); setFxName(0);
if(gl){ renderText("Hi Friend"); holdStart=clock; requestAnimationFrame(frame); }
</script>
</body>
</html>

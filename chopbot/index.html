<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chopbot</title>
<style>
/* Skin lifted from xlang panel: fixed palette, fiducials, beacon, black-gapped hue grid. */
:root{--k:#000;--w:#f3ede2;--bg:#666;--fid:min(13vmin,96px);--gap:max(4px,.9vmin)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k:#000;--w:#f3ede2}}
:root[data-theme="dark"]{--k:#000;--w:#f3ede2}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--w);display:grid;grid-template-rows:var(--fid) 1fr var(--fid);gap:var(--gap);
  padding:var(--gap) calc(var(--gap) + env(safe-area-inset-right,0px)) var(--gap) calc(var(--gap) + env(safe-area-inset-left,0px));
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif}
.bar{display:grid;grid-template-columns:var(--fid) 1fr var(--fid);gap:var(--gap);min-height:0}
.fid{background:var(--w);padding:14%}
.fid{position:relative}
button.fid{all:unset;box-sizing:border-box;display:block;background:var(--w);padding:14%;position:relative;cursor:pointer}
button.fid:active,button.fid.busy{background:#e33}
button.fid:focus-visible{outline:2px dashed var(--w);outline-offset:2px}
.fid .cap{position:absolute;left:0;right:0;bottom:2%;text-align:center;color:#000;font:700 clamp(7px,1.4vmin,12px) ui-monospace,Menlo,monospace;letter-spacing:.12em}
.t .ss{position:absolute;top:4%;right:4%;width:max(26px,5.5vmin);height:max(26px,5.5vmin);display:grid;place-items:center;
  background:#000;color:#fff;font:700 clamp(11px,2.4vmin,20px) ui-monospace,Menlo,monospace;border-radius:2px}
.t.empty .ss{display:none}
.fid .g{display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);width:100%;height:100%}
.fid .g i,.beacon i{background:var(--k)}
.fid .g i.on,.beacon i.on{background:var(--w)}
.beacon{background:var(--w);padding:max(4px,1.2vmin);display:grid;grid-template-columns:repeat(16,1fr);min-width:0}
.beacon i{border:max(1px,.25vmin) solid var(--w)}
.beacon i.on{background:#e33}
/* control strip (replaces xlang log) */
.ctl{display:flex;flex-wrap:wrap;align-items:center;align-content:center;gap:max(3px,.6vmin);padding:0 1ch;min-width:0;overflow:hidden;
  border:max(2px,.4vmin) solid var(--w);font-family:ui-monospace,Menlo,Consolas,monospace}
.k{all:unset;cursor:pointer;background:var(--w);color:#000;font:700 clamp(10px,2.3vmin,20px) ui-monospace,Menlo,monospace;padding:.3em .7em}
.k:focus-visible{outline:2px dashed var(--w);outline-offset:2px}
.k.on{background:#e33;color:#fff}
#st{flex:1 1 12ch;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,2.3vmin,20px);opacity:.85}
@media (orientation:portrait){#st{flex-basis:100%}}
/* pads */
.pad{display:grid;gap:var(--gap);background:#000;padding:var(--gap);grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);min-height:0}
@media (orientation:portrait){.pad{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr)}}
.t{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;
  background:var(--c);color:var(--f);cursor:pointer;min-height:0;overflow:hidden}
.t:focus-visible{outline:max(3px,.6vmin) dashed var(--w);outline-offset:calc(var(--gap) * -.5)}
.t svg{width:52%;height:42%;flex:none}
.t .lb{font-size:clamp(12px,3.4vmin,30px);letter-spacing:.04em}
.t .hx{position:absolute;top:6%;left:6%;font:700 clamp(10px,2vmin,18px) ui-monospace,Menlo,monospace}
.t .bits{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);display:flex;gap:max(2px,.5vmin)}
.t .bits u{width:max(8px,2.2vmin);height:max(8px,2.2vmin);border:max(2px,.35vmin) solid currentColor}
.t .bits u.on{background:currentColor}
.t.empty{background:#161616;color:var(--c)}
.t.held{background:var(--f);color:var(--c)}
.t.muted{background:repeating-linear-gradient(45deg,var(--c) 0 12px,#000 12px 24px);color:var(--w)}
.t.muted .lb{background:#000;padding:0 .3em}
.t.rec{background:#000;color:#f33;animation:blink .5s steps(1) infinite}
.t.drop{outline:max(3px,.6vmin) dashed var(--w);outline-offset:calc(var(--gap) * -1.5)}
@keyframes blink{50%{color:#600}}
@media (prefers-reduced-motion:reduce){.t.rec{animation:none}}
</style>
</head>
<body>
<div class="bar">
  <button class="fid" data-id="0" id="fWav" title="export mix as WAV (4 loops)"><span class="cap">WAV</span></button>
  <div class="beacon" id="beacon" aria-label="loop playhead"></div>
  <button class="fid" data-id="1" id="fSave" title="save session (.chopbot)"><span class="cap">SAVE</span></button>
</div>
<div class="pad" id="pad"></div>
<div class="bar">
  <button class="fid" data-id="2" id="fLoad" title="load session or audio file"><span class="cap">LOAD</span></button>
  <input type="file" id="fin" accept=".chopbot,.json,audio/*" hidden>
  <div class="ctl">
    <button class="k" id="bMic">MIC</button>
    <button class="k" id="bStop">STOP</button>
    <button class="k" id="bChop">CHOP</button>
    <button class="k" id="bStr">STR8</button>
    <button class="k" id="bClr">CLR</button>
    <span id="st">tap MIC · then hold a tile to record</span>
  </div>
  <div class="fid" data-id="3"></div>
</div>
<script>
// ── skin bits (from xlang panel)
const SH={
 oct:'<polygon points="30,5 70,5 95,30 95,70 70,95 30,95 5,70 5,30"/>',dot:'<circle cx="50" cy="50" r="42"/>',
 scan:'<g fill="none" stroke="currentColor" stroke-width="10"><circle cx="50" cy="50" r="32"/><path d="M50 0v100M0 50h100"/></g>',
 play:'<polygon points="18,8 92,50 18,92"/>',up:'<polygon points="50,4 96,50 70,50 70,96 30,96 30,50 4,50"/>',
 ok:'<polyline points="8,52 38,82 94,18" fill="none" stroke="currentColor" stroke-width="14"/>',
 lt:'<polygon points="4,50 50,4 50,30 96,30 96,70 50,70 50,96"/>',rt:'<polygon points="96,50 50,4 50,30 4,30 4,70 50,70 50,96"/>',
 dn:'<polygon points="50,96 96,50 70,50 70,4 30,4 30,50 4,50"/>',ring:'<circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="12"/>',
 home:'<polygon points="50,4 96,46 80,46 80,96 20,96 20,46 4,46"/>',no:'<path d="M12 12L88 88M88 12L12 88" stroke="currentColor" stroke-width="14"/>'
};
const SHAPES=Object.keys(SH),N=12,HUE=id=>id*30+8,SAT=.66,LIT=.5;
function ink(h){const a=SAT*Math.min(LIT,1-LIT),f=n=>{const k=(n+h/30)%12;return LIT-a*Math.max(-1,Math.min(k-3,9-k,1))};
  return .2126*f(0)+.7152*f(8)+.0722*f(4)>.42?'#000':'var(--w)'}
const FID=[0xB26D,0x5A3C,0xC9A6,0x3E51];
document.querySelectorAll('.fid').forEach(el=>{const p=FID[+el.dataset.id],g=document.createElement('div');g.className='g';
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){const i=document.createElement('i'),edge=r==0||c==0||r==5||c==5;
    if(!edge&&(p>>(15-((r-1)*4+(c-1))))&1)i.className='on';g.appendChild(i)}el.appendChild(g)});
const $=s=>document.querySelector(s),beacon=$('#beacon'),pad=$('#pad'),st=$('#st');
for(let i=0;i<16;i++)beacon.appendChild(document.createElement('i'));
const say=m=>st.textContent=m;

// ── audio core
let ac,out,sr,LAT=.08;
let mic=null,ring,ringLen=0,ringW=0,ringT=0;   // rolling mic buffer: always listening once armed, so a hold captures from the press
let L=0,Ls=0,t0=0,step=0,nextT=0,timer=null;const live=new Set();   // loop length (s / samples), clock origin, scheduler
const T=[...Array(N)].map(()=>({buf:null,muted:false,map:[...Array(16).keys()],peaks:null}));

function initAudio(){
  if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();sr=ac.sampleRate;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=8;
  out=ac.createGain();out.gain.value=.9;out.connect(comp).connect(ac.destination);
}
async function armMic(){
  initAudio();if(ac.state==='suspended')ac.resume();if(mic)return;
  say('asking for mic…');
  try{
    // echoCancellation ON on purpose: lets the browser subtract its own loop playback from the mic (less feedback pile-up)
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(s),sp=ac.createScriptProcessor(2048,1,1),z=ac.createGain();z.gain.value=0;
    ringLen=sr*20;ring=new Float32Array(ringLen);
    sp.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0);for(let i=0;i<d.length;i++)ring[(ringW+i)%ringLen]=d[i];ringW+=d.length;ringT=ac.currentTime};
    src.connect(sp);sp.connect(z).connect(ac.destination);mic=s;
    LAT=Math.min(.3,(ac.outputLatency||ac.baseLatency||.02)+.06);   // rough round-trip guess
    $('#bMic').classList.add('on');say('mic live · hold a tile to record (headphones help)');
  }catch(err){say('mic blocked: '+err.name+' · drop audio files on tiles instead')}
}

// pull [a,b] seconds (audio clock) out of the ring, shifted by latency; waits until the ring has caught up
function grab(a,b){return new Promise(res=>{
  const need=b+LAT+.03;
  (function poll(){if(ringT<need)return setTimeout(poll,25);
    const n=Math.min(Math.round((b-a)*sr),ringLen-sr),end=ringW-Math.round((ringT-(b+LAT))*sr),s=end-n,o=new Float32Array(Math.max(0,n));
    for(let i=0;i<o.length;i++)o[i]=ring[(((s+i)%ringLen)+ringLen)%ringLen];res(o)})();
})}

function commit(id,data,off){
  let pk=0;for(const v of data)pk=Math.max(pk,Math.abs(v));
  const g=pk>.02?.9/pk:1,arr=new Float32Array(Ls);
  for(let i=0;i<data.length;i++)arr[(off+i)%Ls]=data[i]*g;   // wraps; if longer than the loop, last pass wins
  setTrack(id,arr,sr);T[id].muted=false;paint(id);
}
function setTrack(id,arr,rate){
  const n=arr.length,b=ac.createBuffer(1,n,rate);b.copyToChannel(arr,0);
  const tr=T[id];tr.buf=b;tr.peaks=[];
  for(let k=0;k<32;k++){let m=0;const a=Math.floor(k*n/32),z=Math.floor((k+1)*n/32);for(let i=a;i<z;i+=8)m=Math.max(m,Math.abs(arr[i]));tr.peaks.push(m)}
}

function startClock(at){t0=at;nextT=at;step=0;clearInterval(timer);timer=setInterval(tick,25);$('#bStop').textContent='STOP'}
function tick(){
  const sd=L/16;
  while(nextT<ac.currentTime+.12){
    const s=step,t=nextT;playStep(s,t,sd);
    setTimeout(()=>[...beacon.children].forEach((c,i)=>c.classList.toggle('on',i===s)),Math.max(0,(t-ac.currentTime)*1000));
    step=(step+1)%16;nextT+=sd;
  }
}
function playStep(s,t,sd,cx=ac,dest=out){
  T.forEach(tr=>{
    if(!tr.buf||tr.muted)return;const m=tr.map[s];if(m<0)return;
    const src=cx.createBufferSource(),g=cx.createGain(),v=.55;src.buffer=tr.buf;
    if(cx===ac){live.add(src);src.onended=()=>live.delete(src)}
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);   // tiny fades = fewer clicks at slice seams
    g.gain.setValueAtTime(v,t+sd-.006);g.gain.linearRampToValueAtTime(0,t+sd);
    src.connect(g).connect(dest);src.start(t,m*sd,sd+.01);
  });
}

// ── press / hold logic
const holds=new Map();
function down(key,id){
  if(holds.has(key))return;initAudio();if(ac.state==='suspended')ac.resume();
  if(!mic){armMic();return}
  const t=pad.children[id],h={id,t:ac.currentTime,to:null};holds.set(key,h);
  if(T[id].buf){t.classList.add('held');h.to=setTimeout(()=>{t.classList.remove('held');t.classList.add('rec');paint(id,'REC')},300)}
  else{t.classList.add('rec');paint(id,'REC')}
}
async function up(key){
  const h=holds.get(key);if(!h)return;holds.delete(key);clearTimeout(h.to);
  const {id}=h,tp=h.t,tr=ac.currentTime,dur=tr-tp,el=pad.children[id];el.classList.remove('held','rec');
  if(T[id].buf&&dur<.3){T[id].muted=!T[id].muted;paint(id);return}         // tap on a loop = mute toggle
  if(!T[id].buf&&dur<.25){paint(id);say('hold longer to record');return}
  let off=0;
  if(!L){L=Math.min(12,Math.max(.5,dur));Ls=Math.round(L*sr);startClock(tr);say(`loop set: ${L.toFixed(2)}s · keep stacking`)}
  else if(timer)off=Math.round((((tp-t0)%L)+L)%L*sr);
  paint(id,'…');
  const data=await grab(tp,tr);
  if(!Ls)return paint(id);                                                  // cleared mid-capture
  commit(id,data,off);
}
function paint(id,lab){
  const t=pad.children[id],tr=T[id];
  t.classList.toggle('empty',!tr.buf);t.classList.toggle('muted',!!tr.buf&&tr.muted);
  t.querySelector('.ss').textContent=tr.muted?'▶':'■';
  t.querySelector('.lb').textContent=lab||(!tr.buf?'HOLD':tr.muted?'MUTE':'LOOP');
  t.querySelector('svg').innerHTML=tr.buf
    ?`<path d="${tr.peaks.map((p,k)=>{const x=k*3.125+1.5,y=Math.max(1.5,p*46);return`M${x} ${50-y}V${50+y}`}).join('')}" stroke="currentColor" stroke-width="2.2"/>`
    :SH[SHAPES[id]];
}

for(let id=0;id<N;id++){
  const t=document.createElement('button');t.className='t empty';t.setAttribute('aria-label','pad '+id);
  t.style.setProperty('--c',`hsl(${HUE(id)},${SAT*100}%,${LIT*100}%)`);t.style.setProperty('--f',ink(HUE(id)));
  t.innerHTML=`<span class="hx">${id.toString(16).toUpperCase()}</span><svg viewBox="0 0 100 100" fill="currentColor"></svg><span class="lb"></span><span class="ss" aria-hidden="true"></span><span class="bits">${[3,2,1,0].map(k=>`<u class="${id>>k&1?'on':''}"></u>`).join('')}</span>`;
  t.addEventListener('pointerdown',e=>{e.preventDefault();if(e.target.closest('.ss')&&T[id].buf){T[id].muted=!T[id].muted;paint(id);return}try{t.setPointerCapture(e.pointerId)}catch(_){}down('p'+e.pointerId,id)});
  ['pointerup','pointercancel'].forEach(ev=>t.addEventListener(ev,e=>up('p'+e.pointerId)));
  t.addEventListener('contextmenu',e=>e.preventDefault());
  // drag a file onto a tile: first file sets the loop length, later ones get cropped to it
  t.addEventListener('dragover',e=>{e.preventDefault();t.classList.add('drop')});
  t.addEventListener('dragleave',()=>t.classList.remove('drop'));
  t.addEventListener('drop',async e=>{
    e.preventDefault();t.classList.remove('drop');const f=e.dataTransfer.files[0];if(f)loadFile(f,id);
  });
  pad.appendChild(t);paint(id);
}

// ── snipchop-style chaos: per-track step maps (−1 = rest)
function chop(){
  if(!L)return say('record something first');
  T.forEach(tr=>{if(!tr.buf)return;tr.map=tr.map.map((_,i,a)=>{const r=Math.random();
    return r<.3?Math.floor(Math.random()*16):r<.42&&i?a[i-1]:r<.48?-1:i})});
  say('chopped · CHOP again to reroll, STR8 to undo');
}
function straight(){T.forEach(tr=>tr.map=[...Array(16).keys()]);say('straight')}
function clearAll(){
  clearInterval(timer);timer=null;L=0;Ls=0;live.forEach(s=>{try{s.stop()}catch(_){}});live.clear();$('#bStop').textContent='STOP';
  T.forEach((tr,i)=>{tr.buf=null;tr.muted=false;tr.map=[...Array(16).keys()];paint(i)});
  [...beacon.children].forEach(c=>c.classList.remove('on'));say(mic?'cleared · hold a tile to set a new loop':'cleared');
}
async function loadFile(f,id){
  initAudio();if(ac.state==='suspended')ac.resume();
  if(/\.(chopbot|json)$/i.test(f.name))return loadSession(f);
  if(id==null){id=T.findIndex(tr=>!tr.buf);if(id<0)return say('no empty pad · CLR or drop onto a pad')}
  try{const ab=await f.arrayBuffer(),b=await new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej));
    const mono=new Float32Array(b.length);for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++)mono[i]+=d[i]/b.numberOfChannels}
    if(!L){L=Math.min(12,Math.max(.5,b.duration));Ls=Math.round(L*sr);startClock(ac.currentTime+.05)}
    commit(id,mono.subarray(0,Ls),0);say(`${f.name} → pad ${id.toString(16).toUpperCase()}`);
  }catch(err){say('could not decode that file')}
}

// ── transport
function transport(){
  initAudio();if(!L)return say('nothing to stop · record something');
  if(timer){clearInterval(timer);timer=null;live.forEach(s=>{try{s.stop()}catch(_){}});live.clear();
    [...beacon.children].forEach(c=>c.classList.remove('on'));$('#bStop').textContent='PLAY';say('stopped · PLAY or space to restart')}
  else{if(ac.state==='suspended')ac.resume();startClock(ac.currentTime+.05);say('playing')}
}

// ── files: WAV mix export, session save/load (fiducials)
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function wav(f,rate){const n=f.length,v=new DataView(new ArrayBuffer(44+n*2)),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,f[i]))*32767,true);return new Blob([v],{type:'audio/wav'})}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
async function exportWav(){
  if(!L)return say('nothing to export yet');const el=$('#fWav');el.classList.add('busy');say('rendering…');
  try{const loops=4,sd=L/16,cx=new OfflineAudioContext(1,Math.ceil(L*loops*sr),sr);   // same chain as live: gain → compressor
    const comp=cx.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=8;
    const o=cx.createGain();o.gain.value=.9;o.connect(comp).connect(cx.destination);
    for(let s=0;s<16*loops;s++)playStep(s%16,s*sd,sd,cx,o);
    const r=await cx.startRendering();dl(wav(r.getChannelData(0),sr),`chopbot-${stamp()}.wav`);say('WAV exported · 4 loops, chop as heard');
  }catch(err){say('export failed: '+err.name)}finally{el.classList.remove('busy')}
}
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
function saveSession(){
  if(!L)return say('nothing to save yet');
  const tracks=T.map(tr=>{if(!tr.buf)return null;const d=tr.buf.getChannelData(0),q=new Int16Array(d.length);
    for(let i=0;i<d.length;i++)q[i]=Math.max(-1,Math.min(1,d[i]))*32767;
    return{muted:tr.muted,map:tr.map,rate:tr.buf.sampleRate,pcm:b64(new Uint8Array(q.buffer))}});
  dl(new Blob([JSON.stringify({chopbot:1,L,tracks})],{type:'application/json'}),`session-${stamp()}.chopbot`);say('session saved');
}
async function loadSession(f){
  try{const j=JSON.parse(await f.text());if(!j.chopbot)throw Error('not a chopbot file');
    clearAll();L=j.L;Ls=Math.round(L*sr);
    j.tracks.forEach((t,id)=>{if(!t||id>=N)return;const bin=atob(t.pcm),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const q=new Int16Array(u.buffer),a=new Float32Array(q.length);
      for(let i=0;i<q.length;i++)a[i]=q[i]/32767;setTrack(id,a,t.rate);T[id].muted=!!t.muted;T[id].map=t.map;paint(id)});
    startClock(ac.currentTime+.05);say(`loaded ${f.name}`);
  }catch(err){say('could not load: '+err.message)}
}
const fin=$('#fin');
$('#fWav').onclick=exportWav;$('#fSave').onclick=saveSession;$('#fLoad').onclick=()=>fin.click();
fin.onchange=()=>{const f=fin.files[0];fin.value='';if(f)loadFile(f)};
$('#bStop').onclick=transport;
$('#bMic').onclick=armMic;$('#bChop').onclick=chop;$('#bStr').onclick=straight;$('#bClr').onclick=clearAll;

// keys: 0–9 a b hold to record/tap to mute · c chop · s straight · x clear · space stop/play
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase(),n=parseInt(k,16);
  if(k===' '){e.preventDefault();return transport()}if(k==='c')return chop();if(k==='s')return straight();if(k==='x')return clearAll();
  if(!isNaN(n)&&n<N&&k.length===1)down('k'+n,n)});
addEventListener('keyup',e=>{const n=parseInt(e.key,16);if(!isNaN(n)&&n<N)up('k'+n)});
addEventListener('blur',()=>[...holds.keys()].forEach(up));
</script>
</body>
